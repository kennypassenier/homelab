[package]
name = "homelab-admin"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition.workspace = true
description = "Homelab admin dashboard: a browser front for the HOST daemon, on chassis-rs"

[[bin]]
name = "homelab-admin"
path = "src/main.rs"

[features]
# demo-host (Kenny, 2026-09-28, "Only in test builds"): a simulated host
# inside the process (HOMELAB_ADMIN_DEMO_HOST=1) for the browser tests and
# the smoke run. `make release` builds without it, so a released dashboard
# cannot be started against a fake host.
demo-host = []

[dependencies]
homelab-proto = { path = "../proto" }
# milestone act: the deploy guard and the history types, shared with the CLI.
homelab-core = { path = "../core" }
# arch-crates: the client library (link, tls) without the terminal UI.
homelab-client = { path = "../client", default-features = false }
# tech-chassis-dep: a released chassis-rs only, never a rev or a path.
chassis = { git = "https://github.com/kennypassenier/chassis-rs", tag = "v3.1.0", default-features = false, features = ["core", "webapp", "live", "passkeys", "request-guard"] }
axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
thiserror.workspace = true
toml.workspace = true
base64.workspace = true
# chassis brings rustls with `ring`, the client with `aws-lc-rs`; with both
# compiled in, rustls cannot pick one and panics on the first handshake.
# main() installs the client's provider explicitly.
rustls = "0.23"
# arch-exposure, lock 1: the Access key set is fetched with the HTTP client
# chassis already carries (same version and features, nothing new built),
# and the RS256 signature checked with aws-lc-rs, which rustls already
# compiles in (no new C code).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
aws-lc-rs = "1"
# feat-platform-10: a driven field is checked against the same pattern the
# browser checks (formspec.json); already in the tree.
regex = "1"

[dev-dependencies]
# milestone act: the action routes are called in-process (already in the tree
# through axum).
tower = { version = "0.5", features = ["util"] }
# Live view: the countdown and the pause are tested on paused time.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
