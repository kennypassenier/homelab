services:
  alertmanager:
    # fix-82 (manual-images-latest-unpinned, 2026-09-27): the version and
    # digest CT 113 ran that day; moving it is an edit of this line.
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /appdata/metrics/alertmanager-config:/alertmanager
    ports:
      - "9093:9093"
    labels:
      - com.homelab.update.policy=manual
      - com.homelab.update.upstream=github.com/prometheus/alertmanager
    networks:
      - metrics_net

networks:
  metrics_net:
    external: true
    name: metrics_net
