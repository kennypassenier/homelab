# What "prowlarr is healthy" means, from the readings made by hand during the
# CT 106 rebuild. The API key comes from prowlarr's own config file: a key
# stored here would be a secret in the wrong place, and one that would rot
# unnoticed the way Jellyfin's did (F131).
checks:
  - name: "indexers"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/prowlarr-config/config.xml);
      printf 'header = "X-Api-Key: %s"\n' "$K" | curl -s -m 40  -K - http://127.0.0.1:9696/api/v1/indexer |
      grep -cE '"definitionName":'
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts what prowlarr knows about, not whether the files behind it are
      readable.

  - name: "health notifications"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/prowlarr-config/config.xml);
      printf 'header = "X-Api-Key: %s"\n' "$K" | curl -s -m 40  -K - http://127.0.0.1:9696/api/v1/health |
      grep -oE '"type":' | wc -l
    expect: must_be_present
    layer: application
    blind_spot: >-
      How many warnings there are, not whether they matter. Three failing
      indexers during the rebuild were all healthy an hour later.

# checks-automate (Kenny, 2026-09-30: "Alles wat kan"): the questions a
# machine can answer, measured in every fleet check. Tried once for real on
# 2026-09-30, read-only; the reading then is in each probe's comment.
probes:
  # Read 2026-09-30: 0.
  - name: "indexers that are failing or disabled"
    command: |
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/prowlarr-config/config.xml)
      C=$(mktemp); trap 'rm -f "$C"' EXIT; printf "header = %s\n" "X-Api-Key: $K" > "$C"
      wget --config="$C" -qO- http://localhost:9696/api/v1/indexerstatus | jq length
    healthy: {equals: "0"}
    layer: application
    id: prowlarr-indexers-failing-or-disabled
    blind_spot: "Prowlarr's own view of its indexers; no search is run (that would load the indexers every night)"
  # Read 2026-09-30: 0.
  - name: "health notifications from Prowlarr"
    command: |
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/prowlarr-config/config.xml)
      C=$(mktemp); trap 'rm -f "$C"' EXIT; printf "header = %s\n" "X-Api-Key: $K" > "$C"
      wget --config="$C" -qO- http://localhost:9696/api/v1/health | jq length
    healthy: {equals: "0"}
    layer: application
    id: prowlarr-health-notifications
