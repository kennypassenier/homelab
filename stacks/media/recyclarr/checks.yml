# What "Recyclarr is doing its job" means.
#
# The distinction this file is built around: Recyclarr RUNNING is not
# Recyclarr WORKING. It is a cron container that sits idle 23 hours a day, and
# a config it cannot parse, an API key that has gone stale or a guide it
# cannot reach all leave it running exactly the same. It even exits 0 on a
# configuration it refused — measured 2026-09-04, a duplicate instance name
# printed an error panel and returned success. So nothing here asks whether
# the container is up; every check reads what it PUT in Sonarr and Radarr,
# which is the only evidence that it ran and was believed.
#
# The two profile checks are deliberately whole fingerprints rather than
# counts. A count of "formats with a score" cannot tell +50 from -10000, and
# the difference between those two is the difference between preferring x264
# and refusing every x265 release in the house.
checks:
  - name: "Radarr 1080p · toegestane kwaliteiten"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/radarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:7878/api/v3/qualityprofile/4 |
      jq -r '[.items[]|select(.allowed)|(.quality.name // .name)]|sort|join(",")'
    expect: must_match
    layer: application
    blind_spot: >-
      Reads the profile the 961 films point at. It says which qualities are
      allowed, not that anything was downloaded in them — and a change here is
      not automatically wrong: the TRaSH guides move, and this is where that
      becomes visible instead of silent.

  - name: "Radarr 1080p · scores"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/radarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:7878/api/v3/qualityprofile/4 |
      jq -r '[.formatItems[]|select(.score!=0)|"\(.name)=\(.score)"]|sort|join(" ")'
    expect: must_match
    layer: application
    blind_spot: >-
      Every score that is not zero, by name. It cannot say whether the scores
      are GOOD — only that they are the ones that were there yesterday, and
      that R4 (x264 above x265) and R6 (dubbed at -10000) are still in them.

  - name: "Sonarr 1080p · toegestane kwaliteiten"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/sonarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:8989/api/v3/qualityprofile/4 |
      jq -r '[.items[]|select(.allowed)|(.quality.name // .name)]|sort|join(",")'
    expect: must_match
    layer: application
    blind_spot: >-
      This is the one place the repository overrides the guide — TRaSH's
      WEB-1080p allows WEB and nothing else, R1 says the ceiling is
      Bluray-1080p. If a future Recyclarr stops honouring the override, the
      Bluray entries disappear from this line and 210 series quietly stop
      grabbing Bluray releases. That is exactly what this check is for.

  - name: "Sonarr 1080p · scores"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/sonarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:8989/api/v3/qualityprofile/4 |
      jq -r '[.formatItems[]|select(.score!=0)|"\(.name)=\(.score)"]|sort|join(" ")'
    expect: must_match
    layer: application
    blind_spot: >-
      Carries R5 (the lossy formats at +25 and the lossless ones absent, so
      lossless never wins) and R6 (Dubs Only at -10000). Same limit as its
      Radarr twin: it compares, it does not judge.

  - name: "custom formats in Radarr"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/radarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:7878/api/v3/customformat |
      jq -r 'length'
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts the formats that exist, not their scores — the two checks above
      are what read those. It is here because a drop means Recyclarr deleted
      formats, and `delete_old_custom_formats` is on.

  - name: "custom formats in Sonarr"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/sonarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:8989/api/v3/customformat |
      jq -r 'length'
    expect: never_decreases
    layer: application
    blind_spot: >-
      Same blind spot as its Radarr twin.

  - name: "laatste sync zonder fout afgesloten"
    command: >-
      docker logs --since 26h recyclarr 2>&1 | grep -cE 'ERR\]|Configuration Errors' || true
    expect: must_match
    layer: application
    blind_spot: >-
      Reads what the container said in the last 26 hours — a window wider than
      its daily schedule, so one skipped night still shows the previous run
      rather than reading as clean. 0 is a clean run. It cannot tell a clean
      run from no run at all; the four profile checks are what notice that,
      because a Recyclarr that never ran leaves the scores where they were.

manual:
  - "Kijk in Radarr bij Settings › Profiles of het 1080p-profiel er nog uitziet zoals je wil, één keer na de eerste sync."
