# Homepage is the page Kenny opens first, which makes an empty one the most
# expensive kind of broken: it answers, it looks like a dashboard, and it
# tells him nothing is wrong because it tells him nothing at all.
#
# Measured 2026-09-01 while writing this: every config file under
# `homepage-config/` contains zero `href` entries and `services.yaml` is 0
# bytes. The page renders and lists nothing (T51 is the task to generate it
# from the manifest instead of by hand).
#
# 2026-09-02: T51 now writes that file — and the compose mounts a
# hand-written one read-only over the top of it (F188), so the generated
# half has never been visible. Which of the two is the truth is Kenny's
# open decision; this file only measures what the container really reads.
checks:
  - name: "diensten op de startpagina"
    # F189: this used to grep the rendered HTML for `href="http` and could
    # only ever answer 0. Homepage is a Next.js app that draws its tiles in
    # the browser, so the HTML it serves contains eleven links and every one
    # of them is a stylesheet, a favicon or the web manifest. Measured
    # 2026-09-02: the page mentions jellyfin, renders fine, and the check
    # said zero — for months, on the reading meant to prove the page is not
    # empty. Now it counts entries in the file the container actually reads,
    # which is a number that moves when reality does.
    command: >-
      docker exec homepage sh -c 'grep -c "href:" /app/config/services.yaml'
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts what the page is configured to show, not what it renders and
      not whether any of those services answers. Homepage draws a tile for a
      service that is down exactly as it draws one for a service that is up.
      It also reads the file at the path the CONTAINER sees, which is the
      point: a generated file shadowed by another mount at the same path
      counts zero here, which is how F188 was found.

  - name: "de startpagina antwoordt"
    command: "curl -s -m 15 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/"
    expect: must_match
    layer: network
    blind_spot: >-
      This is the reading the Uptime Kuma monitor takes, and it is 200 for a
      page with nothing on it — which is what it has been.

manual:
  - "Kijk of de startpagina de diensten toont die je verwacht. Een lege Homepage antwoordt net zo vrolijk met 200 als een volle."
