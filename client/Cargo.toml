[package]
name = "homelab-client"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Homelab CLIENT CLI: drives the HOST daemon over the authenticated WS line"

[[bin]]
name = "homelab"
path = "src/main.rs"

[dependencies]
homelab-core = { path = "../core" }
homelab-proto = { path = "../proto" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
futures-util.workspace = true
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tokio-rustls = "0.26"
rustls = "0.23"
sha2 = "0.10"
toml.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
base64 = "0.22"

[dev-dependencies]
rcgen = "0.13"
