# C7 native service — adopted from the hand-built CT 112 (2026-08-29).
# ExecStart wraps the binary in `latch run` (secrets injected at start);
# the adoption check matches on the binary appearing in the argv.
# /opt/almanac holds binary + data + profiles + the .latch credentials —
# backing up the whole directory makes a restore self-contained (the restic
# repo is encrypted, so credential material in it is fine, same as
# host-meta). update_cmd runs as the almanac user so ownership stays clean.
stack_name: almanac
vmid: 112
hostname: 112-app-almanac
unit: almanac
binary: /opt/almanac/almanac
env_file: /appdata/almanac/almanac-config/latch.env
data_dirs:
  - /appdata/almanac/almanac-config
# Ownership settled 2026-08-30 on Kenny's instruction: the homelab manages
# almanac's updates. The collision this comment used to warn about is gone,
# because `almanac update` (K19, shipped in 1.3.0) is a different command
# from almanac's own updater: it fetches, verifies, probes and installs,
# then EXITS without restarting and without arming its own revert.
#
# The split is along what each side can actually do. Almanac knows how to
# find a release and prove its signature, checksum and that the new binary
# starts on this machine. The homelab knows how to restart a unit and put
# a preserved binary back when the process is dead — which a dead process
# cannot do for itself.
#
# ALMANAC_SELF_UPDATE=off is set in /etc/almanac/latch.env, so the app's
# periodic updater no longer initiates. Exactly one of these two must be
# armed; both would eventually restore each other's copy.
#
# runuser because /opt/almanac and the binary are owned by the almanac
# user, and an update running as root would leave root-owned files behind.
# This has to run the application EXACTLY the way its unit runs it, or the
# new binary's --check tests a configuration that never exists in reality.
# Three refusals taught that on 2026-09-01, each hiding the next: without
# the `cd`, "failed to read profiles directory profiles" (wrong working
# directory); without `latch run --`, "CLIENT_EMAIL is not set" (no
# secrets); without the EnvironmentFile, "no key for project 'almanac'"
# (latch itself had no key). All three read as "the new version is broken"
# when what was wrong was where and how it was asked. The command now
# reproduces the unit line for line: same directory, same environment file,
# same user, same latch wrapper.
update_cmd: cd /appdata/almanac/almanac-config && set -a && . /appdata/almanac/almanac-config/latch.env && set +a && runuser -u almanac --preserve-environment -- /usr/local/bin/latch run -- /opt/almanac/almanac update
