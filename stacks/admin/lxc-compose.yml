# homelab-admin — the browser dashboard for the homelab host (docs/admin/).
# One native chassis-rs service, reached only through the Cloudflare tunnel
# and Traefik (arch-exposure, Kenny 2026-09-28): CT 104 is the only neighbour
# allowed in on 8090 for the browser; the service itself checks the Access
# token and the house's address before its own login. Alertmanager (CT 113)
# may reach /hooks/alertmanager, which takes its own bearer token instead.
stack_name: admin
vmid: 120
hostname: 120-app-admin
native_only: true

network:
  ip: 10.10.10.20/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

# Measured on WSL 2026-09-28: the debug build serves the fleet page with
# 14 stacks in well under 100 MB; 512 MB leaves room for git and latch.
resources:
  cores: 1
  memory_mb: 512
  swap_mb: 0
  disk_gb: 8
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: nesting=1
  protection: true

boot:
  onboot: true
  order: 60

storage:
  - host_path: /appdata/admin/admin-config
    mount_point: /appdata/admin/admin-config
    # The service user `admin` is uid 997 inside (measured on CT 120
    # 2026-09-28): the deploy installs Alloy (999, and 998) before it
    # creates the native's user. 100997 is that uid mapped out of an
    # unprivileged LXC. Guessing 100999 from CT 118 left the state
    # directory unwritable on the first start.
    host_owner_uid: 100997
    app: admin

apps: []

natives: [admin]

# latch-files (Kenny, 2026-09-30: "Claude via latch"): the unit's env file
# (its tokens, its secret key, the Alertmanager hook's bearer) comes from
# latch, `stacks` project, environment prod. It existed only on CT 120 and
# in the host's vault. A changed file restarts the unit (fix-159: the unit
# reads it with EnvironmentFile=).
latch_files:
  - from: admin/admin.env
    dest: /appdata/admin/admin-config/admin.env
    mode: "600"
    owner: root:root

extra_routes:
  - filename: manual-admin.yml

firewall:
  enabled: true
  comment: |-
    CT 120 (admin), the dashboard. In force from its first deploy
    (arch-firewall, 2026-09-28). In: Traefik on CT 104 (the tunnel's only
    way in), Uptime Kuma on CT 107, and Alertmanager on CT 113 (alerts into
    the notification centre, 2026-09-30). Out: the host's API on
    10.10.10.250:8443 (the one exception to "never pve's rescue address from
    a container"), Loki and Prometheus on CT 113, DNS on the router, and the
    internet for GitHub (working copy, latch) and Cloudflare (Access keys).
  policy_in: DROP
  policy_out: ACCEPT
  rules:
    - comment: "the host's API, and nothing else of pve's"
      dir: out
      action: ACCEPT
      dest: 10.10.10.250
      proto: tcp
      dport: "8443"
    - dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100,9090"
      note: Loki (logs panel, Alloy push) and Prometheus (capacity, disk growth)
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "8090"
      note: Traefik, the only way in from the tunnel
    - dir: in
      action: ACCEPT
      source: 10.10.10.250
      proto: tcp
      dport: "8090"
      note: the host watches the dashboard's /healthz every minute (replace-kuma)
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "8090"
      note: Uptime Kuma HTTP monitor (/healthz)
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: icmp
      note: Kenny's desktop ping
    # fix-162 (2026-09-29): without this Prometheus timed out on node-exporter
    # and HostDown fired for a dashboard that answered.
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "9100"
      note: Prometheus on CT 113 (node exporter)
    # Decision notify-routing (Kenny, 2026-09-30): every alert lands in the
    # dashboard's notification centre. Alertmanager posts to
    # /hooks/alertmanager with the bearer HOMELAB_ADMIN_ALERTS_TOKEN.
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8090"
      note: Alertmanager on CT 113 (alerts into the notification centre)
