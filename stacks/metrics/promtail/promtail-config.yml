server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://10.10.10.4:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          stack: metrics
          host: 113-app-metrics
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
      - json:
          expressions:
            # attrs.tag is what docker writes when the daemon carries the
            # `tag: {{.Name}}` log-opt the guards install.
            container_name: attrs.tag
          source: attrs
      - labels:
          stream:
          container_name:
      - output:
          source: output
