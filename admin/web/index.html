<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homelab</title>
    <!-- feat-settings-2: the stored theme before the first paint (chassis'
         copy of kp-themes' no-flash snippet; no inline script under CSP). -->
    <script src="/static/theme-boot.js"></script>
    <link rel="stylesheet" href="/static/kp/dist/kp-themes.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <!-- redesign-kit-1: the pages' own sheets load with the app, not when a
         page mounts, on purpose: (1) a page draws its skeletons in their
         final geometry from the first frame (rule 6), and a sheet injected
         at mount arrives after that frame, so a first visit would flash
         unstyled; (2) two of them are drawn inside other pages too —
         Schedules is Activity's "Planned" view, Secrets the stack hub's
         Settings section — so "per page" would still mean several pages;
         (3) every rule in them is behind the page's own class prefix
         (hk-, sch-, sx-; test/uikit.test.js holds them to it), so a sheet
         loaded everywhere cannot touch another page, and the three weigh
         39 KB, served from memory and cached with app.css. -->
    <link rel="stylesheet" href="/css/pages/host.css" />
    <link rel="stylesheet" href="/css/pages/schedules.css" />
    <link rel="stylesheet" href="/css/pages/secrets.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <div class="kp-nav-wrap">
      <nav class="kp-nav" aria-label="Pages" id="bar">
        <a class="kp-nav__brand" id="brand" href="/">Homelab</a>
        <button
          type="button"
          class="kp-nav__toggle"
          data-kp-nav-toggle
        ></button>
        <ul class="kp-nav__links" id="nav"></ul>
        <p id="link" class="link" aria-live="polite">connecting…</p>
      </nav>
    </div>
    <section
      class="shell versions"
      id="versions"
      aria-label="Versions"
      hidden
    ></section>
    <div class="crumbs-slot" id="crumbs" hidden></div>
    <main class="shell" id="page"></main>
  </body>
</html>
