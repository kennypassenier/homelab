# What "Jellyfin is healthy" means, measured rather than assumed.
#
# These are the readings taken by hand during the CT 106 rebuild on
# 2026-09-01. Writing them down is the whole point: that knowledge existed
# for one night and would have evaporated by the next rebuild.
#
# Every command runs on the CONTAINER, not inside the docker container: that
# is the level the orchestrator already works at, it reaches every app on
# localhost, and it can read /appdata directly. Jellyfin's own image has no
# sqlite3 in it, so a check written one level deeper cannot run at all.
#
# The API key is read from Jellyfin's
# own database rather than passed in, because the key that WAS passed in
# turned out to be dead and had been for an unknown length of time (F131) —
# asking the application which keys it accepts is the only reading that
# cannot go stale.
checks:
  # G22 of the Phase-7 gate. The CT 106 replacement recorded "the device node
  # is present in the LXC and in the container, encoding.xml still says vaapi,
  # the transcode directory is sized". None of that is a completed transcode,
  # and the bar was "the service returns with its settings — for Jellyfin
  # INCLUDING hardware transcoding". F110 was a wrong render group id that
  # every one of those three readings would have shown as fine.
  #
  # So this asks Jellyfin's own ffmpeg to encode 25 frames through VAAPI.
  # Measured 2026-09-02: it succeeds on /dev/dri/renderD128 and fails on a
  # device that does not exist, so the reading can move in both directions.
  # It costs about a second and touches nothing in the library.
  - name: "hardware transcoding really works"
    command: >-
      docker exec jellyfin /usr/lib/jellyfin-ffmpeg/ffmpeg -hide_banner -loglevel error
      -init_hw_device vaapi=va:/dev/dri/renderD128 -filter_hw_device va
      -f lavfi -i testsrc=size=320x240:rate=25 -frames:v 25
      -vf format=nv12,hwupload -c:v h264_vaapi -f null - >/dev/null 2>&1
      && echo hardware-ok
    expect: must_be_present
    layer: application
    blind_spot: >-
      Proves the card, the driver and the permissions line up for an encode
      Jellyfin's own binary can do. It does not prove Jellyfin CHOOSES
      hardware for a real file — that is a settings question, and the manual
      check below is where it belongs.

  - name: "movies in the library"
    command: >-
      K=$(sqlite3 /appdata/media/jellyfin-config/data/jellyfin.db "select AccessToken from ApiKeys limit 1");
      printf 'header = "Authorization: MediaBrowser Token=%s"\n' "$K" | curl -s -m 30 -K - "http://127.0.0.1:8096/Items/Counts" |
      sed 's/.*"MovieCount":\([0-9]*\).*/\1/'
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts what Jellyfin has indexed, not whether any of it plays. A library
      of unreadable files counts the same as a healthy one.

  - name: "series in the library"
    command: >-
      K=$(sqlite3 /appdata/media/jellyfin-config/data/jellyfin.db "select AccessToken from ApiKeys limit 1");
      printf 'header = "Authorization: MediaBrowser Token=%s"\n' "$K" | curl -s -m 30 -K - "http://127.0.0.1:8096/Items/Counts" |
      sed 's/.*"SeriesCount":\([0-9]*\).*/\1/'
    expect: never_decreases
    layer: application

  - name: "episodes"
    command: >-
      K=$(sqlite3 /appdata/media/jellyfin-config/data/jellyfin.db "select AccessToken from ApiKeys limit 1");
      printf 'header = "Authorization: MediaBrowser Token=%s"\n' "$K" | curl -s -m 30 -K - "http://127.0.0.1:8096/Items/Counts" |
      sed 's/.*"EpisodeCount":\([0-9]*\).*/\1/'
    expect: never_decreases
    layer: application

  - name: "collections"
    command: >-
      K=$(sqlite3 /appdata/media/jellyfin-config/data/jellyfin.db "select AccessToken from ApiKeys limit 1");
      printf 'header = "Authorization: MediaBrowser Token=%s"\n' "$K" | curl -s -m 30 -K - "http://127.0.0.1:8096/Items/Counts" |
      sed 's/.*"BoxSetCount":\([0-9]*\).*/\1/'
    expect: never_decreases
    layer: application

  # Not a count: the paths every library and every *arr root folder is stored
  # against. Changing one breaks all of them at once, and it would not show up
  # in any number.
  - name: "library paths"
    command: >-
      K=$(sqlite3 /appdata/media/jellyfin-config/data/jellyfin.db "select AccessToken from ApiKeys limit 1");
      printf 'header = "Authorization: MediaBrowser Token=%s"\n' "$K" | curl -s -m 30 -K - "http://127.0.0.1:8096/Library/VirtualFolders" |
      grep -o '/data/[0-9]*TB/[A-Za-z0-9]*' | sort -u | tr '\n' ','
    expect: must_match
    layer: application

  - name: "hardware acceleration"
    command: >-
      grep -oE '<HardwareAccelerationType>[a-z]*' /appdata/media/jellyfin-config/config/encoding.xml |
      cut -d'>' -f2
    expect: must_match
    layer: process
    blind_spot: >-
      Reads the setting on disk, not a transcode. That the GPU is configured does not
      prove it is used — only an actual transcode does, and that is in the
      manual list below.

  - name: "graphics card present"
    command: "ls /dev/dri/renderD128 2>/dev/null"
    expect: must_be_present
    layer: network
    blind_spot: >-
      Only that the device node exists. It says nothing about whether the
      driver loads, whether Jellyfin may open it, or whether a transcode
      actually uses it — the render gid was wrong for months while this file
      was present the whole time (F110).

# What no measurement settles. These reach Kenny as a notification he has to
# acknowledge, because a list he has to go and find is a list that does not
# get read (form I2).
manual:
  - "Play a movie on the television and check whether the picture looks right."
  - "Check whether the audio is in sync on an episode with AC3 sound."
  - "Open a movie with burned-in subtitles and check whether they are readable."
# checks-automate (Kenny, 2026-09-30: "Alles wat kan"): the questions a
# machine can answer, measured in every fleet check. Tried once for real on
# 2026-09-30, read-only; the reading then is in each probe's comment.
probes:
  # Read 2026-09-30: 0 of 1167 without a poster.
  - name: "movies and series without a poster"
    command: |
      K=$(sqlite3 "file:/appdata/media/jellyfin-config/data/jellyfin.db?mode=ro" "select AccessToken from ApiKeys where Name='Homelab';")
      C=$(mktemp); trap 'rm -f "$C"' EXIT; printf 'header = Authorization: MediaBrowser Token="%s"\n' "$K" > "$C"
      A=$(wget --config="$C" -qO- "http://localhost:8096/Items?Recursive=true&IncludeItemTypes=Movie,Series&Limit=0" | jq .TotalRecordCount)
      P=$(wget --config="$C" -qO- "http://localhost:8096/Items?Recursive=true&IncludeItemTypes=Movie,Series&ImageTypes=Primary&Limit=0" | jq .TotalRecordCount)
      echo $((A-P))
    healthy: {equals: "0"}
    layer: application
  # Read 2026-09-30: 59561 bytes (resized; full size is larger).
  - name: "poster of the newest movie, bytes from the artwork disk"
    command: |
      K=$(sqlite3 "file:/appdata/media/jellyfin-config/data/jellyfin.db?mode=ro" "select AccessToken from ApiKeys where Name='Homelab';")
      C=$(mktemp); trap 'rm -f "$C"' EXIT; printf 'header = Authorization: MediaBrowser Token="%s"\n' "$K" > "$C"
      ID=$(wget --config="$C" -qO- "http://localhost:8096/Items?Recursive=true&IncludeItemTypes=Movie&ImageTypes=Primary&SortBy=DateCreated&SortOrder=Descending&Limit=1" | jq -r '.Items[0].Id')
      wget -qO- "http://localhost:8096/Items/$ID/Images/Primary" | wc -c
    healthy: {at_least: 1}
    layer: user_visible
    blind_spot: "one poster served by Jellyfin; the phone app itself is not asked"

# O10 / app-knowledge (Kenny, 2026-09-30: "Alles verplaatsen"): is anybody
# watching? Asked before an update or a nightly backup stops Jellyfin. A
# session with a NowPlayingItem counts, paused or not: restarting the server
# drops it either way. Prints nothing when idle, a line per viewer when not,
# and FAILS when it cannot tell (no key, no answer, not a list of sessions),
# which counts as in use. The key goes in through curl -K -, never argv.
busy_check:
  command: |
    K=$(sqlite3 "file:/appdata/media/jellyfin-config/data/jellyfin.db?mode=ro" 'select AccessToken from ApiKeys limit 1') || exit 1
    S=$(printf 'header = "Authorization: MediaBrowser Token=%s"\n' "$K" | curl -sf -m 10 -K - http://127.0.0.1:8096/Sessions) || { echo "Jellyfin did not answer" >&2; exit 1; }
    [ -n "$S" ] || { echo "Jellyfin returned nothing" >&2; exit 1; }
    printf '%s' "$S" | jq -r 'if type == "array" then .[] | select(.NowPlayingItem != null) | "\(.UserName // "someone") is \(if .PlayState.IsPaused then "paused on" else "watching" end) \(.NowPlayingItem.Name // "something")" else error("not a list of sessions") end'
