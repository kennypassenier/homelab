# Alertmanager routing for the homelab metrics stack.
#
# The delivery leg was empty from 2026-08-30 until 2026-08-31: Alertmanager's
# webhook payload has a fixed shape that does not match what Home Assistant's
# alert automation expects, and HTTPSwitchboard — the translator built for
# exactly this gap — was not deployed. It is now, on CT 109 beside the kyu hub.
#
# The chain: Alertmanager publishes its raw payload onto the hub topic
# alerts.raw, HTTPSwitchboard consumes it, reshapes it into the
# {alert, status, severity, instance, summary} that
# automation.homelab_alert_webhook has been waiting for, and delivers it —
# acknowledging on the hub only after Home Assistant accepted it. So an alert
# raised while Home Assistant is down waits instead of vanishing, which is the
# same guarantee Kenny chose for the homelab's own warnings (R2).
#
# The token is in a file, not here: this repository is public, and a bearer
# token in it would be a token published. The file lives in the alertmanager
# config directory the compose file already mounts, and the nightly restic
# backup covers it.

global:
  resolve_timeout: 5m

# Decision notify-routing (Kenny, 2026-09-30): every alert lands in the
# dashboard's notification centre (receiver `admin`, with its consequence,
# remedy and link); only the urgent ones also reach the phone at once
# (receiver `kyu-hub`, the path above). Urgent: a service not answering, a
# disk almost full or a failing drive. The list is the same as
# SERVICE_DOWN_ALERTS + DISK_ALERTS in core/src/notify.rs, sorted; a test
# (core/tests/notify_routing_tests.rs) holds the two together.
route:
  receiver: admin
  # One notification per alert ('...' groups by every label). HTTPSwitchboard
  # reshapes a group by reading its first alert, so a group of two lost the
  # second one, and a group whose first member had resolved was dropped
  # whole (expert panel 2026-09-27, phone-path-loses-information). The
  # fan-out that grouping by host used to hide is now removed at the source:
  # FilesystemAlmostFull counts each device once.
  group_by: ["..."]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - alertname=~"DiskPendingSectors|DiskSmartFailed|DriveMissing|FilesystemAlmostFull|HostDown|HypervisorRootFillingUp|PveStorageAlmostFull|TargetDown|ZpoolNotOnline"
      receiver: kyu-hub
      # The centre gets the urgent ones too.
      continue: true
    - receiver: admin

receivers:
  - name: kyu-hub
    webhook_configs:
      # An IP, not a name: everything else on this path uses one, and a
      # notification chain should not depend on name resolution working.
      - url: http://10.10.10.9:8080/t/alerts.raw
        # Alertmanager retries a failed webhook on its own; the hub is the
        # thing that makes the message durable once it lands.
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /alertmanager/kyu-token
  # The dashboard's notification centre on CT 120 (its firewall admits CT 113
  # on 8090). The token is HOMELAB_ADMIN_ALERTS_TOKEN from admin.env (latch,
  # environment admin); the same value sits in this file on CT 113, beside
  # kyu-token, for the same reason: this repository is public.
  - name: admin
    webhook_configs:
      - url: http://10.10.10.20:8090/hooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /alertmanager/admin-token
