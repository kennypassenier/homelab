# What "Sonarr is healthy" means. Taken from the readings made by hand during
# the CT 106 rebuild, where Kenny's requirement was that the *arr suite keeps
# working with nothing to reconfigure.
#
# The API key is read from Sonarr's own config file rather than stored here:
# a key in a checks file is a secret in the wrong place, and one that would
# silently rot the way Jellyfin's did (F131).
checks:
  - name: "series onder beheer"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/sonarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:8989/api/v3/series |
      grep -cE '"titleSlug":'
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts what Sonarr knows about, not whether any episode file is
      readable. A series whose disk has vanished counts the same.

  - name: "root folders bereikbaar"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/sonarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:8989/api/v3/rootfolder |
      grep -oE '"accessible": *true' | wc -l
    expect: never_decreases
    layer: application
    blind_spot: >-
      Sonarr's own answer about reachability. It has been wrong before: a
      bind mount that resolves to an empty directory reads as accessible.

  - name: "root folder paden"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/sonarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:8989/api/v3/rootfolder |
      grep -oE '/data/[0-9]*TB/[A-Za-z0-9]*' | sort -u | tr '\n' ','
    expect: must_match
    layer: application
    blind_spot: >-
      Every root folder in the database is stored as one of these paths, so a
      change breaks all of them at once — but this reads the paths, not
      whether files are actually there.

  - name: "download client verbonden"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/sonarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:8989/api/v3/downloadclient |
      grep -oE '"enable": *true' | wc -l
    expect: never_decreases
    layer: application
    blind_spot: >-
      That a client is configured and enabled, not that Sonarr can reach it.
      The downloader lives on another container.

  - name: "meldingen in het gezondheidsrapport"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/sonarr-config/config.xml);
      curl -s -m 40 -H "X-Api-Key: $K" http://127.0.0.1:8989/api/v3/health |
      grep -oE '"type":' | wc -l
    # Deliberately not never_decreases: this one is supposed to be able to
    # rise, because a new warning is information rather than a regression.
    # It is here so the count is VISIBLE in the transcript either way.
    expect: must_be_present
    layer: application
    blind_spot: >-
      Reports how many warnings Sonarr has, not whether they matter. Three
      indexers were failing during the rebuild and all three were healthy an
      hour later — the number alone would have looked like damage.

manual:
  - "Kijk in Sonarr of een recent afgeleverde aflevering in de juiste map staat."
  - "Controleer of een handmatige zoekopdracht resultaten geeft — dat raakt de indexers, die geen enkele meting hier dekt."
