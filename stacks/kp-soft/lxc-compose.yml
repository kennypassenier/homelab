# Stack intent (schema v2 — intent only, no machine-written state).
#
# kp-soft: Kenny's own site. A public portfolio at the front, and behind a
# login the apps his friend groups use — camping trips with packing lists,
# sim-racing lap times, binary puzzles. Laravel 12 + React in a FrankenPHP
# image; repo at ~/Projects/kp-soft.
#
# Its own container because it is the only service in the house that strangers
# are meant to reach directly. Today nobody outside reaches it at all: it has
# NO gateway route on purpose.
#
# The first attempt put it on website.kp-soft.dev, which falls under the
# *.kp-soft.dev wildcard and therefore behind Cloudflare Access. That broke the
# very thing it was meant to enable — Access answers 401 to every write, so no
# setting, no role and no passkey could be saved. Kenny chose (mini-round M1,
# 2026-08-31) to take it off the edge entirely until the site is ready for the
# bare kp-soft.dev.
#
# Everything the migration to that address needs is written down in
# docs/deployment/KP_SOFT_MIGRATION.md — including the trap that decides when
# it is worth doing.

stack_name: kp-soft
vmid: 116
hostname: 116-app-kp-soft

network:
  ip: 10.10.10.16/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 2
  memory_mb: 2048
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 512 MB.

  swap_mb: 0
  # PHP-FPM plus the image layers; the uploads live in the mount below and
  # grow there, not on the rootfs.
  disk_gb: 16
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: nesting=1,keyctl=1
  protection: true

boot:
  onboot: true
  order: 75

storage:
  # Everything mutable: the SQLite database, the uploaded trip photos and the
  # logs. Mounted at /app/storage inside the container.
  #
  # Deliberately NOT /app/database — that directory ships the migrations and
  # seeders inside the image, and a mount over it hides them: `migrate` then
  # reports "No migrations found" and every request answers 500. The handover
  # says its author walked into this once; it is recorded here so nobody
  # repeats it from this side either.
  - host_path: /appdata/kp-soft/kp-soft-config
    mount_point: /appdata/kp-soft/kp-soft-config
    # 100033 (www-data inside), not 100000 (fix-26). FrankenPHP runs as
    # root, but the image's entrypoint hands this directory and everything in
    # it to www-data at every start: measured 2026-09-26, the directory and
    # all its contents are 100033. With 100000 here every deploy chowned the
    # top directory to root, the next start chowned it back, and the nightly
    # owner check would report that churn as drift forever.
    host_owner_uid: 100033
    app: kp-soft
  # JobTracker's whole state: the data repository it clones for itself, with
  # `.jobtracker/` (queue, configuration, passkeys) inside the checkout.
  #
  # 110001, not 10001. The application runs as uid 10001 inside, and this is
  # an UNPRIVILEGED container, so on the host that is 100000 + 10001. Getting
  # it wrong does not fail loudly: the directory exists, the container cannot
  # read it, and the error reads "Permission denied" as though the problem
  # were inside. Measured the same day on another service (F286).
  - host_path: /appdata/kp-soft/jobtracker-config
    mount_point: /appdata/kp-soft/jobtracker-config
    host_owner_uid: 110001
    app: jobtracker

apps: [kp-soft, jobtracker]
# Declared, and answered from disk today — which is now a supported state
# rather than a refused one (MR1, Kenny 2026-09-05).
#
# This line says where kp-soft's secrets LIVE: in latch. Beside it sits
# stacks/kp-soft/kp-soft/.env, gitignored via `*.env`, which is what the
# deploy actually reads while this machine has no latch key. The deploy says
# so on every run — `[env] kp-soft <- local .env (latch skipped)` — because
# precedence is only safe when it is visible.
#
# For a while this list was empty instead, because build_spec refused an app
# carrying both. What retired that refusal was a measurement: across the whole
# repository there were TWO local .env files against thirteen latch-backed
# apps, and the refusal had never once fired on a real collision — the only
# time it ever fired, it blocked a real deploy. It was asking "do both exist?"
# where the question that matters is "which one did you use?".
#
# ↳ D12 = the decision that stack secrets travel through latch.
# ↳ MR1 = the mini-round that gave a local file precedence over latch.
#
# The local file was copied byte-exact from
# /var/lib/homelab/secrets/kp-soft/kp-soft.env — sha256 2231f824… on both
# sides — so nothing here was reconstructed or guessed. Deleting it hands the
# app back to latch with no other change.
latch_secrets: [kp-soft]

# The image is private on GHCR, so the deploy signs in before it pulls.
# Until 2026-08-31 that sign-in was a `docker login` run by hand on the
# container and recorded nowhere: a container rebuilt from scratch would have
# failed at the pull with nothing to say why. The credentials ride in the
# app's own .env — REGISTRY_USER and REGISTRY_TOKEN, from latch — so there is
# no second secrets path to keep alive.
# One login for the whole container: `docker login` is per daemon, so the
# credential named here also pulls JobTracker's private image. Verified
# 2026-09-04 that this token reaches both packages.
registry_login:
  registry: ghcr.io
  app: kp-soft

# job.kp-soft.dev, behind Cloudflare Access like the rest (Kenny, form J2).
#
# The bare `kp-soft.dev` has NO route — not here, not in the gateway's
# hand-written `manual-routes.yml`, not anywhere. This comment used to claim
# that manual file served it; measured 2026-09-05, that file holds exactly two
# routers, `opn.kp-soft.dev` and `prox.kp-soft.dev`, and a grep for the bare
# host rule across every live route file finds nothing. The name resolves to
# Cloudflare and answers 404.
#
# That is Kenny's own decision, not a gap: mini-round M1 (2026-08-31) took the
# site off the edge because every *.kp-soft.dev name sits behind Cloudflare
# Access, which answers 401 to writes. What the move to the bare name needs is
# written out in docs/deployment/KP_SOFT_MIGRATION.md.
#
# The practical consequence for anyone deploying this stack: a new version
# lands on 10.10.10.16:8080 and is visible from the LAN only. Nothing outside
# the house changes, and no route here is meant to change that yet.
gateway_route:
  filename: 116-app-kp-soft.yml
  gateway_vmid: 104

# fix-89: the container's Proxmox firewall, written by the deploy to
# /etc/pve/firewall/116.fw (fix-88). It reproduces, rule for rule and comment
# for comment, the file written by hand on 2026-09-20 and read back from pve
# on 2026-09-27 (byte-identical to captured/pve-host/firewall/116.fw), plus
# one rule Kenny added the same day. So its first deploy adds exactly that
# rule and the provenance line, and nothing else moves.
firewall:
  enabled: true
  comment: |-
    /etc/pve/firewall/116.fw — CT 116 (kp-soft), the one container strangers
    reach. Stateful, applied on its veth, so it sees NEIGHBOUR traffic inside
    VLAN 10 that no OPNsense rule can (F183). Every rule below comes from a
    measurement of 2026-09-20: ss on the container (no neighbour connections),
    the containers' own configuration (almanac, registry cache), the gateway
    route (8080, 8787), the Prometheus targets (8081, 9100) and the Uptime Kuma
    ping. Kenny approved it on 2026-09-20 ("Klopt").
  policy_in: DROP
  policy_out: ACCEPT
  # The management guard (DNS to 10.10.5.1, drop 10.10.5.0/24) would be three
  # rules more than the live file carries, and Kenny asked for this
  # container's first declared deploy to change nothing he did not decide.
  # Measured 2026-09-27: from CT 116 both 10.10.5.250:8006 and the prox route
  # through Traefik time out, because OPNsense's own rule for CT 116 closes
  # the management network at the router.
  management_open: >-
    OPNsense's rule for CT 116 already closes 10.10.5.0/24 at the router
    (measured 2026-09-27: 10.10.5.250:8006 times out); this declaration
    reproduces the hand-made 116.fw of 2026-09-20 rule for rule
  rules:
    - comment: "1 · pve's rescue address first: never from the container that strangers reach"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "2 · the neighbours it really uses: almanac (JobTracker events), registry cache (docker pulls)"
      dir: out
      action: ACCEPT
      dest: 10.10.10.12
      proto: tcp
      dport: 8080
    - dir: out
      action: ACCEPT
      dest: 10.10.10.17
      proto: tcp
      dport: "5000:5003"
    - dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: 3100
      note: Loki push (Alloy), added 2026-09-25
    - comment: |-
        3 · every other neighbour in VLAN 10 stays out of reach; what leaves the
            VLAN (DNS 10.10.5.1, internet) crosses the router, where OPNsense rules apply
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: |-
        4 · who may reach the container: Traefik (site, JobTracker), Prometheus
            (cadvisor, node exporter), Uptime Kuma (ping), Kenny's desktop (ssh)
      dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "8080,8787"
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8081,9100"
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
    # Kenny, 2026-09-27 (form item kp-soft-kuma-firewall: "Kuma HTTP toelaten,
    # firewall in de repo"): Uptime Kuma's declared monitor `kp-soft · site`
    # (http://10.10.10.16:8080/up) could never pass while only its ping was
    # let in.
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "8080,8787"
      note: Uptime Kuma HTTP monitors (Kenny, 2026-09-27)
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: 22

# replace-homepage (Kenny, 2026-09-30): this stack's tiles on the dashboard's
# start page, keyed by the hostname they open (or an id with `url:`). Moved
# here from Homepage's services-overlay.yml; groups follow their lowest order.
tiles:
  job.kp-soft.dev:
    name: "JobTracker"
    group: "Eigen"
    order: 403
    description: "Sollicitatiedossiers"
  kp-soft-local:
    name: "kp-soft"
    group: "Eigen"
    order: 401
    description: "Eigen site (in aanbouw, alleen thuis)"
    url: "http://10.10.10.16:8080/"
