# kyu-runner configuration, deployed 2026-08-31 onto CT 109 beside the hub.
#
# The copy in ~/Projects/kyu-runner/deploy/config.toml is the source of truth;
# this is a copy. Check drift with:
#   diff deploy/config.toml /etc/kyu-runner/config.toml
#
# The app token is NOT here: it lives in /etc/kyu-runner/token.env
# (KYU_RUNNER_TOKEN=…), root-owned 0600, loaded by the systemd unit, and its
# only durable copy is in latch under kyu/kyu-runner.

# The hub runs on the same LXC, so localhost — never a name that needs mDNS:
# the release binary is static musl and cannot resolve .local.
hub_url = "http://127.0.0.1:8080"

# W4: Uptime Kuma probes the runner here. 8082, not the 8081 in the shipped
# example: 8081 is cadvisor's port on every container in this fleet, and one
# uniform port keeps the scrape config to a single pattern.
healthz_listen = "10.10.10.9:8082"

# ── The homelab's own operations ──────────────────────────────────────
#
# Kenny's choice (R2, 2026-08-31): homelab warnings travel through the hub
# rather than straight to Home Assistant. The point is not speed — the direct
# webhook was one hop and worked. The point is that when Home Assistant is
# itself the thing that is broken, a direct POST is lost, while a message in
# the hub waits and is delivered when HA answers again. That is exactly the
# moment the warning matters.
#
# The webhook id is the one that already exists in HA
# (automation.homelab_ops_webhook), and the host publishes the same payload it
# used to POST directly — so only the transport changed and the HA side needed
# no edit at all.
#
# An IP, not homeassistant.lan: the static musl binary cannot resolve it.
[[routes]]
name = "homelab-ops"
topic = "homelab.ops"
subscription = "ha-runner"
webhook_url = "http://10.10.10.2:8123/api/webhook/REDACTED"

# AR15: ops routes must survive long partial outages — while HA's HTTP stack
# answers errors (not down, not up), each message burns roughly one attempt per
# lease budget, so give them room. A policy write replaces every field: what
# stands here is the whole policy.
[routes.policy]
max_attempts = 25

# NOT enabled yet: the kyu.events route from the shipped example. Its Home
# Assistant automation (webhook hub_kyu_events) does not exist, and HA answers
# 200 to an unknown webhook id — so the route would acknowledge the hub's own
# warnings into the void, which is worse than not having it. Filed as a
# follow-up in the homelab register.

# ── Sonarr and Radarr: a download that is waiting for Kenny ───────────
#
# Kenny's choice (2026-08-31): the apps publish onto the hub themselves.
# Both support custom headers on their webhook, so each carries its own kyu
# app token, and the runner delivers the untouched payload to Home
# Assistant. There is deliberately no translation step: the HA automation
# reads Sonarr's and Radarr's own fields with templates, so a reshaping hop
# would add a component without adding a guarantee.
#
# The event is "manual interaction required" — a download finished but could
# not be imported. A mis-named file in a release (the case that prompted
# this), a corrupt file, a name that maps to no episode. Without the route
# such a download sits in the queue until someone happens to look; the one
# that prompted this had been sitting there for four days.
#
# ORDER, as with every route here: automation.arr_manual_interaction_webhook
# was created FIRST and only then this route. HA answers 200 to an unknown
# webhook id, so the reverse acknowledges messages into the void.
#
# An IP, not homeassistant.lan: the static musl binary cannot resolve it.
[[routes]]
name = "arr-ops"
topic = "arr.ops"
subscription = "ha-runner"
webhook_url = "http://10.10.10.2:8123/api/webhook/REDACTED"

# AR15, same reasoning as homelab-ops: an ops route must survive a long
# partial outage of Home Assistant. A policy write replaces every field.
[routes.policy]
max_attempts = 25

# ── Why this is an example, and why it is here at all ─────────────────
#
# The deployed file is /etc/kyu-runner/config.toml on CT 109. It is not
# pushed by the orchestrator: kyu-runner is a C7 native service, so the
# homelab backs its directory up but never writes it. That means a route
# added by hand lives only on the container and in the nightly restic
# snapshot of /etc/kyu-runner — and nowhere a reader would look.
#
# The webhook ids are removed above. They are the credential for Home
# Assistant's notification dispatcher, and this repository is public.
#
# Captured 2026-08-31 after the homeassistant-mcp session added the third
# route (arr-ops) directly on the container. Same class as the route fix that
# expired this morning (F82): a change with no source has an expiry date.
# Verified healthy after that change: both routes idle, unit active.
