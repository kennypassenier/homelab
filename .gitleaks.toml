# gitleaks configuration for the secret scan (expert panel 2026-09-27,
# ci-hygiene-gaps), run by `make secrets`/`make release` over the whole
# history and by the pre-commit hook over the staged diff; it ran in
# ci.yml until 2026-09-29. The default rules apply; the
# allowlists below name the false positives a full-history scan found on
# 2026-09-27 (10 findings, every one of them one of these), each narrowed to
# its own file so a real secret elsewhere is still caught.

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures: the fixed dummy bearer token and named test secrets"
condition = "AND"
paths = ['''(^|/)tests/.*\.rs$''', '''^host/src/main\.rs$''']
regexTarget = "line"
# `tok-0123456789`: the first fix-143 client test (commit 92d71d1), in the
# history for good; the test itself now uses the dummy above.
regexes = ['''0123456789abcdef0123''', '''adopt-secret-gap27''', '''tok-0123456789''']

[[allowlists]]
description = "Content hashes of applied apps, once recorded in stack files"
condition = "AND"
paths = ['''^stacks/[^/]+/lxc-compose\.yml$''']
regexTarget = "line"
regexes = ['''^\s+[a-z0-9-]+: [0-9a-f]{64}$''']

[[allowlists]]
description = "Cloudflare Access capture: a service token's id names it, the secret is not in the file"
condition = "AND"
# fix-143: the edge test feeds the capture's own answer back, id included.
paths = ['''^captured/gateway/cloudflare-access\.json$''', '''^core/tests/edge_tests\.rs$''']
regexTarget = "line"
regexes = ['''"token_id": "a836cb28-4c6e-440c-ac2b-b4317ee0b44c"''']

[[allowlists]]
description = "Dashboard parity tests: a fake OpenSSH key body (not a key: ssh-keygen refuses it), a base64 of 'secret-that-is-not-a-key', and a dummy bearer in a masked log line"
condition = "AND"
paths = ['''^admin/tests/parity_tests\.rs$''']
regexTarget = "line"
regexes = ['''BEGIN OPENSSH PRIVATE KEY''', '''c2VjcmV0LXRoYXQtaXMtbm90LWEta2V5''', '''Bearer abcdef0123456789''']

[[allowlists]]
description = "Cloudflare Access application AUD: a public identifier (it is in every Access redirect URL and JWT), not a secret"
condition = "AND"
paths = ['''^stacks/admin/admin/admin\.service$''', '''^stacks/admin/rootfs/etc/homelab-admin/config\.toml$''']
regexTarget = "line"
regexes = ['''(HOMELAB_ADMIN_ACCESS_AUD=|access_aud = ")[0-9a-f]{64}''']
