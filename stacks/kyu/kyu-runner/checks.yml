# The pump from the hub into Home Assistant. It listens on 10.10.10.9:8082 —
# not 8081, which cadvisor owns fleet-wide, and not 127.0.0.1, which answers
# nothing. Both of those cost a wrong conclusion once.
checks:
  - name: "de runner is gezond"
    command: "curl -s -m 10 http://10.10.10.9:8082/healthz"
    expect: must_match
    layer: application
    blind_spot: >-
      The runner answering about itself. Whether a message actually arrives in
      Home Assistant runs through the webhook, and only a real message proves
      that — it is in the manual list.

manual:
  - "Stuur een testbericht door de keten en kijk of het in Home Assistant aankomt. Elke schakel meldt zichzelf gezond, ook op de dag dat de keten in het midden stuk was."
