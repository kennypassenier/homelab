# GoAccess turns Traefik's access log into the report on go.kp-soft.dev. It
# reads the same log directory Traefik writes and CrowdSec parses — which is
# the coupling that makes moving those logs (form G3) a separate step rather
# than a one-line change.
services:
  goaccess:
    image: allinurl/goaccess:latest
    container_name: goaccess
    networks:
      - gateway_net
    command:
      - '--log-format={"ClientHost":"%h","StartUTC":"%dT%t.%^","RequestMethod":"%m","RequestPath":"%U","RequestProtocol":"%H","DownstreamStatus":"%s","DownstreamContentSize":"%b","RequestHost":"%v"}'
      - "--date-format=%Y-%m-%d"
      - "--time-format=%H:%M:%S"
      - "--real-time-html"
      # The LAN address, not the public hostname (Kenny, form B2c). GoAccess
      # pushes every update over this websocket, and a page served over https
      # may not open an insecure one — so through Cloudflare the numbers froze
      # at container start and stayed there (F148). Pointed at the address the
      # browser can actually reach, over a page that is plain http, it does
      # what it was built to do.
      - "--ws-url=ws://10.10.10.4:7880"
      - "--output=/srv/report/index.html"
      - "--port=7880"
      - "/var/log/traefik/access.log"
    environment:
      - TZ=Europe/Brussels
    volumes:
      - /mnt/traefik-logs:/var/log/traefik:ro
      - /appdata/gateway/goaccess-config:/srv/report
    ports:
      # The WEBSOCKET port, not a web server. GoAccess answers plain HTTP here
      # with "400 Invalid Request" — which is why go.kp-soft.dev was routed at
      # it and could never have worked. The report itself is a file, written
      # to /srv/report/index.html, and something has to serve it.
      #
      # Reachable on the LAN only: no Traefik route points here and the
      # hostname is gone from the tunnel, so the browser that opens the report
      # on 7881 is the same browser that connects here on 7880.
      - "7880:7880"
    restart: unless-stopped
    labels:
      - "com.homelab.update.policy=auto"

  # The web server GoAccess does not have. Serves the report GoAccess writes,
  # read-only, on its own port; the route points here.
  #
  # Read the report at http://10.10.10.4:7881/ — on the LAN, deliberately.
  #
  # The comment that used to stand here claimed "GoAccess rewrites the file
  # continuously, so a refresh shows current numbers". That was my assumption
  # written down as a fact, and it was wrong: in real-time mode the file is
  # written exactly once and every later number arrives over the websocket
  # (F148). Measured 2026-09-01 — access.log live at 17:51, index.html last
  # written at 14:35.
  goaccess-report:
    image: nginx:alpine
    container_name: goaccess-report
    networks:
      - gateway_net
    volumes:
      - /appdata/gateway/goaccess-config:/usr/share/nginx/html:ro
    ports:
      - "7881:80"
    restart: unless-stopped
    labels:
      - "com.homelab.update.policy=auto"

# One network for the whole stack, created by the deploy. Without it every app
# is its own compose project on its own default network, and Traefik cannot
# reach CrowdSec — at which point the bouncer plugin fails closed and answers
# 403 to everything. That is what happened on 2026-09-01.
networks:
  gateway_net:
    external: true
    name: gateway_net

