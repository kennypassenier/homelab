# Stack intent (schema v2 — intent only, no machine-written state).
#
# kp-soft: Kenny's own site. A public portfolio at the front, and behind a
# login the apps his friend groups use — camping trips with packing lists,
# sim-racing lap times, binary puzzles. Laravel 12 + React in a FrankenPHP
# image; repo at ~/Projects/kp-soft.
#
# Its own container because it is the only service in the house that strangers
# are meant to reach directly. Today nobody outside reaches it at all: it has
# NO gateway route on purpose.
#
# The first attempt put it on website.kp-soft.dev, which falls under the
# *.kp-soft.dev wildcard and therefore behind Cloudflare Access. That broke the
# very thing it was meant to enable — Access answers 401 to every write, so no
# setting, no role and no passkey could be saved. Kenny chose (mini-round M1,
# 2026-08-31) to take it off the edge entirely until the site is ready for the
# bare kp-soft.dev.
#
# Everything the migration to that address needs is written down in
# docs/deployment/KP_SOFT_MIGRATION.md — including the trap that decides when
# it is worth doing.

stack_name: kp-soft
vmid: 116
hostname: 116-app-kp-soft

network:
  ip: 10.10.10.16/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 2
  memory_mb: 2048
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 512 MB.

  swap_mb: 0
  # PHP-FPM plus the image layers; the uploads live in the mount below and
  # grow there, not on the rootfs.
  disk_gb: 16
  storage: local-lvm

lxc:
  template: clone:998
  unprivileged: true
  features: nesting=1,keyctl=1
  protection: true

boot:
  onboot: true
  order: 75

storage:
  # Everything mutable: the SQLite database, the uploaded trip photos and the
  # logs. Mounted at /app/storage inside the container.
  #
  # Deliberately NOT /app/database — that directory ships the migrations and
  # seeders inside the image, and a mount over it hides them: `migrate` then
  # reports "No migrations found" and every request answers 500. The handover
  # says its author walked into this once; it is recorded here so nobody
  # repeats it from this side either.
  - host_path: /appdata/kp-soft/kp-soft-config
    mount_point: /appdata/kp-soft/kp-soft-config
    # FrankenPHP runs as root in this image; 100000 is root mapped out of an
    # unprivileged LXC.
    host_owner_uid: 100000
    app: kp-soft
  # JobTracker's whole state: the data repository it clones for itself, with
  # `.jobtracker/` (queue, configuration, passkeys) inside the checkout.
  #
  # 110001, not 10001. The application runs as uid 10001 inside, and this is
  # an UNPRIVILEGED container, so on the host that is 100000 + 10001. Getting
  # it wrong does not fail loudly: the directory exists, the container cannot
  # read it, and the error reads "Permission denied" as though the problem
  # were inside. Measured the same day on another service (F286).
  - host_path: /appdata/kp-soft/jobtracker-config
    mount_point: /appdata/kp-soft/jobtracker-config
    host_owner_uid: 110001
    app: jobtracker

apps: [kp-soft, jobtracker]
# Empty on purpose since 2026-09-05, and this is a temporary shape, not a
# change of model. Kenny's instruction that morning: work from local `.env`
# files (gitignored via `*.env`) and push those into latch, rather than being
# blocked whenever latch cannot be read.
#
# What was actually missing, measured rather than assumed: NOT a single value.
# `latch state` reports `key MISSING` for all four projects and `PAT MISSING`;
# the ciphertexts are all present and the plaintext lives in the host vault as
# well. The file beside this one was copied byte-exact from
# /var/lib/homelab/secrets/kp-soft/kp-soft.env — sha256 2231f824… on both
# sides — so nothing was reconstructed or guessed.
#
# Why this list is empty rather than keeping both: `build_spec` refuses an app
# that has a plaintext .env AND a latch_secrets entry, deliberately, because a
# stale plaintext file silently shadowing latch is the exact failure D12 was
# built to kill. So it is one or the other until the key is back.
#
# ↳ D12 = the decision that stack secrets travel through latch.
#
# Putting it back is one line, the moment `latch state` reports a key and a
# PAT for project `stacks`: restore `[kp-soft]` here and delete
# stacks/kp-soft/kp-soft/.env in the same commit.
latch_secrets: []

# The image is private on GHCR, so the deploy signs in before it pulls.
# Until 2026-08-31 that sign-in was a `docker login` run by hand on the
# container and recorded nowhere: a container rebuilt from scratch would have
# failed at the pull with nothing to say why. The credentials ride in the
# app's own .env — REGISTRY_USER and REGISTRY_TOKEN, from latch — so there is
# no second secrets path to keep alive.
# One login for the whole container: `docker login` is per daemon, so the
# credential named here also pulls JobTracker's private image. Verified
# 2026-09-04 that this token reaches both packages.
registry_login:
  registry: ghcr.io
  app: kp-soft

# job.kp-soft.dev, behind Cloudflare Access like the rest (Kenny, form J2).
#
# The bare `kp-soft.dev` has NO route — not here, not in the gateway's
# hand-written `manual-routes.yml`, not anywhere. This comment used to claim
# that manual file served it; measured 2026-09-05, that file holds exactly two
# routers, `opn.kp-soft.dev` and `prox.kp-soft.dev`, and a grep for the bare
# host rule across every live route file finds nothing. The name resolves to
# Cloudflare and answers 404.
#
# That is Kenny's own decision, not a gap: mini-round M1 (2026-08-31) took the
# site off the edge because every *.kp-soft.dev name sits behind Cloudflare
# Access, which answers 401 to writes. What the move to the bare name needs is
# written out in docs/deployment/KP_SOFT_MIGRATION.md.
#
# The practical consequence for anyone deploying this stack: a new version
# lands on 10.10.10.16:8080 and is visible from the LAN only. Nothing outside
# the house changes, and no route here is meant to change that yet.
gateway_route:
  filename: 116-app-kp-soft.yml
  gateway_vmid: 104
