# Alertmanager routing for the homelab metrics stack.
#
# The delivery leg was empty from 2026-08-30 until 2026-08-31: Alertmanager's
# webhook payload has a fixed shape that does not match what Home Assistant's
# alert automation expects, and HTTPSwitchboard — the translator built for
# exactly this gap — was not deployed. It is now, on CT 109 beside the kyu hub.
#
# The chain: Alertmanager publishes its raw payload onto the hub topic
# alerts.raw, HTTPSwitchboard consumes it, reshapes it into the
# {alert, status, severity, instance, summary} that
# automation.homelab_alert_webhook has been waiting for, and delivers it —
# acknowledging on the hub only after Home Assistant accepted it. So an alert
# raised while Home Assistant is down waits instead of vanishing, which is the
# same guarantee Kenny chose for the homelab's own warnings (R2).
#
# The token is in a file, not here: this repository is public, and a bearer
# token in it would be a token published. The file lives in the alertmanager
# config directory the compose file already mounts, and the nightly restic
# backup covers it.

global:
  resolve_timeout: 5m

route:
  receiver: kyu-hub
  # Grouping by host as well as alertname means one failing machine produces one
  # notification, not one per filesystem or per drive.
  group_by: ["alertname", "host"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: kyu-hub
    webhook_configs:
      # An IP, not a name: everything else on this path uses one, and a
      # notification chain should not depend on name resolution working.
      - url: http://10.10.10.9:8080/t/alerts.raw
        # Alertmanager retries a failed webhook on its own; the hub is the
        # thing that makes the message durable once it lands.
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /alertmanager/kyu-token
