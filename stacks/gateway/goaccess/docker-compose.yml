services:
  goaccess:
    image: xavierh/goaccess-for-nginxproxymanager:latest
    container_name: gateway-goaccess
    environment:
      - TZ=Europe/Brussels
      - SKIP_ARCHIVED_LOGS=False
      - DEBUG=False
      - BASIC_AUTH=False
    restart: unless-stopped
    volumes:
      # NPM logs directory (read-only) parsed in realtime.
      - /opt/gitops/stacks/gateway/nginx-proxy-manager-config/data/logs:/opt/log:ro
      # Persistent data/config for the dashboard output.
      - /opt/gitops/stacks/gateway/goaccess-config:/opt/custom
    ports:
      # Web dashboard served directly on the gateway LXC's IP.
      - "7880:7880"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.homelab.backup.pause=true"
