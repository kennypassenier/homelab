services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    networks:
      - gateway_net
    restart: unless-stopped
    command:
      # Only report Docker containers. Without this cadvisor also emits a series
      # per cgroup, which in an LXC means thousands of metrics nobody reads.
      - --docker_only=true
      # Container labels become Prometheus labels; the *arr stacks carry enough
      # of them to blow up cardinality for no analytical gain.
      - --store_container_labels=false
      # Matches the 30s scrape interval: sampling faster only burns CPU.
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      # 8081 rather than cadvisor's default 8080: on the downloader stack that
      # port is already published by gluetun, and one uniform port across every
      # host keeps the scrape config to a single pattern.
      - "8081:8080"
    labels:
      - com.homelab.update.policy=manual
# No custom network on purpose: cadvisor has to run on EVERY Docker host to see
# that host's containers, and metrics_net exists only on the metrics stack.
# Prometheus scrapes it over the LAN on the published port, which works
# identically everywhere.

# One network for the whole stack, created by the deploy. Without it every app
# is its own compose project on its own default network, and Traefik cannot
# reach CrowdSec — at which point the bouncer plugin fails closed and answers
# 403 to everything. That is what happened on 2026-09-01.
networks:
  gateway_net:
    external: true
    name: gateway_net
