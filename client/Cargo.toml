[package]
name = "homelab-client"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Homelab CLIENT CLI: drives the HOST daemon over the authenticated WS line"

[[bin]]
name = "homelab"
path = "src/main.rs"
required-features = ["tui"]

# arch-crates (homelab-admin, 2026-09-28): the admin dashboard reuses the
# client library (link, tls, spec) without the terminal UI; the CLI binary
# needs the TUI and asks for it.
[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
homelab-core = { path = "../core" }
homelab-proto = { path = "../proto" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
rustls = "0.23"
sha2.workspace = true
toml.workspace = true
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
base64.workspace = true

[dev-dependencies]
rcgen.workspace = true
# Only the TLS pin tests use it (rust-code-hygiene, 2026-09-27: it was a
# normal dependency, built into every release binary).
tokio-rustls = "0.26"

[lints]
workspace = true
