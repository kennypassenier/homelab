# The gateway's own two hostnames. They used to be docker labels on these
# containers, which works only because Traefik shares a machine with them —
# the moment a service leaves, the label stops meaning anything (that is what
# happened to Uptime Kuma on 2026-09-01). Routes as files behave the same
# wherever the backend runs, and they survive the container being rebuilt.
#
# The CrowdSec middleware stays a label on traefik itself: it is a definition
# rather than a route, and the `--entrypoints.web.http.middlewares=
# crowdsec-bouncer@docker` flag names it by that origin. Moving it here would
# make it @file and require changing that flag in the same breath as this
# rebuild — a second thing that has to go right during the one operation
# where nothing in the house is reachable.
http:
  routers:
    traefik-dashboard:
      rule: "Host(`traefik.kp-soft.dev`)"
      entryPoints: [web]
      service: api@internal
    grafana:
      rule: "Host(`grafana.kp-soft.dev`)"
      entryPoints: [web]
      service: grafana

  # go.kp-soft.dev is gone on purpose (Kenny, form B2c). The GoAccess report
  # is a tool for the house, and routing it through Cloudflare was what broke
  # it: the page arrives over https, an https page may not open an insecure
  # websocket, and GoAccess pushes every update over exactly such a
  # websocket. Through the tunnel the numbers therefore froze at the moment
  # the container started — measured 2026-09-01, access.log live at 17:51 and
  # the page still showing 14:35 (F148).
  #
  # On the LAN the page is http, the websocket is allowed, and GoAccess works
  # the way it was built to. So the report lives at http://10.10.10.4:7881/
  # and nothing about it is on the internet any more — one hostname fewer, one
  # Access policy fewer, and the whole websocket question settled by removal
  # rather than by another moving part.

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://10.10.10.4:3000"
