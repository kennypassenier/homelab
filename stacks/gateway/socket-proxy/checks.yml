# traefik-docker-socket (expert panel 2026-09-27, fix-167): this proxy is the
# only container still touching /var/run/docker.sock, narrowed to the one
# endpoint Traefik's docker provider calls. There is no route and no
# published port to prove it from outside, so it is asked from inside, for
# the very thing Traefik asks it: the container list (CONTAINERS=1), which
# must name Traefik itself. A proxy that only answers `_ping` while refusing
# /containers would leave Traefik blind; this reading catches that.
checks:
  - name: "socket-proxy passes through the container list"
    command: >-
      docker exec socket-proxy wget -qO- http://localhost:2375/containers/json |
      grep -q '"/traefik"' && echo ok
    expect: must_be_present
    layer: application
    blind_spot: >-
      Only that the proxy serves the container list, not that Traefik's docker
      provider reads the CrowdSec bouncer label through it; that is the routes
      check in stacks/gateway/traefik/checks.yml.
