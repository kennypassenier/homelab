# Stack intent (schema v2 — intent only, no machine-written state).
# Syncthing hub for the Obsidian vault: always-on peer so phone and desktop
# always have somewhere to sync to. Spec per the vault note
# "Homelab Planned Services" §4: tiny, onboot, versioned, not public.

stack_name: syncthing
vmid: 108
hostname: 108-app-syncthing

network:
  ip: 10.10.10.8/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 2
  memory_mb: 1024
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 256 MB.

  swap_mb: 0
  disk_gb: 4
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: "nesting=1,keyctl=1"

boot:
  onboot: true
  order: 50

storage:
  # Vault data lives on the Proxmox host → survives container recreation.
  # Owner 101000 = uid 1000 inside the unprivileged LXC (syncthing's PUID).
  - host_path: /appdata/syncthing/syncthing-config
    mount_point: /appdata/syncthing/syncthing-config
    host_owner_uid: 101000
    # D25: owned by the app, not the stack — which is what lets this stack be
    # renamed to `syncthing` in M8 without abandoning its backup history.
    app: syncthing

apps: [syncthing]

# Web GUI behind the existing traefik on CT 104 (Cloudflare Access gates it).
# The sync protocol itself (22000/21027) stays LAN-only, per the vault note.
gateway_route:
  filename: 108-app-syncthing.yml
  gateway_vmid: 104

# What this syncthing is FOR, written down because the container cannot say
# it and because for weeks it did none of it (F163).
#
# It is the always-on peer for Kenny's Obsidian vault, so his desktop and his
# phone stay in step without both having to be awake. Configured 2026-09-01
# through syncthing's own API:
#
#   folder id    obsidian-vault  ("Obsidian vault")
#   path         /var/syncthing/obsidian-vault
#                 = /appdata/syncthing/syncthing-config/obsidian-vault on the
#                   host, so the nightly restic run carries it
#   type         sendreceive
#   versioning   staggered, maxAge 31536000 s (one year) — Kenny's form Y3
#   hub id       PHTJA5U-M3JLK7M-WBDDZTI-LG463UZ-34UH5TE-Q3MXQ6Y-EHHG5KX-IXHFEAR
#
# The versioning is the part that protects the notes rather than copies them:
# syncthing propagates a deletion, so a note removed by accident on the phone
# is gone everywhere. The hub keeps every overwritten and deleted version for
# a year, and it is the only device that does.
#
# The web interface listens on 0.0.0.0:8384: http://10.10.10.8:8384 from the
# house, and https://sync.kp-soft.dev through the gateway_route above, where
# Cloudflare Access gates it (verified 2026-09-26: 200 through Traefik, 302 to
# the Access login from outside). Only the sync protocol stays LAN-only. This
# comment used to say the GUI was not behind Traefik, contradicting the route.

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 108 (syncthing), Syncthing.
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.17
      proto: tcp
      dport: "5000:5003"
      note: registry cache (docker pulls; the deploy probes all four)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.0/24
      proto: tcp
      dport: "22000"
      note: sync to LAN peers (desktop, phone)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.0/24
      proto: udp
      dport: "22000"
      note: sync over QUIC to LAN peers
    - dir: out
      action: ACCEPT
      dest: 10.10.10.255
      proto: udp
      dport: "21027"
      note: local discovery broadcast
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.0/24
      proto: tcp
      dport: "22000"
      note: sync from LAN peers; devices are authenticated by their id
    - dir: in
      action: ACCEPT
      source: 10.10.10.0/24
      proto: udp
      dport: "22000,21027"
      note: QUIC sync and local discovery from LAN peers
    - dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "8384"
      note: Traefik route to the GUI
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8081,9100"
      note: Prometheus (cadvisor, node exporter)
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "8384"
      note: Uptime Kuma HTTP monitor
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,8384"
      note: Kenny's desktop (ssh and the web ports the homepage tiles link to)

# replace-homepage (Kenny, 2026-09-30): this stack's tiles on the dashboard's
# start page, keyed by the hostname they open (or an id with `url:`). Moved
# here from Homepage's services-overlay.yml; groups follow their lowest order.
tiles:
  sync.kp-soft.dev:
    name: "Syncthing"
    group: "Huis"
    order: 303
    description: "Obsidian-kluis"
