# Homepage overlay — what the orchestrator cannot derive from a route file.
#
# The generated list (T51) knows every service that has a gateway route, and
# nothing else: no icon, no description, no widget, and no opinion about
# which services belong together. This file supplies exactly that, and the
# two are joined on `href`, which both sides already have. An exact key on
# purpose: matching display names would have guessed wrong eight times out
# of twenty-six when this was measured on 2026-09-02.
#
# A routed service with no block here still appears — grouped under its
# stack name, with a plain link. That is the point: a new service shows up
# by itself, and you decide later where it belongs.
#
# A block here whose href has no route is kept as a deliberate manual link
# (kp-soft and Loki below). Everything under `extra:` is passed through to
# Homepage verbatim, so any field Homepage supports works here without this
# orchestrator needing to know about it.
#
# 2026-09-02, second pass: the WIDGETS are gone from this file. Kenny asked
# whether the live tiles - what is streaming, how many films - could be
# automatic, and all three parts of a widget turned out to be readable:
# the type from the app name, the address from the route's own backend, and
# the API key from the application itself (see KNOWN_WIDGETS in
# core/src/ops/homepage.rs). Only grafana and proxmox still spell theirs out
# here, because those take a username and password that no application hands
# out for us.

