# Auto-provisioned Prometheus datasource for Grafana.
# Loki stays the default; dashboards reference this one by uid so the default
# never has to change and existing log dashboards keep working untouched.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # By container name: Grafana shares metrics_net with Prometheus since
    # fix-90 (2026-09-27), so the address no longer leaves the container.
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: POST
