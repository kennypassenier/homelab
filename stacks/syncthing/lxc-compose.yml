# Stack intent (schema v2 — intent only, no machine-written state).
# Syncthing hub for the Obsidian vault: always-on peer so phone and desktop
# always have somewhere to sync to. Spec per the vault note
# "Homelab Planned Services" §4: tiny, onboot, versioned, not public.

stack_name: syncthing
vmid: 108
hostname: 108-app-syncthing

network:
  ip: 10.10.10.8/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 2
  memory_mb: 1024
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 256 MB.

  swap_mb: 0
  disk_gb: 4
  storage: local-lvm

lxc:
  template: "clone:998"
  unprivileged: true
  features: "nesting=1,keyctl=1"

boot:
  onboot: true
  order: 50

storage:
  # Vault data lives on the Proxmox host → survives container recreation.
  # Owner 101000 = uid 1000 inside the unprivileged LXC (syncthing's PUID).
  - host_path: /appdata/syncthing/syncthing-config
    mount_point: /appdata/syncthing/syncthing-config
    host_owner_uid: 101000
    # D25: owned by the app, not the stack — which is what lets this stack be
    # renamed to `syncthing` in M8 without abandoning its backup history.
    app: syncthing

apps:
  - syncthing
  - promtail

# Web GUI behind the existing traefik on CT 104 (Cloudflare Access gates it).
# The sync protocol itself (22000/21027) stays LAN-only, per the vault note.
gateway_route:
  filename: 108-app-syncthing.yml
  gateway_vmid: 104

# What this syncthing is FOR, written down because the container cannot say
# it and because for weeks it did none of it (F163).
#
# It is the always-on peer for Kenny's Obsidian vault, so his desktop and his
# phone stay in step without both having to be awake. Configured 2026-09-01
# through syncthing's own API:
#
#   folder id    obsidian-vault  ("Obsidian vault")
#   path         /var/syncthing/obsidian-vault
#                 = /appdata/syncthing/syncthing-config/obsidian-vault on the
#                   host, so the nightly restic run carries it
#   type         sendreceive
#   versioning   staggered, maxAge 31536000 s (one year) — Kenny's form Y3
#   hub id       PHTJA5U-M3JLK7M-WBDDZTI-LG463UZ-34UH5TE-Q3MXQ6Y-EHHG5KX-IXHFEAR
#
# The versioning is the part that protects the notes rather than copies them:
# syncthing propagates a deletion, so a note removed by accident on the phone
# is gone everywhere. The hub keeps every overwritten and deleted version for
# a year, and it is the only device that does.
#
# Deliberately NOT behind Traefik and not in the tunnel: the web interface
# listens on 0.0.0.0:8384 and is reached at http://10.10.10.8:8384 from the
# house.
