# Deployed by hand on CT 104 on 2026-08-30, the same way the rest of this
# host's stack was, because CT 104 is not managed by the orchestrator until
# M8. Moves into stacks/gateway/ with everything else at that point.
#
# network_mode: host rather than platform_net: promtail only needs to reach
# Loki on this same machine, and host mode makes 127.0.0.1 mean that.
services:
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    network_mode: host
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ./data:/tmp/positions
    restart: unless-stopped
    labels:
      - com.homelab.update.policy=manual
