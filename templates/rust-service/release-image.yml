# Homelab companion workflow (G9): every version tag also publishes a Docker
# image to GHCR, so the homelab can deploy/update your Rust service like any
# other app. Copy to .github/workflows/release-image.yml in your Rust repo.
#
# ONE-TIME after the first push: the GHCR package is created PRIVATE even on
# a public repo. Make it public once (repo → Packages → package settings →
# Change visibility) so the homelab host can pull it anonymously.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
