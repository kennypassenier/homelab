# Auto-provisioned Loki datasource for Grafana
apiVersion: 1

# A `deleteDatasources` entry for Loki lived here from 2026-08-31, to move the
# datasource to uid `loki` once; it re-created the datasource on every start
# since. Removed 2026-09-27 (expert panel, dashboards-two-sources-ui-edits-lost):
# the uid has been `loki` for four weeks.

datasources:
  - name: Loki
    # Pinned 2026-08-31. Without it Grafana generated P8E80F9AEF21F6940,
    # while every log dashboard in this directory references the datasource
    # as "loki" — so all three resolved to nothing and showed no data. The
    # Prometheus datasource beside this one was already pinned for exactly
    # this reason; Loki was simply forgotten, and nothing checked.
    uid: loki
    type: loki
    access: proxy
    # By container name on metrics_net since both moved to the metrics
    # stack (fix-90, 2026-09-27); it was the gateway's address before.
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
