# Needs Proxmox API credentials: create stacks/<name>/pve-exporter/.env after
# scaffolding with PVE_USER / PVE_TOKEN_NAME / PVE_TOKEN_VALUE (an API token
# with PVEAuditor role suffices — never the root password).
services:
  pve-exporter:
    # fix-82 (manual-images-latest-unpinned, 2026-09-27): the version and
    # digest CT 113 ran that day; moving it is an edit of this line.
    image: prompve/prometheus-pve-exporter:3.10.0@sha256:4867684c0a937716f11f770a32d32958bded507cf570fc334f774392afcb2f37
    container_name: pve-exporter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PVE_VERIFY_SSL=false
    # Loopback only (expert panel 2026-09-27, pve-exporter-forwards-token):
    # `/pve?target=` is chosen by the caller and the exporter sends its API
    # token to that target, so anyone on the LAN could collect it. Prometheus
    # reaches it by name on metrics_net; the check on this CT uses loopback.
    ports:
      - "127.0.0.1:9221:9221"
    labels:
      - com.homelab.update.policy=manual
      - com.homelab.update.upstream=github.com/prometheus-pve/prometheus-pve-exporter
    networks:
      - metrics_net

networks:
  metrics_net:
    external: true
    name: metrics_net
