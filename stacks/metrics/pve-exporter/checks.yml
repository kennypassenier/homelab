# pve-exporter is how Prometheus sees the hypervisor. It is a proxy: it
# answers on its own port and then asks Proxmox. Both halves can fail
# separately, which is why there are two readings.
checks:
  - name: "hypervisor-metingen geleverd"
    command: >-
      curl -sf -m 20 'http://127.0.0.1:9221/pve?target=10.10.5.250'
      | grep -c '^pve_up'
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts metric lines, not whether their values are right. It does prove
      the exporter reached Proxmox and got an answer, which the port alone
      does not — a bad token gives a 200 with an empty body.

  # Was a manual check until 2026-09-03 (form G1): "look in Grafana whether
  # the hypervisor graphs still have data". A graph with data is a claim
  # about Prometheus, and Prometheus can be asked directly.
  - name: "hypervisor-cijfers staan in Prometheus"
    command: >-
      n=$(curl -s -m 10 -G http://127.0.0.1:9090/api/v1/query
      --data-urlencode 'query=count(pve_up)'
      | grep -oE '"[0-9]+"\]' | grep -oE '[0-9]+');
      [ -n "$n" ] && [ "$n" -gt 0 ] && echo ok
    expect: must_be_present
    layer: application
    blind_spot: >-
      Counts series, not their freshness: a Prometheus that stopped scraping
      an hour ago still answers this until the series ages out. The nightly
      coverage check is the one that asks whether each target is up.

