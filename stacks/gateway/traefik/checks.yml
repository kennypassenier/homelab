# What "the gateway works" means, measured rather than assumed.
#
# This file exists because two faults of 2026-09-01 were repaired without one.
# Traefik's own log was moved out of a file and into docker's log (F139), and
# nothing would notice it being moved back. The route directory was pointed at
# the v1 path (F138), and the symptom was that Traefik loaded no routes at all
# while answering perfectly well on its port. Both are readings, so both are
# written down here instead of being remembered.
#
# Every command runs on the CONTAINER. Traefik's API is not published on 8080
# (`--api.insecure=false`), so it is asked the way everything else asks it:
# through the entrypoint, with the Host header its own route matches on.
checks:
  - name: "routes traefik has loaded"
    command: >-
      curl -s -m 15 -H "Host: traefik.kp-soft.dev"
      http://127.0.0.1/api/http/routers |
      python3 -c 'import sys,json; r=json.load(sys.stdin);
      f=[x for x in r if x.get("provider")=="file"];
      e=[x for x in f if x.get("status")=="enabled"];
      print("ok" if f and len(e)==len(f) else "mismatch: %d enabled of %d declared" % (len(e),len(f)))'
    # F160 (Kenny, 2026-09-19): this used to count enabled routers with
    # never_decreases, which could not tell a deliberate removal from an
    # accidental one — removing go.kp-soft.dev cost one red deploy. Now every
    # router the route files DECLARE (Traefik's file provider) must be
    # enabled: removing a route lowers both sides and stays "ok"; a route file
    # Traefik refuses shows up as "mismatch: 25 enabled of 26 declared".
    # Measured 2026-09-20 on CT 104: 28 routers, 26 from files, 26 enabled.
    expect: must_match
    layer: application
    blind_spot: >-
      Compares the routers Traefik accepted with the ones its route files
      declare, not that any of them reaches a living backend. A route to a
      container that is down is enabled and counted; a route file that was
      never deployed is invisible to both sides.

  # The one reading that would have caught the fleet-wide 403. Every layer is
  # in it: the entrypoint, the CrowdSec middleware that fails closed, and a
  # backend. Anything in that chain breaking changes the answer, which is
  # exactly what "all my routes stopped working" looked like from Kenny's
  # side — every hostname in the house answered 403 at once.
  #
  # `kitchen.` rather than a hostname of the gateway's own: it is rendered by
  # another stack into the route directory and its backend lives on another
  # container (CT 121), so this reading also covers the file provider picking
  # up a foreign route — which is what F138 broke. (It asked for `kuma.` until
  # 2026-10-30; Uptime Kuma is gone, the answer had become a bare 404 from no
  # router at all, and proved nothing about a backend.)
  - name: "a real request through the whole chain"
    command: >-
      curl -s -m 15 -o /dev/null -w '%{http_code}'
      -H "Host: kitchen.kp-soft.dev" http://127.0.0.1/
    expect: must_match
    layer: application
    blind_spot: >-
      Runs inside the house, so it proves the chain from the entrypoint
      inward. It says nothing about Cloudflare, the tunnel, or Access — and
      those cannot be checked from here, because Access answers 302 to an
      unauthenticated request whatever is behind it. The 302 this reading
      returns is the app's own redirect to its login page, not Access's.

  # Home route (2026-10-30, Kenny: "waarschuw 14 dagen voor het verlopen"; it
  # replaces what Uptime Kuma did). Traefik renews the wildcard certificate by
  # itself 30 days before it expires, so fewer than 14 days left means the
  # renewal has been failing for 16 days (token revoked, Cloudflare or Let's
  # Encrypt unreachable). Prints `ok` or nothing; Traefik's own default
  # certificate, which it serves before the first issue and lasts a year,
  # does not count.
  - name: "the wildcard certificate has at least 14 days left"
    command: >-
      cert=$(echo | openssl s_client -connect 127.0.0.1:443
      -servername kitchen.kp-soft.dev 2>/dev/null | openssl x509 2>/dev/null);
      echo "$cert" | openssl x509 -noout -subject | grep -q 'TRAEFIK DEFAULT' && exit 1;
      echo "$cert" | openssl x509 -noout -checkend 1209600 >/dev/null && echo ok
    expect: must_be_present
    layer: application
    blind_spot: >-
      Reads the certificate Traefik serves on this machine, not what a
      browser at home sees; it does not prove the home name resolves here
      (that is the OPNsense override) nor that the issuer is trusted: the
      staging issuer passes.

  - name: "traefik logs to docker, not to a file"
    command: >-
      docker inspect traefik --format '{{json .Config.Cmd}}' |
      tr ',' '\n' | grep -c '^"--log.filepath'
    expect: must_match
    layer: process
    blind_spot: >-
      Reads the flag, not the log. It proves nothing shipped the log away
      again; it does not prove promtail is reading it or that Loki accepted
      it — the fleet check asks that, per stack.

# What no measurement settles here.
  # Was a manual check until 2026-09-03 (form G1). B2c took the GoAccess
  # report off the internet deliberately; that the name still answers 302 or
  # 404 is normal, because the ingress is still in the Cloudflare dashboard
  # and that is tidying rather than risk. Seeing the report itself is the
  # fault, and one request settles it.
  #
  # Requires a real answer first: a curl that fails returns nothing, and
  # "no GoAccess in an empty body" would otherwise pass forever.
  - name: "goaccess no longer public"
    command: >-
      b=$(curl -sk -m 10 https://go.kp-soft.dev/ -w "|%{http_code}");
      case "$b" in *"|000") ;; *) echo "$b" | grep -qi goaccess || echo ok ;; esac
    expect: must_be_present
    layer: user_visible
    blind_spot: >-
      Reads what Cloudflare serves this container, which is what a stranger
      gets — but a body that happens not to contain the word while still
      being the report would pass. It is a marker check, not a rendering
      check.

manual:
  # fix-182: explicit id, with `replaces` carrying over the answer this
  # check held under the hash of its pre-translation Dutch text (fix-178).
  - text: >-
      Open a route from outside (e.g. son.kp-soft.dev) and check whether Cloudflare Access lets you in — that part cannot be measured from inside.
    id: traefik-route-protected-by-cloudflare-access
    replaces: ["ea4c9fbd"]
