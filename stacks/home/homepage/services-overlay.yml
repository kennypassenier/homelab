# Homepage overlay — what the orchestrator cannot derive from a route file.
#
# The generated list (T51) knows every service that has a gateway route and
# nothing else. This file supplies the four things no machine can know:
# which services belong together, what you want them called, which icon, and
# one line of Dutch. The two are joined on `href`, which both sides already
# carry — an exact key, because matching display names was measured against
# the real pair of files and would have guessed wrong eight times out of
# twenty-six.
#
# NOT here any more (D102): the widgets. Their type comes from the app's
# name, their address from the route's own backend, and their API key is
# read from the application itself on every deploy. Only grafana and proxmox
# still spell theirs out, because those take a username and password that no
# application hands out for us.
#
# A routed service with no block here still appears — under its stack name,
# with a plain link. That is the point: a new service reaches the page by
# itself and you decide later where it belongs.
#
# How to change anything here: docs/USER_GUIDE.md, "The front page".

group_order: [Media, Papierwerk, Huis, Eigen, Infrastructuur]

