# Promtail sidecar — ships this stack's container + system logs to the
# existing Loki on the platform stack (10.10.10.4), same as every stack.

services:
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ./data:/tmp/positions
    restart: unless-stopped
    labels:
      # Y1 class: automatic. Promtail ships logs and holds nothing; the worst
      # a bad version costs is a gap in the log, and the rollback restores it.
      - com.homelab.update.policy=auto
    networks:
      - productivity_net

networks:
  productivity_net:
    external: true
    name: productivity_net
