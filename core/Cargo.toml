[package]
name = "homelab-core"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Zero-I/O domain logic: manifests, safety gates, operation pipelines, state (AR1)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
sha2.workspace = true
# fix-29: the ecosystem's release signatures, the same crate chassis-rs uses.
minisign-verify = "0.2"
# fix-51: one async lock per state file, so load-modify-save sequences from
# concurrent tasks cannot save over each other. A lock, not I/O.
tokio = { version = "1", features = ["sync"] }

[features]
# mock-executor-weak-assertions (expert panel, 2026-09-27): the scripted
# MockExecutor is compiled only for tests, never into the host binary.
test-support = []

[dev-dependencies]
# The crate's own integration tests use the mock.
homelab-core = { path = ".", features = ["test-support"] }
serde_yaml.workspace = true
tempfile = "3"
toml.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
