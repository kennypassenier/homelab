# Everything that watches the house: Prometheus and Alertmanager, and since
# 2026-09-27 Loki and Grafana too (fix-90; Kenny's triage answer to
# gateway-shared-no-limits: "Loki en Grafana naar CT 113 verhuizen"). On the
# gateway a Loki query storm competed with Traefik in one cgroup, and when
# the front door went down the logs and dashboards that would explain it went
# down with it. The target layout had planned this move since D68.
stack_name: metrics
vmid: 113
hostname: 113-app-metrics
network:
  ip: 10.10.10.13/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10
resources:
  cores: 2
  # fix-90: Loki and Grafana arrive from the gateway. Measured 2026-09-27,
  # 14-day peaks from cadvisor: this container's programs 415 MB, Loki 342
  # MB, Grafana 527 MB (typical: 397, 199 and 224). 2560 MB keeps about half
  # free at those peaks; at 1024 the two newcomers alone would fill it, and a
  # container at 512 MB thrashed during a deploy the same day. Raised with
  # `homelab resize`, which a deploy does not do by itself. Was 1024 MB.
  memory_mb: 2560
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 512 MB.

  swap_mb: 0
  disk_gb: 16
  storage: local-lvm
lxc:
  template: clone:996
  unprivileged: true
  features: nesting=1,keyctl=1
  protection: true
boot:
  onboot: true
  order: 60
storage:
  # D25: the app that owns this directory decides which restic repository
  # it lands in, so Prometheus keeps its history if it ever moves stack.
  - host_path: /appdata/metrics/prometheus-config
    mount_point: /appdata/metrics/prometheus-config
    host_owner_uid: 165534
    # Not backed up (Kenny, triage 2026-09-27: "Meetdata niet back-uppen,
    # alleen configuratie"): the TSDB and the generated targets/ files are
    # regenerable, and copying them meant stopping Prometheus every night.
    no_backup: "Prometheus TSDB and generated scrape targets; regenerable, configuration is in the repository"
    app: prometheus
  # Alertmanager's silences and notification log. It was bind-mounted by its
  # compose file and declared nowhere, so docker created it on the container
  # rootfs — unbacked-up and lost on any rebuild. Found live 2026-08-30 while
  # renaming the path above; the directory was still empty, so nothing was
  # lost, which is luck rather than design.
  - host_path: /appdata/metrics/alertmanager-config
    mount_point: /appdata/metrics/alertmanager-config
    host_owner_uid: 165534
    app: alertmanager
  # fix-90: Loki's log database, moved from /appdata/gateway/loki-config.
  # 110001, not 100000: Loki's image runs as uid 10001, and 10001 inside an
  # unprivileged container is 110001 on the host. Declared 100000 first on
  # the gateway — container root — which passes validation and hands Loki's
  # database to a user it is not; it crash-looped with `permission denied`.
  - host_path: /appdata/metrics/loki-config
    mount_point: /appdata/metrics/loki-config
    host_owner_uid: 110001
    # Not backed up (Kenny, triage 2026-09-27, fix-81): log chunks are not
    # restored, and copying them stopped Loki every night, losing the lines
    # sent while it was down. Its configuration is in the repository.
    no_backup: "Loki log chunks and index; not restored, configuration is in the repository"
    app: loki
  # fix-90: Grafana's database (users, preferences, anything made in the
  # browser), moved from /appdata/gateway/grafana-config. Backed up: the
  # repository is named after the app (D25), so `grafana-config` keeps its
  # whole history across the move. 101000 is the image's uid 1000 on the host.
  - host_path: /appdata/metrics/grafana-config
    mount_point: /appdata/metrics/grafana-config
    host_owner_uid: 101000
    app: grafana
# alertmanager was deployed by hand on 2026-08-30 and was missing here, so a
# deploy of this stack would not have started it. Loki before Grafana: the
# datasource Grafana provisions at start should already answer. loki-push is
# Loki's front on the LAN port (fix-93): pushes and /ready, nothing else.
apps: [prometheus, alertmanager, pve-exporter, loki, loki-push, grafana]
latch_secrets: [pve-exporter, grafana]
# latch-files (2026-09-30): the bearer Alertmanager sends to the dashboard's
# /hooks/alertmanager, the same value as HOMELAB_ADMIN_ALERTS_TOKEN in the
# admin stack's admin.env. Alertmanager reads a credentials_file on every
# request, so a new token needs no restart. nobody:nogroup is the user the
# image runs as, as for kyu-token beside it.
latch_files:
  - from: alertmanager/admin-token
    dest: /appdata/metrics/alertmanager-config/admin-token
    mode: "600"
    owner: nobody:nogroup

# Pushes traefik-routes.yml to the gateway's watched routes directory.
gateway_route:
  filename: 113-app-metrics.yml
  gateway_vmid: 104

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 113 (metrics), metrics: Prometheus, Alertmanager, pve-exporter.
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.17
      proto: tcp
      dport: "5000:5003"
      note: registry cache (docker pulls; the deploy probes all four)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.0/24
      proto: tcp
      dport: "8081,9100"
      note: scrapes of cadvisor and node exporter on every container (file_sd)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.4
      proto: tcp
      dport: "8082"
      note: scrape of traefik metrics
    - dir: out
      action: ACCEPT
      dest: 10.10.10.9
      proto: tcp
      dport: "8080"
      note: scrape kyu, and Alertmanager's webhook to kyu
    - dir: out
      action: ACCEPT
      dest: 10.10.10.12
      proto: tcp
      dport: "8080"
      note: scrape almanac
    - dir: out
      action: ACCEPT
      dest: 10.10.5.250
      proto: tcp
      dport: "8006,9100"
      note: pve-exporter to pve's API, and pve's node exporter
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.0/24
      proto: tcp
      dport: "3100"
      note: Loki push from every container's Alloy (the loki-push front; push only, fix-93)
    - dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "3000,9090,9093"
      note: Traefik routes grafana, prom and alerts
    - dir: in
      action: ACCEPT
      source: 10.10.10.15
      proto: tcp
      dport: "3000"
      note: Homepage's Grafana widget
    - dir: in
      action: ACCEPT
      source: 10.10.10.250
      proto: tcp
      dport: "9090"
      note: the homelab daemon's queries from pve
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "3000,3100,9090,9093"
      note: Uptime Kuma HTTP monitors (grafana and loki since fix-90)
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,3000,9090,9093"
      note: Kenny's desktop (ssh and the web ports the homepage tiles link to)
