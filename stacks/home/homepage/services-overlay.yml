# The one deliberate http:// link on this page, and the reason is worth
# keeping: kp-soft has no gateway route at all while it is being built.
# Putting it on a *.kp-soft.dev name puts it behind Cloudflare Access,
# and Access answers 401 to every write — no setting, no role, no passkey
# could be saved. It goes back to an https name when it moves to the bare
# kp-soft.dev; see docs/deployment/KP_SOFT_MIGRATION.md.
