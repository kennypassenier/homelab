global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: mailbox
    static_configs:
      - targets: ["10.10.10.9:8080"]
  - job_name: pve
    metrics_path: /pve
    params:
      target: ["10.10.5.250"]
    static_configs:
      - targets: ["pve-exporter:9221"]
  # almanac (CT 112) serves on 10.10.10.12:8080 but has no /metrics yet:
  # that is new scope in its frozen feature list, pending a mini-round with
  # Kenny in the almanac project. Do NOT point this at /healthz — that
  # returns JSON, which Prometheus cannot parse, so the target would show a
  # permanent parse failure; liveness checks belong in Uptime Kuma.
  # - job_name: almanac
  #   static_configs:
  #     - targets: ["10.10.10.12:8080"]
