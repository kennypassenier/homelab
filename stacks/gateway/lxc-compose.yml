# The front door. Everything from outside the house arrives here, so this is
# the one container whose absence is total: while it is down there is no
# Jellyfin, no *arr suite, and no remote Home Assistant.
#
# Renamed from `platform` (its v1 hostname was lxc-platform-stack, which A2
# refuses). The code has said `gateway_vmid: 104` all along.
#
# Uptime Kuma used to live here and moved to CT 107 on 2026-09-01 (D68): a
# watchman on the roof he guards goes down with it, which is exactly what
# happened on 2026-08-31.
#
# Grafana and Loki still run here. The target layout moves them to the metrics
# stack, deliberately AFTER this rebuild (Kenny, form H2): carrying two
# databases through the one operation during which nothing is reachable is the
# wrong trade, and moving them later costs a dashboard, not the house.
stack_name: gateway
vmid: 104
hostname: 104-app-gateway

network:
  ip: 10.10.10.4/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 4
  memory_mb: 5120
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 1024 MB.

  swap_mb: 0
  disk_gb: 30
  storage: local-lvm

lxc:
  template: "clone:998"
  unprivileged: true
  features: "nesting=1,keyctl=1"
  protection: false
  gpu: false
  vpn: false

boot:
  onboot: true
  # First of the managed containers. Everything else is reachable through it,
  # and a stack that boots before its own front door spends its first minutes
  # unreachable for a reason that has nothing to do with itself.
  order: 5

storage:
  - host_path: /appdata/gateway/traefik-config
    mount_point: /appdata/gateway/traefik-config
    host_owner_uid: 100000
    app: traefik
  # 165532: cloudflared's image runs as the nonroot user 65532, not as root.
  # The directory is empty today, so nothing has ever needed to write to it —
  # which is exactly why this went unnoticed until the ownership check asked
  # the image instead of trusting the number (F137).
  #
  # `no_data` says that emptiness is the design, not an accident. The tunnel's
  # ingress rules and every Access policy live in the Cloudflare dashboard and
  # nowhere on disk (F12). Before this was declared, the empty-snapshot guard
  # refused the directory — correctly — and in doing so stopped the gateway's
  # backup before grafana, loki and goaccess were ever attempted (F154). Now
  # the app simply has no repository, and a directory that fills up anyway
  # fails the backup with a sentence saying so.
  - host_path: /appdata/gateway/cloudflared-config
    mount_point: /appdata/gateway/cloudflared-config
    host_owner_uid: 165532
    app: cloudflared
    no_data: true
  - host_path: /appdata/gateway/crowdsec-config
    mount_point: /appdata/gateway/crowdsec-config
    host_owner_uid: 100000
    app: crowdsec
  - host_path: /appdata/gateway/grafana-config
    mount_point: /appdata/gateway/grafana-config
    host_owner_uid: 101000
    app: grafana
  # 110001, not 100000: Loki's image runs as uid 10001, and 10001 inside an
  # unprivileged container is 110001 on the host. Declared 100000 first —
  # container root — which passes validation (the +100000 mapping is right)
  # and hands Loki's database to a user it is not. It crash-looped with
  # `permission denied` and the front door stayed down while that was read out
  # of a Go stack trace. A chown by hand did not fix it either: the next
  # deploy applied this number again.
  - host_path: /appdata/gateway/loki-config
    mount_point: /appdata/gateway/loki-config
    host_owner_uid: 110001
    app: loki
  - host_path: /appdata/gateway/goaccess-config
    mount_point: /appdata/gateway/goaccess-config
    host_owner_uid: 100000
    app: goaccess

# G3: Traefik's access log is 145 of the 146 MB under traefik-config, and it
# is data that is different tomorrow and never restored. Borrowed from a pool
# outside /appdata, so the nightly snapshot drops from 146 MB to 1.2 MB.
#
# Only the HOST side moves. Inside the containers the path stays
# /var/log/traefik, because Traefik writes it, CrowdSec parses it and GoAccess
# reports on it — three readers whose configuration should not have to know
# where the bytes physically live.
data_mounts:
  - host_path: /HDD2TB/logs/traefik
    mount_point: /mnt/traefik-logs
    note: "Traefik access + rotated logs. Regenerable, deliberately outside the backup."

apps: [traefik, cloudflared, crowdsec, grafana, loki, goaccess]

latch_secrets: [traefik, cloudflared, grafana]

gateway_route:
  filename: 104-app-gateway.yml
