# A pull-through cache, one instance per upstream registry.
#
# The reason it exists is measured, not assumed: the M7 drill lost 573 of its
# 653 seconds of outage to a single `docker compose pull` that stalled for
# 8 m 40 s and then completed in one go (F108). The same image pulled again
# minutes later took 113 s. Nothing in this repository can fix a registry on
# the internet having a bad evening — but a copy in the house means the second
# container that needs an image does not have to ask.
#
# One instance per upstream because a pull-through cache mirrors exactly one
# registry: `proxy.remoteurl` is a single URL. The four here are the four this
# fleet actually pulls from, counted across every managed container on
# 2026-08-31: docker.io 17 images, gcr.io 7, ghcr.io 6, lscr.io 1.
#
# Deliberately anonymous: no credentials are configured, so the cache can only
# fetch what is public. kp-soft's image is private and is pulled directly by
# the container that needs it, with its own read token — a cache holding a
# private image would hand it to anyone on the LAN who asked.
#
# Storage is one directory per upstream under a single mount, so the whole
# cache is one restic repository and one thing to delete when it grows.

x-cache: &cache
  # fix-82 (manual-images-latest-unpinned, 2026-09-27): the digest CT 117
  # ran that day beside the tag it already had.
  image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
  restart: unless-stopped
  environment: &cache-env
    REGISTRY_STORAGE_DELETE_ENABLED: "true"
    # Blobs are content-addressed, so a shared cache never mixes two images
    # up; the per-upstream split is about which remote to ask, not safety.
    REGISTRY_LOG_LEVEL: "warn"
  networks:
    - registry_net
  labels:
    - com.homelab.update.policy=manual
    - com.homelab.update.upstream=github.com/distribution/distribution

services:
  cache-dockerhub:
    <<: *cache
    container_name: cache-dockerhub
    environment:
      <<: *cache-env
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - /appdata/registry/registry-config/dockerhub:/var/lib/registry
      # Z1: the remote and the expiry live in this file, not in the
      # environment. `proxy.remoteurl` works either way; `proxy.ttl` does
      # NOT — registry 2.8.3 ignores REGISTRY_PROXY_TTL with a warning and
      # starts with no expiry at all. Keeping both in one place means they
      # cannot disagree.
      - ./dockerhub.yml:/etc/distribution/config.yml:ro
    ports:
      - "5000:5000"

  cache-ghcr:
    <<: *cache
    container_name: cache-ghcr
    environment:
      <<: *cache-env
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - /appdata/registry/registry-config/ghcr:/var/lib/registry
      # Z1: the remote and the expiry live in this file, not in the
      # environment. `proxy.remoteurl` works either way; `proxy.ttl` does
      # NOT — registry 2.8.3 ignores REGISTRY_PROXY_TTL with a warning and
      # starts with no expiry at all. Keeping both in one place means they
      # cannot disagree.
      - ./ghcr.yml:/etc/distribution/config.yml:ro
    ports:
      - "5001:5000"

  cache-gcr:
    <<: *cache
    container_name: cache-gcr
    environment:
      <<: *cache-env
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - /appdata/registry/registry-config/gcr:/var/lib/registry
      # Z1: the remote and the expiry live in this file, not in the
      # environment. `proxy.remoteurl` works either way; `proxy.ttl` does
      # NOT — registry 2.8.3 ignores REGISTRY_PROXY_TTL with a warning and
      # starts with no expiry at all. Keeping both in one place means they
      # cannot disagree.
      - ./gcr.yml:/etc/distribution/config.yml:ro
    ports:
      - "5002:5000"

  cache-lscr:
    <<: *cache
    container_name: cache-lscr
    environment:
      <<: *cache-env
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - /appdata/registry/registry-config/lscr:/var/lib/registry
      # Z1: the remote and the expiry live in this file, not in the
      # environment. `proxy.remoteurl` works either way; `proxy.ttl` does
      # NOT — registry 2.8.3 ignores REGISTRY_PROXY_TTL with a warning and
      # starts with no expiry at all. Keeping both in one place means they
      # cannot disagree.
      - ./lscr.yml:/etc/distribution/config.yml:ro
    ports:
      - "5003:5000"

  # pinned-digest-pruned-1: the KEEP registry. Not a cache: no `proxy:`
  # section, so nothing in it ever expires by itself, and it is written only
  # by the host's keep round (core/src/ops/keep.rs), which copies every digest
  # a stack file pins into it and drops the ones no stack pins any more.
  # That is what lets a rebuild or a disaster recovery pull a pinned digest
  # the upstream has deleted (Super Productivity keeps only its last 17
  # builds). It lives under its own mount, /appdata/registry/registry-keep,
  # which IS backed up: unlike a cache layer, a kept copy may be the only
  # copy left. Size: only the current pins, capped by `keep_max_mb` in
  # host.toml (12 GB) and 80 digests in all.
  keep:
    <<: *cache
    container_name: keep
    environment:
      <<: *cache-env
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - /appdata/registry/registry-keep:/var/lib/registry
      - ./keep.yml:/etc/distribution/config.yml:ro
    ports:
      - "5004:5000"

  # The copy tool of the keep round: `docker compose run --rm keep-copy copy
  # --all --preserve-digests docker://<origin> docker://127.0.0.1:5004/...`.
  # skopeo copies the manifest and every blob without a docker daemon and
  # keeps the manifest digest, which a `docker pull` + `docker push` of a
  # multi-platform image does not guarantee. Profile `tool`: `compose up`
  # never starts it. Host network so 127.0.0.1:5004 is the keep registry.
  keep-copy:
    image: quay.io/skopeo/stable:v1.22.3@sha256:24940638e4abb0edfedc78a680554f316069d0212a00159276759421a059e611
    profiles: ["tool"]
    entrypoint: ["skopeo"]
    network_mode: host
    labels:
      - com.homelab.update.policy=manual
      - com.homelab.update.upstream=github.com/containers/skopeo

networks:
  registry_net:
    external: true
    name: registry_net
