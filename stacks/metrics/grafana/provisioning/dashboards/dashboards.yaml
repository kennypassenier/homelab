# Auto-provisioned dashboards for Grafana
apiVersion: 1

providers:
  - name: 'Homelab Dashboards'
    orgId: 1
    folder: 'Homelab'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    # Refused rather than lost: a browser edit was accepted and then
    # overwritten from these files at the next provisioning (expert panel
    # 2026-09-27, dashboards-two-sources-ui-edits-lost). Change the JSON here.
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
