services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file:
      - .env
    environment:
      - TZ=Europe/Brussels
    restart: unless-stopped
    volumes:
      - /appdata/cloudflared/cloudflared-config:/config
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.homelab.backup.pause=true"
      - "com.homelab.tag.watchtower=enabled"
      - "com.homelab.tag.traefik.subdomain=none"
      - "com.homelab.tag.gpu=disabled"
      - "com.homelab.tag.vpn=none"
