[package]
name = "homelab-core"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Zero-I/O domain logic: manifests, safety gates, operation pipelines, state (AR1)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
sha2 = "0.10"
# fix-29: the ecosystem's release signatures, the same crate chassis-rs uses.
minisign-verify = "0.2"
# fix-51: one async lock per state file, so load-modify-save sequences from
# concurrent tasks cannot save over each other. A lock, not I/O.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
serde_yaml.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
