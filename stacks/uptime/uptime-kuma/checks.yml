# What "the watchman is watching" means, measured rather than assumed.
#
# The failure this stack can have is not that it falls over — that is loud.
# It is that it keeps running while watching less than it used to. A monitor
# switched off, or lost in a rebuild, leaves a service unwatched and the
# dashboard still green, which is worse than no dashboard at all.
#
# Every command runs on the CONTAINER. Uptime Kuma has no read API without a
# token, so its own SQLite database is asked directly — the same reasoning as
# Jellyfin's counts: the application's own store is the only reading that
# cannot go stale.
checks:
  - name: "bewakingen die uptime kuma kent"
    command: >-
      sqlite3 /appdata/uptime/uptime-kuma-config/kuma.db
      "select count(*) from monitor"
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts monitors that exist, not monitors that are switched on. The
      reading below is the one that catches a monitor being paused.

  - name: "bewakingen die actief staan"
    command: >-
      sqlite3 /appdata/uptime/uptime-kuma-config/kuma.db
      "select count(*) from monitor where active=1"
    expect: never_decreases
    layer: application
    blind_spot: >-
      Active is not the same as correct. On 2026-09-01 monitor 5 was active
      and had been reporting Uptime Kuma itself as down for eight hours,
      because it still pointed at the address the service left that morning
      (F157). A monitor watching the wrong thing counts here exactly like one
      watching the right thing.

  - name: "de webpagina antwoordt"
    command: "curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/"
    expect: must_match
    layer: network
    blind_spot: >-
      A status code from the web server. It says nothing about whether any
      check is actually being run — the two readings above ask that.

  # Was a manual check until 2026-09-03 (form G1): "open Uptime Kuma and see
  # whether rows have been red for days". Nobody opens a board to answer a
  # question, and a permanently red row is furniture rather than a fault —
  # which is the point F157 made. This asks the database instead.
  #
  # Counts ACTIVE monitors with no successful heartbeat in 24 hours. A brief
  # red during the nightly round (containers are paused to snapshot) does not
  # register: measured 2026-09-03, 71 red beats between 02:22 and 02:23 and
  # every monitor green by morning.
  - name: "bewakingen die al een dag rood staan"
    command: >-
      n=$(sqlite3 /appdata/uptime/uptime-kuma-config/kuma.db "select count(*)
      from monitor m where m.active=1 and not exists (select 1 from heartbeat h
      where h.monitor_id=m.id and h.status=1 and h.time >
      datetime('now','-24 hours'));" 2>/dev/null);
      [ -n "$n" ] && [ "$n" -eq 0 ] && echo ok
    expect: must_be_present
    layer: application
    blind_spot: >-
      Says nothing about a monitor that is green but pointed at the wrong
      thing, and nothing about one somebody deactivated to silence it —
      inactive monitors are excluded on purpose, because a paused monitor is
      a decision rather than a fault. An unreadable database prints nothing
      and fails, which is the intended answer to "the question could not be
      asked".

