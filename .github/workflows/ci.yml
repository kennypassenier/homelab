# Hard CI gates (AR9): red blocks merge. fmt, clippy -D warnings, all tests.
name: ci

on:
  push:
    branches: [main, v2-merge]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    container: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    container: rust:1.87-bookworm
    # rust-toolchain.toml pins the project to 1.97; without this override
    # rustup inside the container would fetch 1.97 and this job would stop
    # checking the MSRV it is named after.
    env:
      RUSTUP_TOOLCHAIN: "1.87"
    steps:
      - uses: actions/checkout@v4
      - name: Check on MSRV (AR17)
        run: cargo check --workspace
