# Vikunja: the task list at tasks.kp-soft.dev.
#
# SQLite, deliberately — a homelab task list does not need a second database
# process, and the file lives inside the mounted directory so one restic
# repository covers the whole application.
#
# Pinned by digest rather than :latest. Kenny's requirement for this rollout
# is that the rebuild gives the same result byte for byte, and a tag cannot
# promise that — :latest means "whatever was newest the day you rebuilt".
# This digest is the image running on CT 111 on 2026-08-31; the binary inside
# it reports itself as Vikunja api v2.3.0.
#
# Needs a .env from latch. Its two values are stored as VIKUNJA_VIKUNJA_* —
# the vault prefixes every variable with its application's name, even when
# the application already prefixes them itself, so that the rule stays "one
# name, one owner" with no exceptions to remember. They are mapped back below.
#
# VIKUNJA_SERVICE_SECRET signs session tokens: change it and every logged-in
# session is invalidated. Exactly the kind of "harmless" difference a rebuild
# must not introduce, so it is carried across verbatim — verified byte for
# byte against the running container before anything moved.

services:
  vikunja:
    image: vikunja/vikunja@sha256:f6b80393c1998cd5cd0dc38d24762c59ab4c10000a6f1032ef5b554e262cab93
    container_name: vikunja
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Brussels
      - VIKUNJA_DATABASE_TYPE=sqlite
      - VIKUNJA_DATABASE_PATH=/app/vikunja/files/vikunja.db
      - VIKUNJA_SERVICE_PUBLICURL=${VIKUNJA_VIKUNJA_SERVICE_PUBLICURL}
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_VIKUNJA_SERVICE_SECRET}
    volumes:
      - /appdata/productivity/vikunja-config:/app/vikunja/files
    ports:
      - "3456:3456"
    labels:
      # SQLite is not safe to copy while it is being written to.
      - com.homelab.backup.pause=true
      - com.homelab.update.policy=manual
    networks:
      - productivity_net

networks:
  productivity_net:
    external: true
    name: productivity_net
