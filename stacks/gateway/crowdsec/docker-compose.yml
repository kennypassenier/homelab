# CrowdSec reads Traefik's access log, decides which addresses are hostile,
# and Traefik's bouncer plugin asks it about every request.
services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    networks:
      - gateway_net
    environment:
      - TZ=Europe/Brussels
      - COLLECTIONS=crowdsecurity/traefik
    volumes:
      - /appdata/gateway/crowdsec-config:/etc/crowdsec
      - /appdata/gateway/crowdsec-config/data:/var/lib/crowdsec/data
      - /mnt/traefik-logs:/var/log/traefik:ro
      # Local networks and Tailscale are never hostile. Without this a
      # burst of your own traffic can get your own address banned.
      - ./whitelists.yaml:/etc/crowdsec/parsers/s02-enrich/homelab-whitelist.yaml:ro
    restart: unless-stopped
    labels:
      # Its database holds the bouncer registrations and the decision
      # history; a torn copy loses the key Traefik authenticates with.
      - "com.homelab.backup.pause=true"
      - "com.homelab.update.policy=auto"

# One network for the whole stack, created by the deploy. Without it every app
# is its own compose project on its own default network, and Traefik cannot
# reach CrowdSec — at which point the bouncer plugin fails closed and answers
# 403 to everything. That is what happened on 2026-09-01.
networks:
  gateway_net:
    external: true
    name: gateway_net
