# Alertmanager is the middle of the chain, and the middle is where it broke:
# on 2026-08-31 the alert path was finished on every side but this one, and
# nothing said so because every side reported itself healthy.
checks:
  - name: "alertmanager is healthy"
    command: "curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:9093/-/healthy"
    expect: must_match
    layer: process
    blind_spot: >-
      Alertmanager saying it started. It says nothing about whether an alert
      that fires actually reaches Kenny — that path runs through the
      switchboard and the hub, and only a real test alert proves it.

  # Counts the `- name:` entries in the loaded YAML (config.original). It
  # grepped JSON `"name":` fields until 2026-09-27 and read 0 with one
  # receiver configured, so it could never decrease (expert panel,
  # never-decreases-false-positives).
  - name: "receivers in the configuration"
    command: >-
      curl -s -m 10 http://127.0.0.1:9093/api/v2/status |
      grep -o '\\n *- name: ' | wc -l
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts receivers Alertmanager parsed, not receivers that answer. A
      webhook pointing at a dead address is configured exactly like a working
      one.

manual:
  # fix-182: explicit id, with `replaces` carrying over the answer this
  # check held under the hash of its pre-translation Dutch text (fix-178).
  - text: "Once a quarter, send a test alert through the whole chain and check whether it arrives on your phone. That is the only thing that proves the middle part — every link reports itself healthy on its own, even when the chain was broken."
    id: alertmanager-test-alert-reaches-phone
    replaces: ["51fd87cf"]

# checks-automate (Kenny, 2026-09-30: "Alles wat kan"): what a machine can
# measure of the question above, in every fleet check. Tried once for real on
# 2026-09-30, read-only; the reading then is in each probe's comment.
probes:
  # Read 2026-09-30: 0.
  - name: "failed notifications from Alertmanager, 7 days"
    command: |
      wget -qO- 'http://127.0.0.1:9090/api/v1/query?query=sum(increase(alertmanager_notifications_failed_total%5B7d%5D))' | jq -r '(.data.result[0].value[1] // "0") | tonumber | floor'
    healthy: {equals: "0"}
    layer: application
    id: alertmanager-failed-notifications-7d
    blind_spot: "Alertmanager handed every alert on; that the phone showed it is the question above"
