global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: kyu
    static_configs:
      - targets: ["10.10.10.9:8080"]
  - job_name: pve
    metrics_path: /pve
    params:
      target: ["10.10.5.250"]
    static_configs:
      - targets: ["pve-exporter:9221"]
  # almanac /metrics is APPROVED (its M13, 2026-08-29) but ships after its
  # remaining rollout steps — the almanac session reports here when it
  # serves. Exposition format on the same port; labels per source, no
  # calendar ids. Flip the job on then. Do NOT point this at /healthz in
  # the meantime — JSON, unparseable, permanent false "down"; liveness for
  # almanac lives in Uptime Kuma (its AR21).
  # - job_name: almanac
  #   static_configs:
  #     - targets: ["10.10.10.12:8080"]
