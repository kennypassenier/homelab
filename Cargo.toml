[workspace]
resolver = "2"
members = ["proto", "host", "client", "tui-preview"]
# Legacy generation — standalone crates, superseded by the v2 merge.
exclude = ["client-app", "host-daemon", "lxc-daemon"]

[workspace.package]
version = "2.0.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
