# The tunnel. Its token is the single credential whose loss is total: without
# it nothing reaches the house from outside, no matter what else is healthy.
# Ingress is configured in the Cloudflare Zero Trust dashboard and points at
# http://traefik:80 — resolved by docker DNS on this stack's own network, so
# traefik must keep its container name.
services:
  cloudflared:
    # fix-82 (manual-images-latest-unpinned, 2026-09-27): the version and
    # digest CT 104 ran that day; moving it is an edit of this line.
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: cloudflared
    networks:
      - gateway_net
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    volumes:
      - /appdata/gateway/cloudflared-config:/etc/cloudflared
    restart: unless-stopped
    labels:
      # Y1/Z1: UPDATE_POLICY.md puts this in the MANUAL class - a silent
      # failure here is expensive, and the gateway is the one container
      # whose breakage takes every other name down with it. The label
      # read auto until 2026-09-02 (F192), so the ratified decision and
      # the fleet disagreed for as long as both existed.
      - "com.homelab.update.policy=manual"
      - "com.homelab.update.upstream=github.com/cloudflare/cloudflared"

# One network for the whole stack, created by the deploy. Without it every app
# is its own compose project on its own default network, and Traefik cannot
# reach CrowdSec — at which point the bouncer plugin fails closed and answers
# 403 to everything. That is what happened on 2026-09-01.
networks:
  gateway_net:
    external: true
    name: gateway_net
