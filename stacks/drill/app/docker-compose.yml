# One small image, pulled for real, so the registry-cache fallback has
# something to fall back from.
services:
  app:
    image: nginx:alpine
    container_name: app
    ports:
      - "8080:80"
    volumes:
      - /appdata/drill/app-config:/usr/share/nginx/html
    # Writes one file into its own data directory before serving it. Two
    # drills need that: the ownership probe has something real to try, and
    # the destroy path has a non-empty directory to back up — an empty one
    # would be refused by the empty-snapshot guard and the destroy would stop
    # before the cleanup this stack exists to watch (F154).
    command:
      - /bin/sh
      - -c
      - echo "drill" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
    restart: unless-stopped
    networks:
      - drill_net

# The stack network the deploy creates. Without it each app is its own compose
# project on its own default network — which is how the gateway's bouncer lost
# sight of CrowdSec and answered 403 to everything on 2026-09-01.
networks:
  drill_net:
    external: true
    name: drill_net
