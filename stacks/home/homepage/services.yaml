    # its API key answered 403 to every header shape tried on 2026-08-31.
    # Giving it a widget needs either the password or a LAN whitelist entry,
    # and weakening its auth is Kenny's call, not a detail to slip in here.
    - qBittorrent:
        icon: qbittorrent.svg
        href: https://qbit.kp-soft.dev/
        description: Downloads

