# Every service in the house.
#
# Every link is an https name behind Traefik, never a container IP. Kenny
# reported the reason on 2026-08-31: an IP link is plain http, so the browser
# warns on every click. Five services had no route at all and got one —
# prom, alerts, kuma and kyu — and Loki, which has no page of its own, now
# points at Grafana where its data is actually read.
#
# Links point at the public hostname where one exists, so the page works the
# same from the couch and from outside; the widgets talk to the LAN address
# directly, because a widget that goes out through Cloudflare Access gets the
# login page instead of an answer.
#
# Services without a widget are here as links on purpose: a page that only
# lists what it can measure is not a page that lists everything.

- Media:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://fin.kp-soft.dev/
        description: Films en series
        widget:
          type: jellyfin
          url: http://10.10.10.6:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN}}"
          enableNowPlaying: true
          enableBlocks: true
    - Seerr:
        icon: jellyseerr.svg
        href: https://seerr.kp-soft.dev/
