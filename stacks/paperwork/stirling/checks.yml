# Stirling-PDF converts and merges PDFs and keeps nothing of its own worth
# counting. It has one property worth watching, and it is the one F62 found:
# it ships WITHOUT authentication unless the security profile is switched on,
# and this instance has it on with credentials from the vault.
checks:
  - name: "stirling vraagt om aanmelden"
    command: "curl -s -m 15 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login"
    expect: must_match
    layer: application
    blind_spot: >-
      That a login page exists. It does not prove the login is enforced on
      every other path — an unauthenticated request to a conversion endpoint
      is the reading that would, and it is in the manual list because getting
      it wrong would be a false alarm on a service that is behaving.

  # Was a manual check until 2026-09-03 (form G1). F62: without the security
  # profile Stirling runs wide open, and from the outside that is invisible —
  # the front page looks identical either way. One request answers it.
  - name: "weigert een aanvraag zonder aanmelden"
    command: >-
      c=$(curl -s -o /dev/null -m 8 -w "%{http_code}" http://127.0.0.1:8080/);
      [ "$c" = "401" ] && echo ok
    expect: must_be_present
    layer: application
    blind_spot: >-
      Proves the gate is there, not that the credentials behind it are
      strong. A curl that cannot connect at all prints nothing and fails,
      which is right: "could not ask" is not "the door is locked".

