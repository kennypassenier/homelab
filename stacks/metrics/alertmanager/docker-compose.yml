services:
  alertmanager:
    # fix-82 (manual-images-latest-unpinned, 2026-09-27): the version and
    # digest CT 113 ran that day; moving it is an edit of this line.
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /appdata/metrics/alertmanager-config:/alertmanager
    ports:
      - "9093:9093"
    labels:
      - com.homelab.backup.pause=true
      - com.homelab.update.policy=manual
      - com.homelab.update.upstream=github.com/prometheus/alertmanager
    networks:
      - metrics_net

networks:
  metrics_net:
    external: true
    name: metrics_net
