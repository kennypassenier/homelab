# C7 native service — adopted from the hand-built CT 109 (2026-08-29).
# The homelab supervises: nightly in-container backup, self-update with an
# armed rollback. It never starts or stops the service on its own.
stack_name: kyu
vmid: 109
hostname: 109-app-kyu
unit: kyu
binary: /usr/local/bin/kyu
# Paths follow the migration of 2026-09-01: this service's state and
# configuration live on the host at /appdata/<stack>/<unit>-config,
# bind-mounted in, so destroying the container costs nothing. The
# stack's own backup already covers those directories; data_dirs is
# kept pointing at them so the C7 verbs still describe reality, and
# the duplication with the stack backup is recorded as T61.
env_file: /appdata/kyu/kyu-config/kyu.env
data_dirs:
  - /appdata/kyu/kyu-config
# update_cmd deliberately absent for now: the app has (or may have) its own
# complete rollback mechanism, and two systems restoring binaries can fight
# each other. Ownership is Kenny's call (form pending); until then the
# nightly run backs up only.

# T11: the hub publishes a verifiable release since v2.1.0 (2026-09-02), so
# this stack can be finished by the orchestrator like the other three. The
# asset is named `kyu`, the same as the unit, so no `release_asset` override
# is needed. Verified independently before this line was written: downloaded,
# `sha256sum -c` gave `kyu: OK`, and the binary reported `kyu 2.1.0`.
#
# Worth knowing: the release workflow lifts the binary out of the docker image
# it just built rather than compiling a second time, and the kyu session
# measured the two as byte-for-byte identical. What lands here is literally
# what runs in the container.
release_repo: kennypassenier/kyu
