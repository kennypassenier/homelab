server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://10.10.10.4:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          stack: media
          host: lxc-media-stack
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Parse JSON logs from Docker
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
      # Extract container info
      - json:
          expressions:
            # `tag`, bare: this stage's `source: attrs` already puts us inside
            # the attrs object, so the path must not repeat it. The original
            # read `attrs.name` — wrong on both counts, the field docker writes
            # and the depth to read it at — so container_name was empty for the
            # life of this fleet. Docker writes attrs.tag because the guards'
            # daemon.json carries `tag: {{.Name}}` (2026-08-31).
            container_name: tag
          source: attrs
      # Add labels
      - labels:
          stream:
          container_name:
      # Output the actual log message
      - output:
          source: output

  # Scrape system logs
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          stack: media
          host: lxc-media-stack
          __path__: /var/log/syslog

  # Scrape application-specific logs in /opt/*/logs/
  - job_name: application_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: app_logs
          stack: media
          host: lxc-media-stack
          __path__: /opt/*/logs/*.log
