checks:
  - name: "the dashboard is healthy"
    command: "curl -s -m 10 http://10.10.10.20:8090/healthz"
    expect: must_match
    layer: application
    blind_spot: >-
      The dashboard answering about itself. Whether it reaches the host and
      whether the two locks hold is in the manual list.

manual:
  # fix-182: explicit id, with `replaces` carrying over the answer this
  # check held under the hash of its pre-translation Dutch text (fix-178).
  - text: "Open https://admin.kp-soft.dev at home and log in; then open it from 4G: it must refuse."
    id: admin-dashboard-access-restricted-to-home
    replaces: ["dee5e719"]
