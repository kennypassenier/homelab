# Hard CI gates (AR9): red blocks merge. fmt, clippy -D warnings, all tests.
name: ci

on:
  push:
    # Every branch, not only main: branch protection requires the `check`
    # context (the `msrv` job was removed on 2026-09-10, d318ada), and a
    # branch that produces no run can never satisfy it — which locks the branch shut and leaves a pull request as the only
    # road in (standing rule 6a). `v2-merge` was deleted 2026-08-28.
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    container: rust:1.97-bookworm
    steps:
      # Pinned by commit SHA, tag in the comment (expert panel 2026-09-27,
      # host-release-unsigned); Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all --check
      - name: Clippy (deny warnings)
        # --locked: without it CI resolves dependencies fresh on every run, so
        # an upstream release can turn main red with nobody having committed
        # anything. That is what happened on 2026-09-02 (F235): a newer
        # tokio-tungstenite changed Message::Text to take Utf8Bytes, and the
        # same commit that was green at 14:50 was red at 14:52. CI must test
        # the versions we actually ship, which is what Cargo.lock records.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
