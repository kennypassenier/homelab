# Loki receives from every container's promtail. Its 156 MB under
# loki-config/data is a log DATABASE, not configuration — Kenny chose to
# carry it across (form G2), because a rebuild is exactly the event you later
# want to be able to look back at.
services:
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    networks:
      - gateway_net
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - /appdata/gateway/loki-config/data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped
    labels:
      - "com.homelab.backup.pause=true"
      # Pinned to 3.0.0 on purpose: promtail on nine stacks is pinned to the
      # same version and the two have to agree. This is one of the eleven
      # services where the `auto` policy could never do anything (form H5).
      # Y1/Z1: UPDATE_POLICY.md puts this in the MANUAL class - a silent
      # failure here is expensive, and the gateway is the one container
      # whose breakage takes every other name down with it. The label
      # read auto until 2026-09-02 (F192), so the ratified decision and
      # the fleet disagreed for as long as both existed.
      - "com.homelab.update.policy=manual"

# One network for the whole stack, created by the deploy. Without it every app
# is its own compose project on its own default network, and Traefik cannot
# reach CrowdSec — at which point the bouncer plugin fails closed and answers
# 403 to everything. That is what happened on 2026-09-01.
networks:
  gateway_net:
    external: true
    name: gateway_net
