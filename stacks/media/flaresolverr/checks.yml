# FlareSolverr answers challenges for Prowlarr's indexers. It has one honest
# reading and it is a good one: its own health endpoint says ok only when the
# browser it drives actually started.
checks:
  - name: "flaresolverr gezond"
    command: >-
      curl -sf -m 15 http://127.0.0.1:8191/health | grep -o '"status": "ok"'
    expect: must_be_present
    layer: application
    blind_spot: >-
      `ok` means the service and its browser are up, not that any indexer
      challenge succeeds — Cloudflare changes what it asks for, and the first
      sign of that is Prowlarr failing rather than this endpoint.

# checks-automate (Kenny, 2026-09-30: "Alles wat kan"): the questions a
# machine can answer, measured in every fleet check. Tried once for real on
# 2026-09-30, read-only; the reading then is in each probe's comment.
probes:
  # Read 2026-09-30: ok.
  - name: "FlareSolverr gezond"
    command: "wget -qO- http://localhost:8191/health | jq -r .status"
    healthy: {equals: "ok"}
    layer: application
    blind_spot: "FlareSolverr answers; whether Cloudflare lets it through shows in Prowlarr's indexer status"
