# Hard CI gates (AR9): red blocks merge. fmt, clippy -D warnings, all tests.
name: ci

on:
  push:
    # Every branch, not only main: branch protection requires the `check` and
    # `msrv` contexts, and a branch that produces no run can never satisfy
    # them — which locks the branch shut and leaves a pull request as the only
    # road in (standing rule 6a). `v2-merge` was deleted 2026-08-28.
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    container: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all --check
      - name: Clippy (deny warnings)
        # --locked: without it CI resolves dependencies fresh on every run, so
        # an upstream release can turn main red with nobody having committed
        # anything. That is what happened on 2026-09-02 (F235): a newer
        # tokio-tungstenite changed Message::Text to take Utf8Bytes, and the
        # same commit that was green at 14:50 was red at 14:52. CI must test
        # the versions we actually ship, which is what Cargo.lock records.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    container: rust:1.88-bookworm
    # rust-toolchain.toml pins the project to 1.97; without this override
    # rustup inside the container would fetch 1.97 and this job would stop
    # checking the MSRV it is named after.
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@v4
      - name: Check on MSRV (AR17)
        run: cargo check --workspace --locked
