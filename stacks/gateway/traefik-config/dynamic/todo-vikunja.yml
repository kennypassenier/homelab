# Dynamic routing rule for stacks/todo — vikunja app
#
# Generated by the CLIENT scaffold when adding an app with a subdomain.
# To change the route: edit this file and push — Traefik picks up changes live.
#
# App LXC IP: 10.10.10.11 (todo stack, vmid 111)
# App port: 3456 (vikunja internal HTTP port)

http:
  routers:
    todo-vikunja:
      rule: "Host(`todo.kp-soft.dev`)"
      entryPoints:
        - web
      service: todo-vikunja

  services:
    todo-vikunja:
      loadBalancer:
        servers:
          - url: "http://10.10.10.11:3456"
