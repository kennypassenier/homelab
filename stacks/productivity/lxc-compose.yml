# Stack intent (schema v2 — intent only, no machine-written state).
#
# Productivity: SuperSync, the server that keeps Kenny's Super Productivity
# desktop and phone in step. Same vmid and same address as the container it
# replaces, so nothing outside has to be told anything (C4).
#
# Vikunja is deliberately NOT rebuilt. Kenny: "vikunja wordt niet meer
# gebruikt dus moet niet opnieuw geinstalleerd worden" (2026-08-31). Its
# database is not migrated and dies with the old container — but not without
# a copy: the vzdump taken immediately before the destroy contains the whole
# old container, Vikunja's 557 KB database included, so the data is
# recoverable from one archive if he ever wants it back. `tasks.kp-soft.dev`
# stops resolving to anything as a result, and its entry is removed from the
# front page in the same change.
#
# This is the first step of M8 and it was chosen for what it is NOT: nothing
# else in the house depends on it, it borrows no media directories, and its
# whole state is 70 MB. It also cannot be adopted the way kyu and almanac
# were — `homelab adopt` describes a systemd unit and this is a docker stack,
# and A2 refuses its current hostname — so a rebuild is the only route it has.
#
# Measured on the live container 2026-08-31 rather than assumed:
#   - vikunja-config is uid 1000 inside → 101000 on the host (unprivileged).
#   - supersync's postgres directory is uid 70, the alpine number, not 999.
#   - supersync's own /app/data mount is EMPTY and root-owned while the
#     process runs as 1001. It is dropped rather than carried: a declared
#     directory with nothing in it would only make the nightly backup fail on
#     an empty snapshot (F104). All of SuperSync's state is in its database.

stack_name: productivity
vmid: 111
hostname: 111-app-productivity

network:
  ip: 10.10.10.11/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  # What the container has today. A rebuild is not the moment to change how
  # much room a service gets.
  cores: 2
  memory_mb: 2048
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 512 MB.

  swap_mb: 0
  disk_gb: 8
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: nesting=1,keyctl=1
  protection: true

boot:
  onboot: true
  # After the edge and the database-ish services, before the front page.
  order: 70

storage:
  - host_path: /appdata/productivity/supersync-db-config
    mount_point: /appdata/productivity/supersync-db-config
    # postgres runs as uid 70 in the ALPINE image. The paperwork stack learned
    # this the expensive way: with the wrong number postgres answers
    # pg_isready while failing every real query.
    host_owner_uid: 100070
    app: supersync-db
  # Deliberately NO entry for supersync itself: see the note at the top. A
  # declared directory that stays empty is not a harmless extra — it makes
  # the nightly backup fail on an empty snapshot, and a failed nightly run
  # auto-disables the whole stack (H8).

# supersync-db first: supersync cannot reach a database that is not up yet,
# and the list is the ordering — `depends_on` cannot cross compose files.
apps: [supersync-db, supersync]
latch_secrets: [supersync-db, supersync]

gateway_route:
  filename: 111-app-productivity.yml
  gateway_vmid: 104

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 111 (productivity), productivity: SuperSync.
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.17
      proto: tcp
      dport: "5000:5003"
      note: registry cache (docker pulls; the deploy probes all four)
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "1900"
      note: Traefik route (the SuperSync clients arrive through the tunnel)
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8081,9100"
      note: Prometheus (cadvisor, node exporter)
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "1900"
      note: Uptime Kuma HTTP monitor
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,1900"
      note: Kenny's desktop (ssh and the web ports the homepage tiles link to)

# replace-homepage (Kenny, 2026-09-30): this stack's tiles on the dashboard's
# start page, keyed by the hostname they open (or an id with `url:`). Moved
# here from Homepage's services-overlay.yml; groups follow their lowest order.
tiles:
  sp.kp-soft.dev:
    name: "SuperSync"
    group: "Household"
    order: 304
    description: "Super Productivity"
