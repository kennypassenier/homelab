# The seeder's failure is silence, not a crash.
#
# It runs in a loop and swallows its own errors on purpose — a loop that dies
# stops watching the fleet entirely. That makes "the container is up" a
# useless reading: it is up whether it seeded anything or spent the day
# printing the same login failure.
#
# The first version of this file got its expectations wrong, which is worth
# recording because it produced two failed deploys and two notifications on
# Kenny's phone at half past two. One check counted matching log lines in a
# ROLLING two-hour window and demanded the number never change — a window
# that empties as time passes cannot promise that. Another used
# `must_be_present` on a `grep -c`, which always prints a number and can
# therefore never fail. A check that cannot fail is not a check.
checks:
  - name: "de laatste ronde is zonder fouten afgelopen"
    command: >-
      docker logs --tail 40 kuma-seeder 2>&1 | grep -c 'ERROR' || true
    expect: must_match
    layer: application
    blind_spot: >-
      Reads the last forty lines, so a failure older than one round has
      already scrolled past. It says the most recent attempt went cleanly,
      not that every attempt did.

  - name: "de laatste ronde heeft een uitkomst gemeld"
    command: >-
      docker logs --tail 40 kuma-seeder 2>&1
      | grep -oE '[0-9]+ added, [0-9]+ already existed' | tail -1
    expect: must_be_present
    layer: application
    blind_spot: >-
      An empty answer here means no round has finished in the last forty log
      lines, which is the real failure this app can have. It does not say the
      round was RIGHT: a seeder logged in against an empty Uptime Kuma would
      print the same sentence while adding everything from scratch.

  - name: "de gegenereerde lijst telt evenveel of meer containers"
    command: >-
      python3 -c "import json;print(len(json.load(open(
      '/appdata/uptime/kuma-seeder-config/host-monitors.json'))['host_monitors']))"
      2>/dev/null || echo 0
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts what the orchestrator wrote, not what Uptime Kuma has. If the
      seeder cannot log in this number keeps rising while the board stays
      unchanged — the two readings above are the ones that notice. Zero is
      the honest answer while the host is too old to write the file at all.

# The manual check that stood here until 2026-09-03 asked somebody to read
# the seeder's log for WARN lines about a monitor watching a stack that no
# longer exists. Nobody read it — Kenny found the first real one by noticing
# ping errors on a Grafana panel instead (F243). The seeder now writes its
# verdict to last-seed.json and the nightly fleet check reads it, naming each
# stale monitor. Removed rather than converted: the reader already exists,
# and a second one asking the same question would only disagree eventually.
