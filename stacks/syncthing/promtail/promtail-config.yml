server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://10.10.10.4:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          stack: syncthing
          host: 110-app-syncthing
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
      - json:
          expressions:
            # `tag`, bare: this stage's `source: attrs` already puts us
            # inside the attrs object, so the path must not repeat it. The
            # original line read `attrs.name` — wrong on both counts, the
            # field docker writes and the depth to read it at — which is why
            # the three Loki dashboards querying `container_name` have never
            # shown anything.
            container_name: tag
          source: attrs
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # System logs
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          stack: syncthing
          host: 110-app-syncthing
          __path__: /var/log/syslog
