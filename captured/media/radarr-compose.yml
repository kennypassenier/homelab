---
# Isolated deployment for Radarr movie management
# The shared network must exist on the Docker host prior to deployment

networks:
  media_net:
    external: true

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    # LinuxServer.io images utilize PUID and PGID variables for shared storage 
    # permission consistency rather than the native docker user directive
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      # Dynamic configuration folder targeted by the global Restic backup policies
      - ../radarr-config:/config
      # Direct mount paths for localized large-scale storage units where the media resides
      - /mnt/data/18TB:/data/18TB
      - /mnt/data/12TB:/data/12TB
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - media_net
