# A route that exists only so that destroying it can be watched.
#
# The hostname is deliberately one nobody has bookmarked and Cloudflare does
# not know: the drill is about the FILE appearing on the gateway and
# disappearing again on destroy, not about anything answering from outside.
http:
  routers:
    drill:
      rule: "Host(`drill.internal.invalid`)"
      entryPoints: [web]
      service: drill

  services:
    drill:
      loadBalancer:
        servers:
          - url: "http://10.10.10.18:8080"
