services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    # Token-mode: tunnel config (ingress rules) is managed in the Cloudflare Zero Trust dashboard.
    # To change where *.kp-soft.dev routes: dashboard → Networks → Tunnels → Configure → Public Hostname.
    # No local config file is used — the TUNNEL_TOKEN fetches ingress config from Cloudflare servers.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file:
      - .env
    environment:
      - TZ=Europe/Brussels
    restart: unless-stopped
    # No volumes — token-mode does not read a local config file.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.homelab.backup.pause=true"
