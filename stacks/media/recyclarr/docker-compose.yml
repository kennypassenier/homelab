# Recyclarr pushes quality profiles and custom-format scores into Sonarr and
# Radarr from the YAML beside this file, instead of settings clicked by hand
# that nobody can reconstruct. Kenny rated it implement-now on 2026-08-29 and
# chose this repository as its home (decision R10); the decision set R1-R11 is
# in the vault note "Homelab Planned Services" §5.
#
# It lives in the media stack because that is where the applications it writes
# to live: same container, same docker network, so it reaches them by name and
# never goes out through Traefik — where it would meet Cloudflare Access and
# get a login page instead of an API (D102).
services:
  recyclarr:
    # PINNED, and `manual` below says so. `:latest` does not exist for this
    # image — the earlier version of this file asked for a tag that has never
    # been published, so it could not have started. 8.7.2 is the newest
    # release (2026-09-03) and its one fix is the permission error this
    # container would otherwise hit on its own config volume.
    image: ghcr.io/recyclarr/recyclarr:8.7.2
    container_name: recyclarr
    environment:
      - TZ=Europe/Brussels
      # The image runs its own schedule. 05:00 is after the nightly homelab
      # round (04:13-04:20 measured) and long before anybody looks at the
      # library.
      - CRON_SCHEDULE=0 5 * * *
    env_file:
      - .env
    volumes:
      # A docker volume rather than an `/appdata` directory, and that is a
      # decision. Everything Recyclarr keeps here is a CACHE: a clone of the
      # TRaSH guides and of the config-templates repository, its logs, and a
      # small state file mapping guide ids to the profiles it created. None of
      # it is a source of truth — the configuration is the file below, which
      # lives in git, and the result lives in Sonarr and Radarr. Losing all of
      # it costs one git clone and a sync that finds the profiles by name.
      #
      # So it is deliberately NOT an `/appdata` bind mount: that would need a
      # seventh mountpoint on CT 106, and the orchestrator numbers mountpoints
      # by position — inserting one renumbers the three media libraries that
      # come after it, on a container that is streaming. A cache is not worth
      # that.
      - recyclarr-config:/config
      # The configuration itself comes from the repository and is read-only to
      # the container: what Recyclarr writes lives in Sonarr and Radarr, and
      # what Recyclarr is TOLD lives in git.
      - /opt/media/recyclarr/recyclarr.yml:/config/recyclarr.yml:ro
    restart: unless-stopped
    labels:
      # A pinned tag with an auto policy is a lie: the nightly pull would find
      # the same digest every night and report a successful update forever.
      - com.homelab.update.policy=manual
      # Deliberately NO `com.homelab.backup.pause`. That label exists so a
      # database is not copied while it is being written to, and nothing here
      # is copied at all — /config is a cache in a docker volume. Carrying the
      # label anyway would add one more container to the nightly stop list for
      # no backup at all.
    networks:
      - media_net

volumes:
  recyclarr-config:

networks:
  media_net:
    external: true
    name: media_net
