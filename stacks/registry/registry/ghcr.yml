# Pull-through cache for https://ghcr.io.
#
# Z1 (Kenny, 2026-09-02), and the comment is a correction of what this file
# first said. Claude claimed there was "no cleanup policy of any kind"
# because REGISTRY_STORAGE_DELETE_ENABLED only grants permission and nothing
# in the compose file set an expiry. That was wrong: registry applies a
# DEFAULT proxy ttl of 168h, and reading `scheduler-state.json` on the live
# caches proved it — all 137 entries carried an expiry exactly seven days
# after they were cached. An absence was asserted without checking for a
# default, and a first version of this file then set 720h, which would have
# made the cache live four times LONGER than it already did.
#
# So the value here is the one that was already in force. What changed is
# that it is now written down instead of inherited invisibly, which is the
# part worth having: the number can be found, argued with and changed.
#
# It still has to be a FILE. Measured 2026-09-02: REGISTRY_PROXY_TTL as an
# environment variable makes registry 2.8.3 answer "Ignoring unrecognized
# environment variable" and fall back to the default — a setting that looks
# applied and is not.
version: 0.1
log:
  level: warn
  fields:
    service: registry
storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
proxy:
  remoteurl: https://ghcr.io
  ttl: 168h
