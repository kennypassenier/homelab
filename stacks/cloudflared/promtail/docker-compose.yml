# docker-compose.yml
# This configuration mounts the precise host path directory for Promtail.
# All read-only flags have been removed from the volumes block.

services:
  promtail:
    # Utilizing the official modern Promtail image for log forwarding
    image: grafana/promtail:latest
    container_name: cloudflared-promtail
    environment:
      # Enforcing correct time correlation for Loki log ingestion
      - TZ=Europe/Brussels
      # Forcing API compatibility with the host architecture daemon
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped
    volumes:
      # Mount the Docker engine daemon socket with read-write capabilities
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the active container storage logs directly from the runtime engine
      - /var/lib/docker/containers:/var/lib/docker/containers
      # Mount the configuration file directly from the git repository (source of truth)
      - /opt/gitops/stacks/cloudflared/promtail-config/config.yml:/etc/promtail/config.yml:ro
    env_file:
      - .env
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.homelab.tag.watchtower=enabled"
      - "com.homelab.tag.role=infra-promtail"
      - "com.homelab.tag.gpu=disabled"
      - "com.homelab.tag.vpn=none"
