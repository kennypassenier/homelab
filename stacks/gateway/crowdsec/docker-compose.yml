services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: gateway-crowdsec
    environment:
      - TZ=Europe/Brussels
      # Traefik collection: parses Traefik access logs and detects common attacks.
      # CrowdSec community blocklists are also pulled automatically.
      - COLLECTIONS=crowdsecurity/traefik
    restart: unless-stopped
    volumes:
      # CrowdSec runtime config — writable, stores decisions and hub data.
      - /opt/gitops/stacks/gateway/crowdsec-config:/etc/crowdsec
      # CrowdSec runtime data (decisions, metrics) — subfolder of crowdsec-config so
      # a single backup pass on crowdsec-config captures everything.
      - /opt/gitops/stacks/gateway/crowdsec-config/data:/var/lib/crowdsec/data
      # Traefik access logs :ro — subfolder of traefik-config, CrowdSec only reads.
      - /opt/gitops/stacks/gateway/traefik-config/logs:/var/log/traefik:ro
    env_file:
      - .env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.homelab.backup.pause=true"
