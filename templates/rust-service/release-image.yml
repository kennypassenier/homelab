# Homelab companion workflow (G9): every version tag also publishes a Docker
# image to GHCR, so the homelab can deploy/update your Rust service like any
# other app. Copy to .github/workflows/release-image.yml in your Rust repo.
#
# The published package is linked to the repository and takes its visibility,
# so a public repo yields a package the homelab host can pull anonymously.
# (This comment used to claim the package is created PRIVATE regardless and
# must be flipped by hand; Kenny checked on 2026-08-28 and that is wrong. It
# is corrected here rather than in one repo at a time, because every Rust
# project copies this file and inherited the mistake — mailbox did.)
#
# If a host ever cannot pull: repo → Packages → package settings is where
# visibility lives.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
