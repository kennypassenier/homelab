# Stack intent (schema v2 — intent only, no machine-written state).
#
# CT 109 holds three native services: the kyu message hub, kyu-runner (which
# pumps hub messages into Home Assistant) and http-switchboard (which
# translates Alertmanager's shape into one the hub accepts). All three are
# systemd units running a single binary, adopted with C7 — each has its own
# `service.yml` in this repository, and this file describes the CONTAINER
# they live in.
#
# It exists because Kenny asked the right question on 2026-08-31: the four
# native services could be backed up and updated, but nothing said how to
# rebuild the box they run on. A stack that can only be repaired by the person
# who remembers how it was built is not managed.
#
# `native_only` says out loud that this container runs no docker. Every number
# below is what CT 109 has right now, read from `pct config` — deliberately
# small, because the hub is a single Rust binary that idles at a few MB.
#
# Rebuilding it, in order:
#   1. this manifest recreates the container;
#   2. `homelab restore stacks/kyu` puts /var/lib/kyu and /etc/kyu back from
#      their own restic repositories (C7 backs them up per unit);
#   3. the three binaries are installed the way C7 installs them.
# Nothing here starts or stops a service — that stays true after a rebuild
# too.

stack_name: kyu
vmid: 109
hostname: 109-app-kyu
native_only: true

network:
  ip: 10.10.10.9/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 1
  memory_mb: 256
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 128 MB.

  swap_mb: 0
  disk_gb: 2
  storage: local-lvm

lxc:
  # 998 is the unprivileged golden template. It bakes docker in, which this
  # container does not need and will not be given — see native_only above.
  template: clone:998
  unprivileged: true
  # As it is today: nesting only, no keyctl. Not copied from the other
  # stacks, read from the container.
  features: nesting=1
  protection: true

boot:
  onboot: true
  order: 50

# No /appdata: adoption never bind-mounts, because it must not restart a
# running service to take ownership of it. The services' state lives inside
# the container at /var/lib/kyu and /etc/kyu, and C7's nightly run reaches it
# with `pct exec tar | restic --stdin`.
# Data and configuration on the host, bind-mounted in, so destroying this
# container costs nothing and the normal backup reaches them — the same
# protection every docker stack has (Kenny, P1 2026-08-31). One directory per
# service, so each gets its own restic repository named after its owner (D25).
#
# The BINARIES deliberately stay in the container: they belong to a version,
# not to the data, and mixing the two lets a restore hand back an old program
# without saying so.
#
# Worth knowing: kyu's env file carries KYU_TOKEN and KYU_SECRET_KEY, and the
# two token.env files carry the hub tokens. Until tonight those existed ONLY
# inside this container — they were in no vault and no backup. Moving them
# here is the first time they are protected at all.
storage:
  - host_path: /appdata/kyu/kyu-config
    mount_point: /appdata/kyu/kyu-config
    # kyu runs as uid 103 inside; 100103 is that uid mapped out of an
    # unprivileged LXC.
    host_owner_uid: 100103
    app: kyu
  - host_path: /appdata/kyu/kyu-runner-config
    mount_point: /appdata/kyu/kyu-runner-config
    # Read by systemd as root before it drops to a DynamicUser.
    host_owner_uid: 100000
    app: kyu-runner
  - host_path: /appdata/kyu/http-switchboard-config
    mount_point: /appdata/kyu/http-switchboard-config
    host_owner_uid: 100000
    app: http-switchboard

# No docker apps by design. The three services are named in their own
# service.yml files: kyu, kyu-runner, http-switchboard.
apps: []

# The systemd units this container runs. Each has its own service.yml and
# its unit file in <unit>/<unit>.service — the unit file lives here now,
# which it did not before: losing the container would have lost the only
# copy of the file that makes the service exist.
natives: [kyu, kyu-runner, http-switchboard]
