global:
  scrape_interval: 30s

# Alertmanager reachable by container name on the shared metrics_net network.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # kyu, the message hub. Renamed from `mailbox` 2026-08-31: the service was
  # called that until 2026-08-29 and the job name outlived it, so its series
  # were filed under a name that no longer exists anywhere else.
  - job_name: kyu
    static_configs:
      - targets: ["10.10.10.9:8080"]

  - job_name: pve
    metrics_path: /pve
    params:
      target: ["10.10.5.250"]
    static_configs:
      - targets: ["pve-exporter:9221"]

  # Almanac serves /metrics unauthenticated, deliberately: a scraper
  # that cannot authenticate reports a healthy service as down. Its
  # liveness endpoint is /healthz and belongs to Uptime Kuma, not here.
  - job_name: almanac
    static_configs:
      - targets: ["10.10.10.12:8080"]

  # ── The fleet, discovered rather than administered (T1) ──────────────
  #
  # Until 2026-08-31 the LXC node and cadvisor targets were a hand-kept list
  # here, and it had drifted exactly the way hand-kept lists do: 10.10.10.14
  # was still labelled `scratch-mailbox` from a container destroyed that
  # morning, so the brand-new paperwork container's metrics arrived under a
  # dead machine's name. kyu and almanac had no cadvisor entry, the media and
  # gateway stacks had no way to gain one, and nothing would ever have said so.
  #
  # The orchestrator has written /appdata/metrics/prometheus-config/targets/
  # since the T1 work landed — one small file per stack, on every deploy.
  # Prometheus was never told to read it. A mechanism that runs, reports
  # success and is wired to nothing is the same failure as the log guards
  # that ran on five of nine containers; this closes it.
  #
  # The path is /prometheus/targets because that is where the directory
  # already lives: the host writes /appdata/metrics/prometheus-config/targets
  # and the compose file mounts prometheus-config at /prometheus. A separate
  # bind would have needed a second declared mount, and the manifest requires
  # a declared directory to be named after the app that owns it.
  #
  # file_sd is polled, so adding or destroying a stack needs no reload here.
  - job_name: node
    file_sd_configs:
      - files: ["/prometheus/targets/*.json"]
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [job]
        regex: node
        action: keep
    static_configs:
      # The hypervisor is not a stack and no deploy will ever write it.
      - targets: ["10.10.5.250:9100"]
        labels: {host: pve, role: hypervisor}

  - job_name: cadvisor
    file_sd_configs:
      - files: ["/prometheus/targets/*.json"]
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [job]
        regex: cadvisor
        action: keep
