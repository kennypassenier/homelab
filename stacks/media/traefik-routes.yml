# Traefik route fragment for the media stack.
#
# Six names, all at the address that does not change in a C4 rebuild. Every
# one of them sits behind Cloudflare Access like the rest of *.kp-soft.dev.

http:
  routers:
    jellyfin:
      rule: "Host(`fin.kp-soft.dev`)"
      entryPoints: [web, websecure]
      service: jellyfin
    sonarr:
      rule: "Host(`son.kp-soft.dev`)"
      entryPoints: [web, websecure]
      service: sonarr
    radarr:
      rule: "Host(`rad.kp-soft.dev`)"
      entryPoints: [web, websecure]
      service: radarr
    bazarr:
      rule: "Host(`baz.kp-soft.dev`)"
      entryPoints: [web, websecure]
      service: bazarr
    # 2026-11-05: Sonarr, Radarr and Prowlarr ignore X-Forwarded-Proto from a
    # proxy that is not on loopback, so an https visit is sent to an http://
    # login. Only a request that really is plain http takes this redirect: the
    # tunnel arrives on web with X-Forwarded-Proto: https and is left alone.
    arr-login-https:
      rule: "(Host(`son.kp-soft.dev`) || Host(`rad.kp-soft.dev`) || Host(`prowl.kp-soft.dev`)) && HeaderRegexp(`X-Forwarded-Proto`, `^http$`)"
      entryPoints: [web]
      middlewares: [arr-login-https]
      service: noop@internal
    prowlarr:
      rule: "Host(`prowl.kp-soft.dev`)"
      entryPoints: [web, websecure]
      service: prowlarr
    seerr:
      rule: "Host(`seerr.kp-soft.dev`)"
      entryPoints: [web, websecure]
      service: seerr

  middlewares:
    arr-login-https:
      redirectScheme:
        scheme: https

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://10.10.10.6:8096"
    sonarr:
      loadBalancer:
        servers:
          - url: "http://10.10.10.6:8989"
    radarr:
      loadBalancer:
        servers:
          - url: "http://10.10.10.6:7878"
    bazarr:
      loadBalancer:
        servers:
          - url: "http://10.10.10.6:6767"
    prowlarr:
      loadBalancer:
        servers:
          - url: "http://10.10.10.6:9696"
    seerr:
      loadBalancer:
        servers:
          - url: "http://10.10.10.6:5055"
