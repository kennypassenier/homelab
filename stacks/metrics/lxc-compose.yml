stack_name: metrics
vmid: 113
hostname: 113-app-metrics
network:
  ip: 10.10.10.13/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10
resources:
  cores: 2
  memory_mb: 1024
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 512 MB.

  swap_mb: 0
  disk_gb: 16
  storage: local-lvm
lxc:
  template: clone:998
  unprivileged: true
  features: nesting=1,keyctl=1
  protection: true
boot:
  onboot: true
  order: 60
storage:
  # D25: the app that owns this directory decides which restic repository
  # it lands in, so Prometheus keeps its history if it ever moves stack.
  - host_path: /appdata/metrics/prometheus-config
    mount_point: /appdata/metrics/prometheus-config
    host_owner_uid: 165534
    app: prometheus
  # Alertmanager's silences and notification log. It was bind-mounted by its
  # compose file and declared nowhere, so docker created it on the container
  # rootfs — unbacked-up and lost on any rebuild. Found live 2026-08-30 while
  # renaming the path above; the directory was still empty, so nothing was
  # lost, which is luck rather than design.
  - host_path: /appdata/metrics/alertmanager-config
    mount_point: /appdata/metrics/alertmanager-config
    host_owner_uid: 165534
    app: alertmanager
# alertmanager was deployed by hand on 2026-08-30 and was missing here, so a
# deploy of this stack would not have started it.
apps: [prometheus, alertmanager, pve-exporter]
latch_secrets: [pve-exporter]

# Pushes traefik-routes.yml to the gateway's watched routes directory.
gateway_route:
  filename: 113-app-metrics.yml
  gateway_vmid: 104
