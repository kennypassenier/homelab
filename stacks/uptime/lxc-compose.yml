# The watchman, on his own container (D68).
#
# He used to run on the gateway — the machine he is mostly watching. On
# 2026-08-31 that container fell over and the thing that would have said so
# went down with it. A watchman on the roof he is guarding is not a watchman.
#
# 107, not the 108 the target layout first named: 108 was occupied by
# syncthing, and freeing it meant moving metrics too. 107 was simply free, and
# the whole chain existed only because 108 had been asked for.
stack_name: uptime
vmid: 107
hostname: 107-app-uptime

network:
  ip: 10.10.10.7/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 1
  # 1024 since 2026-09-27 18:35: the deploy that gave Alloy read access to
  # the container logs left Kuma, its seeder, cadvisor, the node exporter and
  # Alloy in 512 MB with memory pressure at ~60% (/proc/pressure/memory
  # avg60, measured) and docker and Kuma not answering. The same reading
  # before the deploy was below 1%.
  memory_mb: 1024
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 256 MB.

  swap_mb: 0
  disk_gb: 8
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: "nesting=1,keyctl=1"
  protection: false
  gpu: false
  vpn: false

boot:
  onboot: true
  # Early, but after the gateway: a monitor that starts before the things it
  # watches spends its first minutes reporting failures that are only its own
  # impatience.
  order: 20

storage:
  - host_path: /appdata/uptime/uptime-kuma-config
    mount_point: /appdata/uptime/uptime-kuma-config
    host_owner_uid: 100000
    app: uptime-kuma
  # T49: the seeder's installed Python library and the generated monitor
  # list. Nothing here is precious — both are reproducible — but it is a
  # declared mount rather than a directory that appears by itself.
  - host_path: /appdata/uptime/kuma-seeder-config
    mount_point: /appdata/uptime/kuma-seeder-config
    host_owner_uid: 100000
    app: kuma-seeder

apps: [uptime-kuma, kuma-seeder]

# D12: the seeder logs in to Uptime Kuma as a normal user, so it needs a
# password. It travels from latch over the TLS line into the host vault and
# never lands in this repository — `stacks/uptime/kuma-seeder/env.example`
# names the two keys and holds no values.
latch_secrets: [kuma-seeder]

gateway_route:
  filename: 107-app-uptime.yml

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 107 (uptime), Uptime Kuma, which knocks on every service.
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
    Its monitor on 10.10.10.4:80 is not declared: the gateway lets nobody onto port 80.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.17
      proto: tcp
      dport: "5000:5003"
      note: registry cache (docker pulls; the deploy probes all four)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.0/24
      proto: icmp
      note: ping monitors
    - dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3000,3100"
      note: Grafana and Loki monitors
    - dir: out
      action: ACCEPT
      dest: 10.10.10.5
      proto: tcp
      dport: "8080"
      note: qBittorrent monitor
    - dir: out
      action: ACCEPT
      dest: 10.10.10.6
      proto: tcp
      dport: "8096,8989,7878,6767,9696,5055"
      note: media monitors
    - dir: out
      action: ACCEPT
      dest: 10.10.10.8
      proto: tcp
      dport: "8384"
      note: Syncthing monitor
    - dir: out
      action: ACCEPT
      dest: 10.10.10.9
      proto: tcp
      dport: "8080,8082,8083"
      note: kyu monitors
    - dir: out
      action: ACCEPT
      dest: 10.10.10.11
      proto: tcp
      dport: "1900"
      note: SuperSync monitor
    - dir: out
      action: ACCEPT
      dest: 10.10.10.12
      proto: tcp
      dport: "8080"
      note: almanac monitor
    - dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "9090,9093"
      note: Prometheus and Alertmanager monitors
    - dir: out
      action: ACCEPT
      dest: 10.10.10.14
      proto: tcp
      dport: "5006,8080,8000"
      note: paperwork monitors
    - dir: out
      action: ACCEPT
      dest: 10.10.10.15
      proto: tcp
      dport: "3000"
      note: homepage monitor
    - dir: out
      action: ACCEPT
      dest: 10.10.10.16
      proto: tcp
      dport: "8080,8787"
      note: kp-soft monitors
    - dir: out
      action: ACCEPT
      dest: 10.10.10.2
      proto: tcp
      dport: "8123"
      note: the one notification, Home Assistant dispatcher
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "3001"
      note: Traefik routes kuma and uptime
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8081,9100"
      note: Prometheus (cadvisor, node exporter)
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,3001"
      note: Kenny's desktop (ssh and the web ports the homepage tiles link to)

# replace-homepage (Kenny, 2026-09-30): this stack's tiles on the dashboard's
# start page, keyed by the hostname they open (or an id with `url:`). Moved
# here from Homepage's services-overlay.yml; groups follow their lowest order.
tiles:
  kuma.kp-soft.dev:
    name: "Uptime Kuma"
    group: "Infrastructure"
    order: 505
    description: "Uptime"
