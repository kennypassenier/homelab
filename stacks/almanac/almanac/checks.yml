# The gateway from apps to Google Calendar. A native service on CT 112, which
# has no curl — wget is what is available there, and a check written with the
# wrong tool simply fails to run and reports nothing.
checks:
  - name: "almanac is healthy"
    command: "wget -q -O - -T 10 http://127.0.0.1:8080/healthz"
    expect: must_match
    layer: application
    blind_spot: >-
      The service answering about itself. Whether an event actually lands in
      the calendar depends on a Google token that can expire without anything
      here changing.

  # The almanac project pointed this out on 2026-09-04, and measuring
  # confirmed it: `/healthz` answers `{"status":"ok","version":"2.3.0"}` and
  # says nothing whatsoever about the store. A source sending nonsense keeps
  # almanac healthy, and so does a journal almanac cannot reach — the check
  # above would stay green through both.
  #
  # Of the two counters they named, this is the one that is OURS. A growing
  # `almanac_dead_letter_total` means a SOURCE is sending something that will
  # never land, which is that source's problem and deliberately not checked
  # here. `almanac_journal_readable` dropping to 0 means almanac cannot get at
  # its own store on a container this suite provisions and backs up — disk,
  # permissions, a mount — and that is ours to fix.
  - name: "journal reachable"
    command: >-
      n=$(wget -q -O - -T 8 http://127.0.0.1:8080/metrics
      | awk '/^almanac_journal_readable /{print $2}');
      [ "$n" = "1" ] && echo ok
    expect: must_be_present
    layer: application
    blind_spot: >-
      Readable is not the same as correct: it says almanac can open its store,
      not that what it wrote there is right. And it says nothing about events
      that were never accepted — a source sending a shape almanac refuses gets
      a 422 and never reaches the journal at all, so nothing here moves.

manual:
  - "Create a test appointment via almanac and check whether it appears in Google Calendar. An expired token lets the service look healthy while delivering nothing."

# checks-automate (Kenny, 2026-09-30: "Alles wat kan"): what a machine can
# measure of the question above, in every fleet check. Tried once for real on
# 2026-09-30, read-only; the reading then is in each probe's comment.
probes:
  # Read 2026-09-30: 0/0/0.
  - name: "failed/dead/pending to Google Calendar"
    command: |
      wget -qO- http://127.0.0.1:8080/metrics | awk '/^almanac_deliveries_failed_total/{f=$2} /^almanac_entries_dead_total/{d=$2} /^almanac_journal_pending/{p=$2} END{printf "%d/%d/%d\n", f, d, p}'
    healthy: {equals: "0/0/0"}
    layer: application
    blind_spot: "almanac exposes no time of its last delivery, so a token that silently stopped working with nothing to deliver reads the same"
