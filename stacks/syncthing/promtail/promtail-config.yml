server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://10.10.10.4:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          stack: syncthing
          host: 110-app-syncthing
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
      - json:
          expressions:
            # attrs.tag, not attrs.name: docker writes the field named by the
            # daemon's `tag` log-opt, and there has never been an `attrs.name`.
            # This pipeline read one for as long as it has existed, produced an
            # empty label every time, and the three Loki dashboards that query
            # `container_name` have therefore never shown anything.
            container_name: attrs.tag
          source: attrs
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # System logs
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          stack: syncthing
          host: 110-app-syncthing
          __path__: /var/log/syslog
