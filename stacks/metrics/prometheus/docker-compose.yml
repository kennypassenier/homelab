services:
  prometheus:
    # fix-82 (manual-images-latest-unpinned, 2026-09-27): the version and
    # digest CT 113 ran that day; moving it is an edit of this line.
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      # The TSDB lives on pve's root (/dev/mapper/pve-root, shared with
      # pmxcfs and the logs): 6.33 GB and +0.22 GB a day on 2026-09-27. A
      # cardinality blow-up must hit this cap, not fill the hypervisor.
      - --storage.tsdb.retention.size=15GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - /appdata/metrics/prometheus-config:/prometheus
    ports:
      - "9090:9090"
    labels:
      - com.homelab.backup.pause=true
      - com.homelab.update.policy=manual
    networks:
      - metrics_net

networks:
  metrics_net:
    external: true
    name: metrics_net
