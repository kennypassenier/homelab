# B7 · the rollback drill stack.
#
# A throwaway container whose only purpose is to prove, on real hardware,
# that a native install which does not come up is rolled back to the binary
# that was running — the safety net every native service in this house
# relies on and nothing had rehearsed. `scripts/drill-native-rollback.sh`
# deploys this stack, installs a good fake service, then a deliberately
# broken one, and reads the outcome off the container.
#
# It is native-only and stateless on purpose: nothing here is worth backing
# up, and a drill that leaves history behind has already caused trouble once
# (F285/F292 — a drill stack borrowing a live app's name). The service name
# `drillsvc` belongs to nothing else in the fleet.
#
# vmid 119: 118, the previous drill container's, is inbox's now. Not on
# boot: a drill container that comes back after a power cut is a surprise.

stack_name: drill
vmid: 119
hostname: 119-app-drill
native_only: true
# Exists only during a rollback drill, created and destroyed in one sitting:
# the fleet check does not report it as never deployed (2026-09-29).
on_demand: true
# fix-100 (2026-09-27): `homelab apply` would have created CT 119, and the
# DR runbook would have rebuilt it. Deployed by name only.
ephemeral: true

network:
  ip: 10.10.10.19/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 1
  memory_mb: 256
  swap_mb: 0
  disk_gb: 4
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: "nesting=1"
  protection: false
  gpu: false
  vpn: false

boot:
  onboot: false

storage: []
apps: []
natives: [drillsvc]

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 119 (drill), the throwaway drill stack (not live).
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "9100"
      note: Prometheus (node exporter)
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22"
      note: Kenny's desktop (ssh)
