# Traefik routes for Kitchen (CT 121) — both names reach the same container.
#
# kitchen.kp-soft.dev: through the Cloudflare tunnel, behind the wildcard
# Cloudflare Access policy like every kp-soft.dev name (same shape as the
# admin dashboard's route). No per-name tunnel entry or DNS record is written
# here; the tunnel's ingress is a wildcard to http://traefik:80.
#
# eten.kp-soft.dev (Kenny, 2026-10-22, "Cloudflare, thuisadres zonder
# login"): his parents' wheel, through the tunnel like every other name.
# Cloudflare Access has its own app for this host: the house's public
# address passes without a login, every other address is refused. Kitchen
# serves only the parents' wheel on this host (KITCHEN_PARENTS_HOST), so the
# login page cannot be reached there.
http:
  routers:
    kitchen:
      rule: "Host(`kitchen.kp-soft.dev`)"
      entryPoints: [web]
      service: kitchen

    eten:
      rule: "Host(`eten.kp-soft.dev`)"
      entryPoints: [web]
      service: kitchen

  services:
    kitchen:
      loadBalancer:
        servers:
          - url: "http://10.10.10.21:8080"
