# traefik-docker-socket (expert panel 2026-09-27, fix-167): this proxy is the
# only container still touching /var/run/docker.sock, narrowed to the one
# endpoint Traefik's docker provider calls. There is no route and no
# published port to prove it from outside — the only honest reading is the
# proxy answering its own `_ping` the way the container's healthcheck already
# does, asked the same way Traefik does: inside the gateway_net.
checks:
  - name: "socket-proxy antwoordt op _ping"
    command: "docker exec socket-proxy wget -qO- http://localhost:2375/_ping"
    expect: must_be_present
    layer: process
    blind_spot: >-
      Only that the proxy's HTTP endpoint answers, not that Traefik's docker
      provider actually reads the CrowdSec bouncer label through it — that is
      the routes check in stacks/gateway/traefik/checks.yml.
