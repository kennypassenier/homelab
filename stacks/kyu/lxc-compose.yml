# Stack intent (schema v2 — intent only, no machine-written state).
#
# CT 109 holds three native services: the kyu message hub, kyu-runner (which
# pumps hub messages into Home Assistant) and http-switchboard (which
# translates Alertmanager's shape into one the hub accepts). All three are
# systemd units running a single binary, adopted with C7 — each has its own
# `service.yml` in this repository, and this file describes the CONTAINER
# they live in.
#
# It exists because Kenny asked the right question on 2026-08-31: the four
# native services could be backed up and updated, but nothing said how to
# rebuild the box they run on. A stack that can only be repaired by the person
# who remembers how it was built is not managed.
#
# `native_only` says out loud that this container runs no docker. Every number
# below is what CT 109 has right now, read from `pct config` — deliberately
# small, because the hub is a single Rust binary that idles at a few MB.
#
# Rebuilding it, in order:
#   1. this manifest recreates the container;
#   2. `homelab restore stacks/kyu` puts /var/lib/kyu and /etc/kyu back from
#      their own restic repositories (C7 backs them up per unit);
#   3. the three binaries are installed the way C7 installs them;
#   4. `homelab deploy stacks/kyu` writes the helper files under `rootfs/`
#      (kyu-backup + kyu-alert scripts, their units and the timer) to their
#      absolute paths and enables the timer — ask-2, 2026-09-20. Until then
#      those five existed only on the container.
# Nothing here starts or stops a service — that stays true after a rebuild
# too.

stack_name: kyu
vmid: 109
hostname: 109-app-kyu
native_only: true

network:
  ip: 10.10.10.9/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 1
  memory_mb: 256
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 128 MB.

  swap_mb: 0
  # Was 2 GB, which is the floor manifest.rs still enforces, and it was set
  # on 2026-08-31 when this container held ONE binary and no docker. It now
  # holds three services, each keeping a rollback copy beside its program,
  # and it went from Debian 12 to 13 in place, which needs working room in
  # /var. It hit 98% on 2026-09-10 and the fleet check called it broken.
  # Every other app container in the fleet is 4 GB or more; this was the
  # only one at the floor. Kenny's answer, same day: grow it to 4.
  disk_gb: 4
  storage: local-lvm

lxc:
  # 998 is the unprivileged golden template. It bakes docker in, which this
  # container does not need and will not be given — see native_only above.
  template: clone:996
  unprivileged: true
  # As it is today: nesting only, no keyctl. Not copied from the other
  # stacks, read from the container.
  features: nesting=1
  protection: true

boot:
  onboot: true
  order: 50

# Obsolete text removed 2026-09-02 (F204): the block that stood here said
# "No /appdata: adoption never bind-mounts" and named /var/lib/kyu and
# /etc/kyu as where the state lives. The migration of 2026-09-01 moved it and
# added the paragraph below without deleting the one above, so the file
# contradicted itself in consecutive lines. Measured before removing:
# /var/lib/kyu and /etc/kyu do not exist inside CT 109, the state is 6.5 MB
# under /appdata/kyu/kyu-config, and `pct config 109` shows all three mounts.
# Data and configuration on the host, bind-mounted in, so destroying this
# container costs nothing and the normal backup reaches them — the same
# protection every docker stack has (Kenny, P1 2026-08-31). One directory per
# service, so each gets its own restic repository named after its owner (D25).
#
# The BINARIES deliberately stay in the container: they belong to a version,
# not to the data, and mixing the two lets a restore hand back an old program
# without saying so.
#
# Worth knowing: kyu's env file carries KYU_TOKEN and KYU_SECRET_KEY, and the
# two token.env files carry the hub tokens. Until tonight those existed ONLY
# inside this container — they were in no vault and no backup. Moving them
# here is the first time they are protected at all.
storage:
  - host_path: /appdata/kyu/kyu-config
    mount_point: /appdata/kyu/kyu-config
    # kyu runs as uid 103 inside; 100103 is that uid mapped out of an
    # unprivileged LXC.
    host_owner_uid: 100103
    app: kyu
  - host_path: /appdata/kyu/kyu-runner-config
    mount_point: /appdata/kyu/kyu-runner-config
    # 100996, not 100000 (fix-26). kyu-runner 0.2.x runs as its own user
    # `kyu-runner` (uid 996 inside) and refuses to start unless it can write
    # this directory. With 100000 the deploy chowned it to root, and the
    # running service only noticed at its next restart, on 2026-09-26:
    # "the state directory ... is not writable". The same trap as
    # http-switchboard below, one directory further down.
    host_owner_uid: 100996
    app: kyu-runner
  - host_path: /appdata/kyu/http-switchboard-config
    mount_point: /appdata/kyu/http-switchboard-config
    # 100995, not 100000. The 1.x unit ran as root and read its config through
    # a systemd credential; the chassis-rs kit unit runs as its own user
    # `http-switchboard` (uid 995 inside) and both reads the config and writes
    # its state directly. This is an UNPRIVILEGED container, so the host-side
    # owner is 100000 + 995.
    #
    # Measured the hard way on 2026-09-10: with the old value the deploy
    # chowned the directory back to root after every run, and the unit then
    # failed at `CHDIR ... Permission denied` — a message about the working
    # directory, for a cause that lives in this file.
    host_owner_uid: 100995
    app: http-switchboard

# No docker apps by design. The three services are named in their own
# service.yml files: kyu, kyu-runner, http-switchboard.
apps: []

# latch-files (Kenny, 2026-09-30: "Vastleggen via latch"): http-switchboard's
# profiles hold Home Assistant's webhook id, so the file is a secret and not
# in git; it lived only on CT 109, changed by hand. Now it comes from latch
# (`stacks` project, prod) and a change restarts the unit, which reads the
# file by path. captured/messaging/http-switchboard/config.example.toml is
# its shape with the id taken out.
latch_files:
  - from: http-switchboard/config.toml
    dest: /appdata/kyu/http-switchboard-config/config.toml
    mode: "640"
    owner: root:http-switchboard
    restarts: http-switchboard

# The systemd units this container runs. Each has its own service.yml and
# its unit file in <unit>/<unit>.service — the unit file lives here now,
# which it did not before: losing the container would have lost the only
# copy of the file that makes the service exist.
natives: [kyu, kyu-runner, http-switchboard]

# fix-91 (expert panel, routes-outside-repo-unvalidated, 2026-09-27):
# kyu.kp-soft.dev. Written by hand on the gateway as manual-kyu.yml;
# routes/manual-kyu.yml is that file byte for byte, read from CT 104 the day
# it was brought in. Its own comment says a native stack cannot carry a
# route — no longer true, but it is kept as it is so the first deploy changes
# nothing. It keeps its name rather than becoming 109-app-kyu.yml: a rename
# would leave the old file routing the same hostname beside the new one
# until someone removed it by hand.
extra_routes:
  - filename: manual-kyu.yml
# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 109 (kyu), kyu, kyu-runner and http-switchboard (native).
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.2
      proto: tcp
      dport: "8123"
      note: kyu-runner and http-switchboard to Home Assistant webhooks
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8080,9100"
      note: Prometheus (kyu metrics, node exporter) and the Alertmanager webhook
    - dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "8080"
      note: Traefik route kyu
    - dir: in
      action: ACCEPT
      source: 10.10.10.6
      proto: tcp
      dport: "8080"
      note: Sonarr and Radarr webhooks
    - dir: in
      action: ACCEPT
      source: 10.10.10.2
      proto: tcp
      dport: "8080"
      note: Home Assistant rest_command.mailbox_publish
    - dir: in
      action: ACCEPT
      source: 10.10.10.250
      proto: tcp
      dport: "8080"
      note: the homelab daemon's notifications from pve
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "8080,8082,8083"
      note: Uptime Kuma HTTP monitors
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,8080"
      note: Kenny's desktop (ssh and the web ports the homepage tiles link to)
