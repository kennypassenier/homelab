# Stack intent (schema v2 — intent only, no machine-written state).
#
# Media: Jellyfin and the *arr suite. The last and most consequential of the
# four containers M8 replaces, and the one Kenny set the highest bar for:
# nothing to reconfigure in the Jellyfin client, the *arr suite still working,
# every library untouched inside the programs.
#
# The numbers it is measured against were recorded while everything was
# running (docs/legacy/m8/M8_CT106_PREFLIGHT.md): 896 movies, 203 series, 5462 episodes and
# 58 collections in Jellyfin; 209 series in Sonarr, 955 movies in Radarr,
# 5 indexers in Prowlarr. And the recovery net was exercised before anything
# was touched, not promised: a fresh vzdump restored onto a throwaway vmid,
# booted, with every database passing an integrity check and Sonarr's 209 and
# Radarr's 955 coming back exactly.

stack_name: media
vmid: 106
hostname: 106-app-media

network:
  ip: 10.10.10.6/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  # What the container has today.
  cores: 6
  memory_mb: 8192
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 512 MB.

  swap_mb: 0
  disk_gb: 80
  storage: local-lvm

lxc:
  # 997 is the privileged golden template. This container is privileged today
  # and stays so: PUID 1000 inside must remain host uid 1000, which is what
  # owns the media tree.
  template: clone:995
  unprivileged: false
  features: nesting=1,keyctl=1
  protection: true
  # W1 reads the group ids from the host instead of assuming them. Measured
  # here: card0 is 44 and renderD128 is 993 — not the 104 this code carried
  # until today (F110). This is the container where that wrong number would
  # have landed, and Jellyfin would have transcoded on the CPU without a word.
  gpu: true
  vpn: false

boot:
  onboot: true
  # After the downloader, which the *arr apps expect to be there.
  order: 95

storage:
  # One directory per app, so each keeps its own restic repository named
  # after its owner (D25).
  - host_path: /appdata/media/jellyfin-config
    mount_point: /appdata/media/jellyfin-config
    # Privileged container: in-container uid 1000 IS host uid 1000.
    host_owner_uid: 1000
    app: jellyfin
  - host_path: /appdata/media/sonarr-config
    mount_point: /appdata/media/sonarr-config
    host_owner_uid: 1000
    app: sonarr
  - host_path: /appdata/media/radarr-config
    mount_point: /appdata/media/radarr-config
    host_owner_uid: 1000
    app: radarr
  - host_path: /appdata/media/prowlarr-config
    mount_point: /appdata/media/prowlarr-config
    host_owner_uid: 1000
    app: prowlarr
  - host_path: /appdata/media/bazarr-config
    mount_point: /appdata/media/bazarr-config
    host_owner_uid: 1000
    app: bazarr
  - host_path: /appdata/media/seerr-config
    mount_point: /appdata/media/seerr-config
    host_owner_uid: 1000
    app: seerr

# Attached, never owned, never backed up.
data_mounts:
  - host_path: /HDD18TB/subvol-103-disk-0
    mount_point: /mnt/data/18TB
    note: "CT 103's dataset; the 18 TB library and the downloads tree"
  - host_path: /HDD12TB/subvol-103-disk-0
    mount_point: /mnt/data/12TB
    note: "CT 103's dataset; the 12 TB library"
  - host_path: /HDD4TB/jellyfin-metadata
    mount_point: /mnt/jellyfin-metadata
    note: "Jellyfin's artwork — regenerable, deliberately outside the backup (Kenny, M1)"

apps: [jellyfin, sonarr, radarr, prowlarr, bazarr, seerr, flaresolverr, recyclarr]

gateway_route:
  filename: 106-app-media.yml
  gateway_vmid: 104

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 106 (media), media: Jellyfin and the *arr apps.
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.17
      proto: tcp
      dport: "5000:5003"
      note: registry cache (docker pulls; the deploy probes all four)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.5
      proto: tcp
      dport: "8080"
      note: Sonarr and Radarr to qBittorrent
    - dir: out
      action: ACCEPT
      dest: 10.10.10.9
      proto: tcp
      dport: "8080"
      note: Sonarr and Radarr webhooks to kyu
    - dir: out
      action: ACCEPT
      dest: 10.10.10.2
      proto: tcp
      dport: "8123"
      note: Jellyfin webhook plugin to Home Assistant
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "8096,8989,7878,6767,9696,5055"
      note: Traefik routes
    - dir: in
      action: ACCEPT
      source: 10.10.10.15
      proto: tcp
      dport: "8096,8989,7878,6767,9696,5055"
      note: homepage widgets
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8081,9100"
      note: Prometheus (cadvisor, node exporter)
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "8096,8989,7878,6767,9696,5055"
      note: Uptime Kuma HTTP monitors
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,8096,8989,7878,6767,9696,5055"
      note: Kenny's desktop (ssh and the web ports the homepage tiles link to)

# app-knowledge (Kenny, 2026-09-30: "Alles verplaatsen"): each app's tile on
# the Homepage front page. `key_command` prints the app's API key and nothing
# else, run inside this container; {dir} is the app's config directory. It
# was a table of apps in core/src/ops/homepage.rs until then.
homepage_widgets:
  jellyfin:
    kind: jellyfin
    key_command: "sqlite3 {dir}/data/jellyfin.db 'select AccessToken from ApiKeys limit 1'"
    extra: ["enableNowPlaying: true", "enableBlocks: true"]
  sonarr:
    kind: sonarr
    key_command: "sed -n 's|.*<ApiKey>\\(.*\\)</ApiKey>.*|\\1|p' {dir}/config.xml"
  radarr:
    kind: radarr
    key_command: "sed -n 's|.*<ApiKey>\\(.*\\)</ApiKey>.*|\\1|p' {dir}/config.xml"
  prowlarr:
    kind: prowlarr
    key_command: "sed -n 's|.*<ApiKey>\\(.*\\)</ApiKey>.*|\\1|p' {dir}/config.xml"
  bazarr:
    kind: bazarr
    key_command: "sed -n 's/^ *apikey: *//p' {dir}/config/config.yaml | head -1"
  # The route is `seerr`; the software Homepage knows is `jellyseerr`.
  seerr:
    kind: jellyseerr
    key_command: "sed -n 's/.*\"apiKey\": *\"\\([^\"]*\\)\".*/\\1/p' {dir}/settings.json | head -1"
