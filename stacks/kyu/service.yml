# Native service on CT 109, migrated to the chassis-rs kit layout on
# 2026-09-10 after that container was upgraded to Debian 13.
#
# The first attempt at this migration was on 2026-09-09 and was reverted the
# same hour: every kit release then needed GLIBC_2.39 and the container ran
# Debian 12 with 2.36, so the binary could not start at all. Two things
# changed since. The container is on Debian 13 (glibc 2.41), and the kit
# builds statically — `file` on the kyu release now says `static-pie linked`
# with no glibc symbols at all, so this layout no longer depends on either.
#
# update_cmd is adopted from the service's own deploy/service.yml, including
# the `--property=Environment=` lines. Those are not decoration: the unit sets
# them, and an update running outside the unit without them reports "the new
# version cannot start with this machine's configuration" while the machine is
# perfectly fine. That cost a rollout on 2026-09-09.
#
# Supervised nightly updates are Kenny's decision of 2026-09-09 (form G2): the
# homelab runs these, with the armed rollback that watches a settle window
# rather than a single reading.
stack_name: kyu
vmid: 109
hostname: 109-app-kyu
unit: kyu
binary: /opt/kyu/bin/kyu
env_file: /appdata/kyu/kyu-config/kyu.env
data_dirs:
  - /appdata/kyu/kyu-config
update_cmd: >-
  systemd-run --wait --pipe --collect --uid=kyu --gid=kyu
  --property=EnvironmentFile=/appdata/kyu/kyu-config/kyu.env
  --property=WorkingDirectory=/appdata/kyu/kyu-config
  --property=Environment=KYU_STATE_DIR=/appdata/kyu/kyu-config
  --property=Environment=KYU_TIMEOUT_STOP_SECS=60
  /opt/kyu/bin/kyu update
release_repo: kennypassenier/kyu
release_asset: kyu
# T77 (D94, Kenny 2026-09-02; live 2026-09-20): the nightly backup archives
# the copy kyu makes of itself at 03:00 (kyu-backup.timer, VACUUM INTO,
# integrity-checked before it reports success) instead of tarring the live
# store while it is being written to. The newest match must be under 26 h
# old, or the backup fails rather than archiving yesterday's file.
#
# RESTORE NOTE: such a copy is a COMPLETE database. Put it back as
# /appdata/kyu/kyu-config/kyu.db and delete any kyu.db-wal and kyu.db-shm
# beside it — they belong to the old file and confuse SQLite about what it
# is looking at. The reverse of the moving rule, where those three travel
# together.
backup_from_newest: /appdata/kyu/kyu-config/kyu.backup-*.db
# B1 (UPDATE_POLICY.md, decided 2026-09-19): the orchestrator owns kyu's
# recurring update. Nightly: fetch the latest release's SHA256SUMS, compare
# with the installed binary, install under the armed rollback when it differs.
update_policy: auto
