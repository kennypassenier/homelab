# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Recyclarr keeps Sonarr's and Radarr's quality profiles in step with the
# TRaSH guides, so nobody has to open those screens again. Written from the
# frozen decision set R1-R11 (vault note "Homelab Planned Services" §5); every
# choice carries its decision number.
#
# Every trash_id below was READ on 2026-09-04 out of the guide the pinned
# image itself ships with, not recalled:
#
#   docker run --rm -v /tmp/rcy:/config ghcr.io/recyclarr/recyclarr:8.7.2 \
#     list custom-formats radarr
#
# which clones https://github.com/recyclarr/config-templates and
# trash-guides into /config/resources. The ids are the ones in
# resources/trash-guides/git/official/docs/json/. An earlier draft of this
# file carried four ids written from memory, which is the mistake the guide's
# own warning exists for: a wrong id silently scores the wrong thing.
#
# ── Two deliberate absences ────────────────────────────────────────────────
#
#   * NO `quality_definition`. The size caps R2 (150 MB/min for movie
#     720p/1080p), R3 (100 MB/min for episode 720p/1080p) and R11
#     (250 MB/min for 2160p) are set and verified in both applications.
#     Recyclarr can only scale the whole TRaSH size table by one ratio, so
#     letting it near this would replace three measured numbers with a guess.
#     Every TRaSH template starts with such a block; it is left out on
#     purpose, not forgotten.
#
#   * NO renaming of profiles. Films and series point at a profile by **id**,
#     never by name, so the profiles Kenny already has are managed IN PLACE
#     (R7) by giving the guide-backed profile his name. 961 films and 210
#     series stay linked to exactly the profile they already point at and
#     inherit the new rules the moment this runs. Their state before any of
#     this is exported to `captured/media-profiles/` in the repository.
#
# ── Why preferences are rewards here and never punishments ─────────────────
#
# Both profiles carry `minFormatScore: 0`, which in Sonarr and Radarr means a
# release must reach a score of at least zero to be downloaded AT ALL. So a
# custom format with a small negative score does not gently deprioritise a
# release, it blocks it outright as soon as nothing else scores. R4 and R5 ask
# for preferences, not blocks — so what is preferred gets a small POSITIVE
# score and the alternative stays at zero. Only R6, which really does mean
# "never download this", uses a negative score, and uses the guide's -10000.

radarr:
  main:
    # Same docker network, so this is the container's own name. It does not go
    # out through Traefik: the public name meets Cloudflare Access and would
    # get a login page rather than an API (D102).
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    # Both applications had ZERO custom formats before this ran (measured
    # 2026-09-04), so everything here creates rather than replaces, and
    # anything this file later drops is Recyclarr's to clean up.
    delete_old_custom_formats: true

    quality_profiles:
      # R1: ceiling at Bluray-1080p, Remux not allowed. The TRaSH profile
      # already says exactly that — Bluray-1080p, WEB 1080p, Bluray-720p and
      # nothing above. R7: `name` overrides the guide's "HD Bluray + WEB" so
      # the profile Kenny's 961 films point at is the one being managed.
      #
      # What changes for those films: HDTV-1080p and Remux-1080p stop being
      # allowed. Remux is R1's own decision; HDTV is TRaSH's, and letting the
      # guide have that opinion is what "Recyclarr manages this" means.
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        name: "1080p"
        reset_unmatched_scores:
          enabled: true
      # R8: the Ultra-HD profile is managed too, with 4K scoring. It holds no
      # films today, so nothing moves; it also loses Remux-1080p, which had no
      # business in a 4K profile and is R1 again.
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        name: "Ultra-HD"
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      skip:
        # R4: x265 (HD) must be scored below x264 and NEVER blocked. This
        # group's whole purpose is to block it — the guide gives x265 (HD) a
        # score of -10000, which at `minFormatScore: 0` means "refuse". So the
        # group is skipped and the preference is expressed below instead.
        #
        # The UHD Golden Rule group is deliberately NOT skipped: its default
        # member is `x265 (no HDR/DV)`, a different format at 2160p, and R4
        # says nothing about it.
        - f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD

    custom_formats:
      # R4, the other half: an x264 release wins from an otherwise identical
      # x265 one, and an x265-only release is still downloaded rather than
      # refused. +50 is small next to the release-group tiers (roughly 1000
      # and up), so it decides a tie and never overrules quality.
      - trash_ids:
          - 2899d84dc9372de3408e6d8cc18e9666  # x264
        assign_scores_to:
          - name: "1080p"
            score: 50
          - name: "Ultra-HD"
            score: 50

      # R6: dubbed releases are blocked. The guide's [Unwanted] Unwanted
      # Formats group already carries this format at -10000 and is synced by
      # default; it is written out here as well so the decision is visible in
      # the file where a reader looks for it, and so it survives the guide
      # changing its mind about the default.
      - trash_ids:
          - c465ccc73923871b3eb1802042331306  # Line/Mic Dubbed
        assign_scores_to:
          - name: "1080p"
            score: -10000
          - name: "Ultra-HD"
            score: -10000

sonarr:
  main:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    quality_profiles:
      # R1 and R7 again, for episodes — with one override, and it is the only
      # place in this file where the guide is contradicted.
      #
      # TRaSH's WEB-1080p profile allows WEB 1080p and NOTHING else. Kenny's
      # profile allows Bluray-1080p, Bluray-720p, HDTV-1080p, WEB 1080p and
      # Remux. Taking the guide's list unchanged would mean 210 series can no
      # longer grab a Bluray release at all, which is not what R1 says: R1
      # says the CEILING is Bluray-1080p and that Remux is not allowed
      # anywhere. So the scores come from the guide and the allowed qualities
      # come from R1.
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        name: "1080p"
        reset_unmatched_scores:
          enabled: true
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000

    custom_format_groups:
      skip:
        - 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD — R4

    custom_formats:
      # R4 for episodes.
      - trash_ids:
          - cddfb4e32db826151d97352b8e37c648  # x264
        assign_scores_to:
          - name: "1080p"
            score: 50

      # R5: lossy audio is preferred and lossless does not win. Nothing is
      # blocked — a lossless release is still downloaded when it is the only
      # one there; it simply loses a tie. Same reward-rather-than-punish
      # reason as R4: a negative score here would refuse the release outright.
      #
      # MP3 is lossy and deliberately NOT in this list. R5 is a preference for
      # lossy over lossless, not a preference for the worst lossy format
      # available; at 0 it stays downloadable without being promoted.
      - trash_ids:
          - 4232a509ce60c4e208d13825b7c06264  # DD+ ATMOS
          - 63487786a8b01b7f20dd2bc90dd4a477  # DD+
          - c1a25cd67b5d2e08287c957b1eb903ec  # DTS-ES
          - 5964f2a8b3be407d083498e4459d05d0  # DTS
          - a50b8a0c62274a7c38b09a9619ba9d86  # AAC
          - dbe00161b08a25ac6154c55f95e6318d  # DD
          - 28f6ef16d61e2d1adfce3156ed8257e3  # Opus
        assign_scores_to:
          - name: "1080p"
            score: 25

      # R6 for episodes. Sonarr's Unwanted Formats group does NOT carry a
      # dubbed format — measured, not assumed — so unlike Radarr this one has
      # to be named, or R6 would silently not hold for series at all.
      - trash_ids:
          - 9c14d194486c4014d422adc64092d794  # Dubs Only
        assign_scores_to:
          - name: "1080p"
            score: -10000
