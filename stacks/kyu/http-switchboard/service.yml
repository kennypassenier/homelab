# Native service on CT 109, migrated to the chassis-rs kit layout on
# 2026-09-10 after that container was upgraded to Debian 13.
#
# The first attempt at this migration was on 2026-09-09 and was reverted the
# same hour: every kit release then needed GLIBC_2.39 and the container ran
# Debian 12 with 2.36, so the binary could not start at all. Two things
# changed since. The container is on Debian 13 (glibc 2.41), and the kit
# builds statically — `file` on the kyu release now says `static-pie linked`
# with no glibc symbols at all, so this layout no longer depends on either.
#
# update_cmd is adopted from the service's own deploy/service.yml, including
# the `--property=Environment=` lines. Those are not decoration: the unit sets
# them, and an update running outside the unit without them reports "the new
# version cannot start with this machine's configuration" while the machine is
# perfectly fine. That cost a rollout on 2026-09-09.
#
# Supervised nightly updates are Kenny's decision of 2026-09-09 (form G2): the
# homelab runs these, with the armed rollback that watches a settle window
# rather than a single reading.
stack_name: kyu
vmid: 109
hostname: 109-app-kyu
unit: http-switchboard
binary: /opt/http-switchboard/bin/http-switchboard
env_file: /appdata/kyu/http-switchboard-config/token.env
data_dirs:
  - /appdata/kyu/http-switchboard-config
update_cmd: >-
  systemd-run --wait --pipe --collect --uid=http-switchboard --gid=http-switchboard
  --property=EnvironmentFile=/appdata/kyu/http-switchboard-config/token.env
  --property=WorkingDirectory=/appdata/kyu/http-switchboard-config
  --property=Environment=HTTP_SWITCHBOARD_STATE_DIR=/appdata/kyu/http-switchboard-config
  --property=Environment=HTTP_SWITCHBOARD_TIMEOUT_STOP_SECS=60
  /opt/http-switchboard/bin/http-switchboard update
release_repo: kennypassenier/http-switchboard
release_asset: http-switchboard
