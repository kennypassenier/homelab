[package]
name = "homelab-host"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Homelab HOST daemon: Proxmox LXC lifecycle + stack sync over one authenticated WS line"

[dependencies]
homelab-core = { path = "../core" }
homelab-proto = { path = "../proto" }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
async-trait.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rcgen = "0.13"
sha2 = "0.10"
base64 = "0.22"
# fix-53: killpg, to end a timed-out command's whole process group.
libc = "0.2"

[dev-dependencies]
# The host's tests drive core with the MockExecutor (test-support feature).
homelab-core = { path = "../core", features = ["test-support"] }
tokio-tungstenite = "0.26"
