# The only door to Loki from the LAN (fix-93; Kenny's answer to the expert
# panel's loki-unauthenticated-open, 2026-09-27: "alleen afleveren, lezen
# intern, wissen uit"). Every container's Alloy pushes here, Uptime Kuma asks
# /ready, and everything else gets 403: no query, no label list, no delete
# request. Loki itself answers only on metrics_net and on this container's
# loopback.
server {
    listen 8080;
    server_tokens off;

    # Docker's resolver, asked at request time: Loki may start after this
    # front, or come back with another address after a recreate, and a name
    # resolved once at startup would keep pointing at the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $loki http://loki:3100;

    # Alloy sends batches of up to 1 MiB, snappy-compressed; the default
    # 1 MiB limit here would refuse a full one.
    client_max_body_size 16m;

    location = /loki/api/v1/push {
        limit_except POST { deny all; }
        # Every container pushes about once a second, and these lines would
        # be shipped to Loki as this container's logs in turn.
        access_log off;
        proxy_pass $loki;
    }

    location = /ready {
        limit_except GET { deny all; }
        access_log off;
        proxy_pass $loki;
    }

    # A refused request is logged: someone asked for something only Grafana
    # may ask for, and that line reaches Loki as this container's log.
    location / {
        return 403;
    }
}
