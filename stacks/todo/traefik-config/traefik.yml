# Traefik v3 static configuration
#
# Traffic flow:
#   Internet → Cloudflare (TLS) → cloudflared tunnel → HTTP port 80 → Traefik → app containers
#
# Cloudflare handles TLS for the public domain (kp-soft.dev).
# Traefik receives plain HTTP on port 80 from cloudflared and routes by Docker label.
# All routable app containers must join the 'traefik_proxy' Docker network.

providers:
  docker:
    # Only expose containers that explicitly set traefik.enable=true.
    exposedByDefault: false
    # Route to containers via the shared 'traefik_proxy' Docker network.
    # Containers that don't join this network cannot be reached by Traefik.
    network: traefik_proxy

entryPoints:
  # Primary entrypoint — receives HTTP traffic from cloudflared on port 80.
  web:
    address: ":80"
  # Optional: direct HTTPS access to the LXC, not used by the cloudflare tunnel.
  websecure:
    address: ":443"

# ACME / Let's Encrypt is NOT needed when using Cloudflare tunnel.
# Cloudflare provides TLS certificates for your public domain automatically.
# Uncomment the block below only if you want Traefik to also serve HTTPS directly
# (e.g. for internal access bypassing Cloudflare):
#
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: ${ACME_EMAIL}
#       storage: /acme/acme.json
#       httpChallenge:
#         entryPoint: web

log:
  level: INFO
