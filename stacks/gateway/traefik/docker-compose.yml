# Traefik v3. Receives everything from the Cloudflare tunnel on :80 — there is
# no :443 here, TLS terminates at Cloudflare, which is why every route says
# entryPoints: [web].
services:
  traefik:
    # fix-82 (manual-images-latest-unpinned, 2026-09-27): the version and
    # digest CT 104 ran that day. `:latest` let a rebuild pull whatever was
    # newest; moving it is an edit of this line.
    image: traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik
    networks:
      - gateway_net
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      # Kenny, 2026-10-01: the "Upgrade to Traefik Hub" banner is an ad for
      # the paid product; nothing here uses it.
      - "--api.disabledashboardad=true"
      - "--entrypoints.web.address=:80"
      # The tunnel's requests reach :80 through docker's bridge, so every
      # visitor arrived as 172.18.0.1 (measured 2026-09-27: 462 of 464
      # kp-soft.dev requests) and CrowdSec, which whitelists 172.16.0.0/12,
      # could ban nobody. X-Forwarded-For is trusted from docker's own range
      # only: nothing outside CT 104 can send from it.
      - "--entrypoints.web.forwardedHeaders.trustedIPs=172.16.0.0/12"
      # Docker provider, for the containers on this machine.
      - "--providers.docker=true"
      - "--providers.docker.network=gateway_net"
      - "--providers.docker.exposedbydefault=false"
      # File provider: every stack renders its own route fragment here.
      - "--providers.file.directory=/etc/traefik/routes"
      - "--providers.file.watch=true"
      # Local plugin source. A single failed download to plugins.traefik.io
      # once turned ALL plugins off (2026-07-31), so the source is on disk.
      - "--experimental.localPlugins.bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      # On the entrypoint rather than per route: it then covers every current
      # and future router and survives the route files being re-rendered,
      # which per-route attachment does not.
      - "--entrypoints.web.http.middlewares=crowdsec-bouncer@docker"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
      - "--log.level=INFO"
      # Traefik's OWN log goes to stdout, so it lands in docker's log like
      # every other container here: capped by the runaway guards, shipped to
      # Loki by Alloy, and readable with `docker logs`. It used to go to a
      # file, which meant nothing shipped it, nothing capped it, and the
      # reason for a fleet-wide 403 on 2026-09-01 could only be found by
      # knowing which file to open.
      #
      # The ACCESS log stays a file on purpose: CrowdSec parses it and
      # GoAccess reports on it, so it has two readers that need it on disk.
      - "--ping=true"
      # Traefik's own counters (expert panel 2026-09-27, traefik-no-metrics),
      # on an entrypoint of their own so they never share :80 with the
      # tunnel's traffic.
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--metrics.prometheus.addServicesLabels=true"
    env_file:
      - .env
    environment:
      - TZ=Europe/Brussels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /appdata/gateway/traefik-config:/etc/traefik
      # Same directory, mounted twice on purpose: Traefik writes its logs
      # here and CrowdSec and GoAccess read them. 141 of the 142 MB in
      # traefik-config is this. Kenny chose (form G3) to move it out of the
      # backed-up tree as a separate step AFTER this rebuild.
      - /mnt/traefik-logs:/var/log/traefik
      - /appdata/gateway/traefik-config/plugins-local:/plugins-local:ro
    ports:
      - "80:80"
      - "8090:8080"
      - "8082:8082"
    restart: unless-stopped
    labels:
      # A definition, not a route — the entrypoint flag above names it
      # `@docker`, so it has to be declared here. The three ROUTES that used
      # to be labels now live in traefik-routes.yml.
      - "traefik.enable=true"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.bouncer.enabled=true"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.bouncer.crowdseclapikey=${TRAEFIK_CROWDSEC_BOUNCER_API_KEY}"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.bouncer.crowdseclapihost=crowdsec:8080"
      # The bouncer decides on the visitor's own address: the header
      # Cloudflare sets, believed only from docker's range (see the
      # entrypoint flag above).
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.bouncer.forwardedheaderstrustedips=172.16.0.0/12"
      - "traefik.http.middlewares.crowdsec-bouncer.plugin.bouncer.forwardedheaderscustomname=CF-Connecting-IP"
      - "com.homelab.backup.pause=true"
      # Y1/Z1: UPDATE_POLICY.md puts this in the MANUAL class - a silent
      # failure here is expensive, and the gateway is the one container
      # whose breakage takes every other name down with it. The label
      # read auto until 2026-09-02 (F192), so the ratified decision and
      # the fleet disagreed for as long as both existed.
      - "com.homelab.update.policy=manual"
      - "com.homelab.update.upstream=github.com/traefik/traefik"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

# One network for the whole stack, created by the deploy. Traefik must be ON
# it, not merely told its name: the --providers.docker.network flag says which
# network to prefer when a container has several, and it cannot join one by
# itself. Without this, traefik sits on its own default network, cannot reach
# crowdsec:8080, and the bouncer plugin fails closed — 403 on every hostname
# in the house, which is exactly what happened on 2026-09-01.
networks:
  gateway_net:
    external: true
    name: gateway_net
