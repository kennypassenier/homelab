# The pump from the hub into Home Assistant. It listens on 10.10.10.9:8082 —
# not 8081, which cadvisor owns fleet-wide, and not 127.0.0.1, which answers
# nothing. Both of those cost a wrong conclusion once.
checks:
  - name: "the runner is healthy"
    command: "curl -s -m 10 http://10.10.10.9:8082/healthz"
    expect: must_match
    layer: application
    blind_spot: >-
      The runner answering about itself. Whether a message actually arrives in
      Home Assistant runs through the webhook, and only a real message proves
      that — it is in the manual list.

manual:
  # fix-182: explicit id, with `replaces` carrying over the answer this
  # check held under the hash of its pre-translation Dutch text (fix-178).
  - text: "Send a test message through the chain and check whether it arrives in Home Assistant. Every link reports itself healthy, even on the day the chain was broken in the middle."
    id: kyu-runner-test-message-reaches-home-assistant
    replaces: ["e576228c"]

# checks-automate (Kenny, 2026-09-30: "Alles wat kan"): what a machine can
# measure of the question above, in every fleet check. Tried once for real on
# 2026-09-30, read-only; the reading then is in each probe's comment.
probes:
  # Read 2026-09-30: 0 (346 delivered).
  - name: "messages Home Assistant refused"
    command: |
      wget -qO- http://10.10.10.9:8082/metrics | awk '/^kyu_runner_nacked_total/{n+=$2} END{printf "%d\n", n}'
    healthy: {equals: "0"}
    layer: application
    id: kyu-runner-messages-refused-by-home-assistant
    blind_spot: "HA accepted each message; that the right automation acted on it is the question above"
