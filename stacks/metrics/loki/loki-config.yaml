auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

limits_config:
  retention_period: 744h  # 31 days

# Changing this file restarts Loki on the next metrics deploy; the deploy then
# re-reads Loki's readiness for up to 60 s before calling it a change
# (fix-27, measured 2026-09-27 with this very edit).
# No alerting from Loki (T64 grafana-contact, Kenny 2026-09-26). Alerts go
# through Prometheus -> Alertmanager -> kyu -> Home Assistant (D54), the one
# path that is proven. The alertmanager_url that used to sit here pointed at
# a localhost Alertmanager that never existed, so the file promised a route
# nobody had. The ruler keeps its local storage and holds no rules.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
