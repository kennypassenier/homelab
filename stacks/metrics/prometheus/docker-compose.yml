services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      # The TSDB lives on pve's root (/dev/mapper/pve-root, shared with
      # pmxcfs and the logs): 6.33 GB and +0.22 GB a day on 2026-09-27. A
      # cardinality blow-up must hit this cap, not fill the hypervisor.
      - --storage.tsdb.retention.size=15GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - /appdata/metrics/prometheus-config:/prometheus
    ports:
      - "9090:9090"
    labels:
      - com.homelab.update.policy=manual
    networks:
      - metrics_net

networks:
  metrics_net:
    external: true
    name: metrics_net
