[package]
name = "homelab-client"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Homelab CLIENT CLI: drives the HOST daemon over the authenticated WS line"

[[bin]]
name = "homelab"
path = "src/main.rs"

[dependencies]
homelab-core = { path = "../core" }
homelab-proto = { path = "../proto" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
rustls = "0.23"
sha2.workspace = true
toml.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
base64.workspace = true

[dev-dependencies]
rcgen.workspace = true
# Only the TLS pin tests use it (rust-code-hygiene, 2026-09-27: it was a
# normal dependency, built into every release binary).
tokio-rustls = "0.26"

[lints]
workspace = true
