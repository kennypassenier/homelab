# Core app (D8): ships this stack's docker logs to the platform Loki.
# Injected into every new stack; delete the directory from a stack to opt out.
services:
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ./data:/tmp/positions
    restart: unless-stopped
    networks:
      - uptime_net

networks:
  uptime_net:
    external: true
    name: uptime_net
