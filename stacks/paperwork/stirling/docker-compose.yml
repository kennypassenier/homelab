# Stirling-PDF — split, merge, rotate and convert PDFs. Stateless: it holds
# no library, only whatever file you hand it for the length of one operation.
# The mounted directory carries its own settings, nothing user-owned.
#
# N2 (mini-round 2026-08-31): reachable from the internet. Two corrections
# to what the mini-round assumed, both found by measuring rather than
# reading:
#
#  1. Every *.kp-soft.dev hostname sits behind Cloudflare Access — verified
#     2026-08-31, grafana.kp-soft.dev and fin.kp-soft.dev both answer 302 to
#     mendax1.cloudflareaccess.com. The interactive login happens before a
#     request ever reaches Traefik.
#  2. Stirling-PDF 2.x has a mandatory login regardless of
#     DOCKER_ENABLE_SECURITY: the container comes up with the "security"
#     profile active and an `admin` account on a documented default
#     password. Left alone that is a known credential on a public hostname.
#     SECURITY_INITIALLOGIN_* names the account and its password instead,
#     both from latch.

services:
  stirling:
    image: stirlingtools/stirling-pdf:2.14.3
    container_name: stirling
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SYSTEM_DEFAULTLOCALE=nl-NL
    volumes:
      - /appdata/paperwork/stirling-config:/configs
    ports:
      - "8080:8080"
    labels:
      # Nothing to quiesce: no database, no state carried between requests.
      - com.homelab.update.policy=auto
    networks:
      - paperwork_net

networks:
  paperwork_net:
    external: true
    name: paperwork_net
