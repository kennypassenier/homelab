# Stack intent (schema v2 — intent only, no machine-written state).
#
# CT 112 holds one native service: almanac, the hub that turns events into
# Google Calendar entries. It is a systemd unit running a single binary,
# adopted with C7; `service.yml` beside this file describes the service, and
# this file describes the container it lives in.
#
# Same reason as CT 109: the service could be backed up and updated, but
# nothing in the repository said how to rebuild the box. Kenny asked for that
# on 2026-08-31.
#
# Every number below is what CT 112 has right now, read from `pct config`.
#
# Rebuilding it, in order:
#   1. this manifest recreates the container;
#   2. the service's data comes back from its own restic repository by
#      hand, as docs/OPERATIONS_RUNBOOK.md op-11 describes (`homelab restore`
#      refuses a native stack: its backup is one tar stream, gap-28);
#   3. the binary is installed the way C7 installs it.

stack_name: almanac
vmid: 112
hostname: 112-app-almanac
native_only: true

network:
  ip: 10.10.10.12/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 1
  memory_mb: 512
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 256 MB.

  swap_mb: 0
  disk_gb: 4
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: nesting=1
  protection: true

boot:
  onboot: true
  order: 50

# Its state on the host, bind-mounted in, so destroying this container costs
# nothing and the normal backup reaches it — the same protection every docker
# stack has (Kenny, P1/B2 2026-09-01).
#
# It took a released feature to get here. The first attempt failed because
# almanac wrote to /opt/almanac/data by absolute path and latch keyed its
# project link on one (F125). The request went to the almanac project, which
# shipped ALMANAC_STATE_DIR in 1.4.0 — one root, every path derived from it —
# and latch's link moved with the directory.
#
# The BINARY stays at /opt/almanac on purpose: it belongs to a version, not to
# the data, and mixing the two lets a restore hand back an old program without
# saying so.
storage:
  - host_path: /appdata/almanac/almanac-config
    mount_point: /appdata/almanac/almanac-config
    # almanac runs as uid 999 inside; 100999 is that uid mapped out of an
    # unprivileged LXC.
    host_owner_uid: 100999
    app: almanac

apps: []

# The systemd units this container runs. Each has its own service.yml and
# its unit file in <unit>/<unit>.service — the unit file lives here now,
# which it did not before: losing the container would have lost the only
# copy of the file that makes the service exist.
natives: [almanac]

# fix-91 (expert panel, routes-outside-repo-unvalidated, 2026-09-27):
# almanac.kp-soft.dev. The route was written by hand on the gateway on
# 2026-08-29 and lived nowhere else; traefik-routes.yml beside this file is
# that file byte for byte, read from CT 104 the day it was brought in, so the
# first deploy rewrites it without changing it. It already had the name a
# gateway_route must have, so it becomes an ordinary one.
gateway_route:
  filename: 112-app-almanac.yml
# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 112 (almanac), almanac (native).
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8080,9100"
      note: Prometheus (almanac metrics, node exporter)
    - dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "8080"
      note: Traefik route almanac
    - dir: in
      action: ACCEPT
      source: 10.10.10.16
      proto: tcp
      dport: "8080"
      note: JobTracker events (JOBTRACKER_ALMANAC_URL)
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,8080"
      note: Kenny's desktop (ssh and the web ports the dashboard tiles link to)

# replace-homepage (Kenny, 2026-09-30): this stack's tiles on the dashboard's
# start page, keyed by the hostname they open (or an id with `url:`). Moved
# here from Homepage's services-overlay.yml; groups follow their lowest order.
tiles:
  almanac.kp-soft.dev:
    name: "Almanac"
    group: "Own"
    order: 302
    description: "Calendar hub"
