# What "radarr is healthy" means, from the readings made by hand during the
# CT 106 rebuild. The API key comes from radarr's own config file: a key
# stored here would be a secret in the wrong place, and one that would rot
# unnoticed the way Jellyfin's did (F131).
checks:
  - name: "films onder beheer"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/radarr-config/config.xml);
      printf 'header = "X-Api-Key: %s"\n' "$K" | curl -s -m 40  -K - http://127.0.0.1:7878/api/v3/movie |
       grep -cE '"titleSlug":' 
    expect: never_decreases
    layer: application
    blind_spot: >-
      Counts what radarr knows about, not whether the files behind it are
      readable.

  - name: "gezondheidsmeldingen"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/radarr-config/config.xml);
      printf 'header = "X-Api-Key: %s"\n' "$K" | curl -s -m 40  -K - http://127.0.0.1:7878/api/v3/health |
      grep -oE '"type":' | wc -l
    expect: must_be_present
    layer: application
    blind_spot: >-
      How many warnings there are, not whether they matter. Three failing
      indexers during the rebuild were all healthy an hour later.

  - name: "root folder paden"
    command: >-
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/radarr-config/config.xml);
      printf 'header = "X-Api-Key: %s"\n' "$K" | curl -s -m 40  -K - http://127.0.0.1:7878/api/v3/rootfolder |
      grep -oE '/data/[0-9]*TB/[A-Za-z0-9]*' | sort -u | tr '\n' ','
    expect: must_match
    layer: application
    blind_spot: >-
      Every root folder in the database is stored as one of these paths, so a
      change breaks all of them at once — but this reads the paths, not
      whether the films are there.

# checks-automate (Kenny, 2026-09-30: "Alles wat kan"): the questions a
# machine can answer, measured in every fleet check. Tried once for real on
# 2026-09-30, read-only; the reading then is in each probe's comment.
probes:
  # Read 2026-09-30: 0.
  - name: "films buiten de root folders"
    command: |
      K=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /appdata/media/radarr-config/config.xml)
      C=$(mktemp); trap 'rm -f "$C"' EXIT; printf "header = %s\n" "X-Api-Key: $K" > "$C"
      R=$(wget --config="$C" -qO- http://localhost:7878/api/v3/rootfolder | jq -c '[.[].path]')
      wget --config="$C" -qO- http://localhost:7878/api/v3/movie | jq --argjson r "$R" '[.[]|.path as $p|select(any($r[]; . as $x|$p|startswith($x+"/"))|not)]|length'
    healthy: {equals: "0"}
    layer: application
