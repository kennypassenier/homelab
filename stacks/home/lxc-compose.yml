# Stack intent (schema v2 — intent only, no machine-written state).
#
# Homepage: one page that lists everything in the house. Kenny asked for it
# on 2026-08-31 and chose its own container over joining the gateway (P1).
#
# The gateway would have been the obvious home — a start page is the front
# door and belongs with the reverse proxy. Kenny picked purity instead, and
# the reason holds up: CT 104 is not managed by the orchestrator until M8, so
# anything placed there gets no backup, no log caps and no monitor. Three
# separate failures that night came from exactly that gap. A page whose whole
# content lives in this repo is cheap to host properly from the start.
#
# Deliberately small: Homepage is a Node process reading YAML. It holds
# nothing, computes nothing, and its config directory is the only state.

stack_name: home
vmid: 115
hostname: 115-app-home

network:
  ip: 10.10.10.15/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 2
  memory_mb: 1024
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 512 MB.

  swap_mb: 0
  disk_gb: 8
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: nesting=1,keyctl=1
  protection: true

boot:
  onboot: true
  # Last: it links to everything and is useful only once the rest is up.
  order: 80

storage:
  # Homepage reads its whole configuration from this directory. It is the
  # only state the stack has, and it is also authored in this repo, so a
  # restore and a redeploy produce the same page.
  - host_path: /appdata/home/homepage-config
    mount_point: /appdata/home/homepage-config
    # The image runs as root by default; 100000 is root mapped out of an
    # unprivileged LXC.
    host_owner_uid: 100000
    app: homepage

apps: [homepage]
latch_secrets: [homepage]

gateway_route:
  filename: 115-app-home.yml
  gateway_vmid: 104

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 115 (home), home: the homepage dashboard.
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.17
      proto: tcp
      dport: "5000:5003"
      note: registry cache (docker pulls; the deploy probes all four)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.6
      proto: tcp
      dport: "8096,8989,7878,6767,9696,5055"
      note: media widgets
    - dir: out
      action: ACCEPT
      dest: 10.10.10.14
      proto: tcp
      dport: "8000"
      note: Paperless widget
    - dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3000"
      note: Grafana widget (Grafana on the metrics stack since fix-90)
    - dir: out
      action: ACCEPT
      dest: 10.10.5.250
      proto: tcp
      dport: "8006"
      note: Proxmox widget
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "3000"
      note: Traefik route
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8081,9100"
      note: Prometheus (cadvisor, node exporter)
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "3000"
      note: Uptime Kuma HTTP monitor
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,3000"
      note: Kenny's desktop (ssh and the web ports the homepage tiles link to)
