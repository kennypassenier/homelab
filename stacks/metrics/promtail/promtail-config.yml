server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://10.10.10.4:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          stack: metrics
          host: 113-app-metrics
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
      - json:
          expressions:
            # `tag`, bare: `source: attrs` already puts us inside the attrs
            # object docker writes when the daemon carries the tag log-opt.
            container_name: tag
          source: attrs
      - labels:
          stream:
          container_name:
      - output:
          source: output
