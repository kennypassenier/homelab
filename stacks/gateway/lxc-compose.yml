# The front door. Everything from outside the house arrives here, so this is
# the one container whose absence is total: while it is down there is no
# Jellyfin, no *arr suite, and no remote Home Assistant.
#
# Renamed from `platform` (its v1 hostname was lxc-platform-stack, which A2
# refuses). The code has said `gateway_vmid: 104` all along.
#
# Uptime Kuma used to live here and moved to CT 107 on 2026-09-01 (D68): a
# watchman on the roof he guards goes down with it, which is exactly what
# happened on 2026-08-31.
#
# Grafana and Loki ran here until 2026-09-27 and moved to the metrics stack
# (fix-90; Kenny's triage answer to gateway-shared-no-limits): a Loki query
# storm competed with Traefik in one cgroup, and when this container went
# down the logs and dashboards that would explain it went down with it. The
# move waited until after this container's rebuild on purpose (form H2).
# OPNsense's syslog receiver stays here, below: the firewall sends to this
# address, and the receiver is Alloy, not Loki.
stack_name: gateway
vmid: 104
hostname: 104-app-gateway

network:
  ip: 10.10.10.4/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 4
  memory_mb: 5120
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 1024 MB.

  swap_mb: 0
  disk_gb: 30
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: "nesting=1,keyctl=1"
  protection: false
  gpu: false
  vpn: false

boot:
  onboot: true
  # First of the managed containers. Everything else is reachable through it,
  # and a stack that boots before its own front door spends its first minutes
  # unreachable for a reason that has nothing to do with itself.
  order: 5

storage:
  - host_path: /appdata/gateway/traefik-config
    mount_point: /appdata/gateway/traefik-config
    host_owner_uid: 100000
    app: traefik
  # 165532: cloudflared's image runs as the nonroot user 65532, not as root.
  # The directory is empty today, so nothing has ever needed to write to it —
  # which is exactly why this went unnoticed until the ownership check asked
  # the image instead of trusting the number (F137).
  #
  # `no_data` says that emptiness is the design, not an accident. The tunnel's
  # ingress rules and every Access policy live in the Cloudflare dashboard and
  # nowhere on disk (F12). Before this was declared, the empty-snapshot guard
  # refused the directory — correctly — and in doing so stopped the gateway's
  # backup before grafana, loki and goaccess were ever attempted (F154). Now
  # the app simply has no repository, and a directory that fills up anyway
  # fails the backup with a sentence saying so.
  - host_path: /appdata/gateway/cloudflared-config
    mount_point: /appdata/gateway/cloudflared-config
    host_owner_uid: 165532
    app: cloudflared
    no_data: true
  - host_path: /appdata/gateway/crowdsec-config
    mount_point: /appdata/gateway/crowdsec-config
    host_owner_uid: 100000
    app: crowdsec
  - host_path: /appdata/gateway/goaccess-config
    mount_point: /appdata/gateway/goaccess-config
    host_owner_uid: 100000
    app: goaccess

# G3: Traefik's access log is 145 of the 146 MB under traefik-config, and it
# is data that is different tomorrow and never restored. Borrowed from a pool
# outside /appdata, so the nightly snapshot drops from 146 MB to 1.2 MB.
#
# Only the HOST side moves. Inside the containers the path stays
# /var/log/traefik, because Traefik writes it, CrowdSec parses it and GoAccess
# reports on it — three readers whose configuration should not have to know
# where the bytes physically live.
data_mounts:
  - host_path: /HDD2TB/logs/traefik
    mount_point: /mnt/traefik-logs
    note: "Traefik access + rotated logs. Regenerable, deliberately outside the backup."
    # fix-24: the deploy writes /etc/logrotate.d/homelab-gateway from this.
    # A hand-added rule rotated the file until CT 104 was rebuilt on
    # 2026-09-01; after that it grew 25 days unrotated (254 MB).
    rotate:
      files: access.log
      keep: 14
      reopen:
        container: traefik
        signal: USR1

apps: [traefik, cloudflared, crowdsec, goaccess]

latch_secrets: [traefik, cloudflared]

gateway_route:
  filename: 104-app-gateway.yml

# fix-91 (expert panel, routes-outside-repo-unvalidated, 2026-09-27): the
# routes to what homelab does not manage. Home Assistant (VM 101), OPNsense
# (VM 100) and Proxmox itself are no stacks, but the route to each lives on
# this gateway, so it belongs to this stack. Both files were written by hand
# on CT 104 and lived nowhere else; routes/ holds them byte for byte, read
# from CT 104 the day they were brought in, under the names they have there,
# so the first deploy changes nothing.
#
# `external` names every backend in the file that is not a stack's own
# container, exactly as the file writes it. `homelab plan`, `deploy` and
# `apply` refuse a backend that is neither a stack's address nor declared
# here (fix-92), so a route to the management network cannot appear without
# a line in this file saying so.
extra_routes:
  - filename: manual-homeassistant.yml
    external: ["http://10.10.10.2:8123"]
  # ha.kp-soft.dev above; opn.kp-soft.dev and prox.kp-soft.dev here — the
  # OPNsense and Proxmox login pages.
  - filename: manual-routes.yml
    external: ["https://10.10.5.1", "https://10.10.5.250:8006"]


# gap-11 (2026-09-18): OPNsense ships its logs here as RFC 5424 over UDP —
# `System › Settings › Logging / targets` on the firewall names
# 10.10.10.4:1514. The log shipper opens the port and labels every line
# `{job="syslog", stack="gateway", host="opnsense"}`; app, level and facility
# come out of the message. Port 1514 because Alloy runs unprivileged and
# cannot bind 514. Change the port here AND on the firewall, or one side
# talks to nobody.
syslog_receivers:
  - host: opnsense
    listen: 0.0.0.0:1514
    protocol: udp
    format: rfc5424
    # fix-93 (Kenny's answer to loki-unauthenticated-open, 2026-09-27: only
    # OPNsense). Lines from any other sender are dropped before they reach
    # Loki, so no container can write lines labelled as the firewall. The
    # address is the firewall's VLAN 10 interface, not 10.10.5.1: measured on
    # CT 104's veth that day, every packet to 1514 came from 10.10.10.1. The
    # port itself stays reachable; only a firewall rule can close it.
    allow_from: [10.10.10.1]

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 104 (gateway), the gateway: Traefik, cloudflared, CrowdSec, Grafana, Loki, GoAccess.
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
    Port 80 is open to nobody (traefik-lan-host-header-bypass): the tunnel reaches
    Traefik over gateway_net inside this container (172.18.0.1 in the access log),
    which never crosses the veth. Uptime Kuma's bare-Host monitor on :80 has to move
    before this is enabled.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.17
      proto: tcp
      dport: "5000:5003"
      note: registry cache (docker pulls; the deploy probes all four)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.5
      proto: tcp
      dport: "8080"
      note: route qbit
    - dir: out
      action: ACCEPT
      dest: 10.10.10.6
      proto: tcp
      dport: "8096,8989,7878,6767,9696,5055"
      note: media routes
    - dir: out
      action: ACCEPT
      dest: 10.10.10.7
      proto: tcp
      dport: "3001"
      note: Uptime Kuma routes
    - dir: out
      action: ACCEPT
      dest: 10.10.10.8
      proto: tcp
      dport: "8384"
      note: Syncthing GUI route
    - dir: out
      action: ACCEPT
      dest: 10.10.10.9
      proto: tcp
      dport: "8080"
      note: kyu route
    - dir: out
      action: ACCEPT
      dest: 10.10.10.11
      proto: tcp
      dport: "1900"
      note: SuperSync route
    - dir: out
      action: ACCEPT
      dest: 10.10.10.12
      proto: tcp
      dport: "8080"
      note: almanac route
    - dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3000,3100,9090,9093"
      note: prom and alerts routes, Grafana's datasource
    - dir: out
      action: ACCEPT
      dest: 10.10.10.14
      proto: tcp
      dport: "5006,8080,8000"
      note: paperwork routes
    - dir: out
      action: ACCEPT
      dest: 10.10.10.15
      proto: tcp
      dport: "3000"
      note: homepage route
    - dir: out
      action: ACCEPT
      dest: 10.10.10.16
      proto: tcp
      dport: "8080,8787"
      note: kp-soft routes (116.fw lets both in)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.2
      proto: tcp
      dport: "8123"
      note: Home Assistant route
    - dir: out
      action: ACCEPT
      dest: 10.10.5.1
      proto: tcp
      dport: "443"
      note: hand-written route opn (OPNsense GUI)
    - dir: out
      action: ACCEPT
      dest: 10.10.5.250
      proto: tcp
      dport: "8006"
      note: hand-written route prox (Proxmox GUI)
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.1
      proto: udp
      dport: "1514"
      note: OPNsense syslog into Alloy
    - dir: in
      action: ACCEPT
      source: 10.10.10.0/24
      proto: tcp
      dport: "3100"
      note: Loki push from every container's Alloy and from pve
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8081,8082,9100"
      note: Prometheus (cadvisor, traefik metrics, node exporter)
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "3000,3100"
      note: Uptime Kuma HTTP monitors (Grafana, Loki)
    - dir: in
      action: ACCEPT
      source: 10.10.10.15
      proto: tcp
      dport: "3000"
      note: homepage's Grafana widget
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,7880,7881"
      note: Kenny's desktop (ssh, GoAccess report and its websocket)
