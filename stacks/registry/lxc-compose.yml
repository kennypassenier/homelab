# Stack intent (schema v2 — intent only, no machine-written state).
#
# registry: a pull-through cache for the images this fleet pulls, so the
# length of an outage stops depending on a registry on the internet having a
# good evening.
#
# Kenny chose it (form M3, 2026-08-31) to be built BEFORE the media container
# is rebuilt, and the reason is arithmetic: the M7 drill lost 573 of 653
# seconds to one stalled pull, and media has nine images waiting where the
# home page had one.
#
# Its own container because it is infrastructure for every other stack: it
# must be up before anything else pulls, and it must not go down with the
# stack it happens to live on.

stack_name: registry
vmid: 117
hostname: 117-app-registry

network:
  ip: 10.10.10.17/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10

resources:
  cores: 2
  memory_mb: 1024
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 512 MB.

  swap_mb: 0
  # A cache of the fleet's images: about 6 GB of distinct layers today, and
  # it only ever holds what was actually asked for.
  disk_gb: 32
  storage: local-lvm

lxc:
  template: clone:996
  unprivileged: true
  features: nesting=1,keyctl=1
  protection: true

boot:
  # Early: everything that pulls an image wants this up first. Right after
  # the edge (5) and before every application stack.
  onboot: true
  order: 10

storage:
  - host_path: /appdata/registry/registry-config
    mount_point: /appdata/registry/registry-config
    # The registry image runs as root.
    host_owner_uid: 100000
    app: registry
    # Z3 (Kenny, 2026-09-02). Measured that night: 1381 MB and 457 seconds,
    # the slowest of the thirteen stacks and a fifth of the whole nightly
    # round — to protect layers that are re-downloadable by definition. That
    # is what a pull-through cache IS. A restored cache would also be a cache
    # full of months-old layers, replaced by the next pull anyway.
    no_backup: >-
      a pull-through cache: every layer is re-downloadable from its upstream
      registry, so a lost cache costs one slow pull and nothing else.
      Measured 2026-09-02: backing it up cost 1381 MB and 457 s per night,
      a fifth of the whole round, for data that protects nothing

apps: [registry]

# No route: this is spoken to by Docker daemons on the LAN, never by a
# browser from outside, and it holds no secrets worth reaching for.

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 117 (registry), the registry pull-through cache.
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.13
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.0/24
      proto: tcp
      dport: "5000:5003"
      note: docker pulls from every container (and Uptime Kuma's monitor on 5000)
    - dir: in
      action: ACCEPT
      source: 10.10.10.13
      proto: tcp
      dport: "8081,9100"
      note: Prometheus (cadvisor, node exporter)
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22"
      note: Kenny's desktop (ssh)
