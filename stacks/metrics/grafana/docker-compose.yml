# Grafana. On the metrics stack since 2026-09-27 (fix-90, Kenny's triage
# answer to gateway-shared-no-limits), beside the Prometheus and Loki it
# reads; it ran on the gateway until then, and moved only after that
# container's rebuild (form H2).
services:
  grafana:
    # fix-82 (manual-images-latest-unpinned, 2026-09-27): the version and
    # digest CT 104 ran that day; moving it is an edit of this line.
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    container_name: grafana
    networks:
      - metrics_net
    user: "1000:1000"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_GF_ADMIN_PASSWORD}
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/homelab-overview.json
    volumes:
      - /appdata/metrics/grafana-config:/var/lib/grafana
      # One mount, not two. The dashboards the ORCHESTRATOR generates live in
      # `provisioning/dashboards-generated/` — a sibling of the committed
      # `dashboards/`, so the repository owns one directory and the deploy
      # owns the other and neither writes the other's files (Kenny, form B3).
      #
      # A second bind mount was tried first and cannot work: docker has to
      # create the mountpoint inside `/etc/grafana/provisioning`, which this
      # line has just mounted read-only, and it fails with "read-only file
      # system" at container start. Grafana was down for four minutes finding
      # that out (F159).
      - ./provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    labels:
      # grafana.db held 19 dashboards when this was written; on Grafana 13
      # they live in unified storage, so `select count(*) from dashboard`
      # answers 0 and the API is the only honest count.
      - "com.homelab.backup.pause=true"
      # Y1/Z1: UPDATE_POLICY.md puts this in the MANUAL class - a silent
      # failure here is expensive. The label read auto until 2026-09-02
      # (F192), so the ratified decision and the fleet disagreed for as long
      # as both existed.
      - "com.homelab.update.policy=manual"
      - "com.homelab.update.upstream=github.com/grafana/grafana"

# The stack's one network, created by the deploy: Grafana reaches Prometheus
# and Loki on it by container name.
networks:
  metrics_net:
    external: true
    name: metrics_net
