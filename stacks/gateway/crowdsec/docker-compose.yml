services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: gateway-crowdsec
    environment:
      - TZ=Europe/Brussels
      # Parse Nginx Proxy Manager access logs and detect common attacks.
      - COLLECTIONS=crowdsecurity/nginx-proxy-manager
    restart: unless-stopped
    volumes:
      # CrowdSec runtime config — writable, stores decisions and hub data.
      - /opt/gitops/stacks/gateway/crowdsec-config:/etc/crowdsec
      # CrowdSec runtime data (decisions, metrics) — subfolder of crowdsec-config so
      # a single backup pass on crowdsec-config captures everything.
      - /opt/gitops/stacks/gateway/crowdsec-config/data:/var/lib/crowdsec/data
      # NPM logs :ro — CrowdSec only reads these files.
      - /opt/gitops/stacks/gateway/nginx-proxy-manager-config/data/logs:/var/log/npm:ro
    env_file:
      - .env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.homelab.backup.pause=true"
