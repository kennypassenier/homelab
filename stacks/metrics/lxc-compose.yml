stack_name: metrics
vmid: 113
hostname: 113-app-metrics
network:
  ip: 10.10.10.13/24
  gateway: 10.10.10.1
  bridge: vmbr0
  vlan: 10
resources:
  cores: 2
  memory_mb: 1024
  # W1 (Kenny, 2026-09-02): none. Measured that night, the container's own

  # programs used between 4% and 37% of this limit — nothing here has ever

  # been short of memory. What filled the swap was page cache reaching the

  # limit during heavy reads, and the kernel then evicting the PROGRAM to

  # keep the cache, which is exactly backwards. At zero it drops the cache

  # instead, and that costs a re-read. Was 512 MB.

  swap_mb: 0
  disk_gb: 16
  storage: local-lvm
lxc:
  template: clone:998
  unprivileged: true
  features: nesting=1,keyctl=1
  protection: true
boot:
  onboot: true
  order: 60
storage:
  # D25: the app that owns this directory decides which restic repository
  # it lands in, so Prometheus keeps its history if it ever moves stack.
  - host_path: /appdata/metrics/prometheus-config
    mount_point: /appdata/metrics/prometheus-config
    host_owner_uid: 165534
    # Not backed up (Kenny, triage 2026-09-27: "Meetdata niet back-uppen,
    # alleen configuratie"): the TSDB and the generated targets/ files are
    # regenerable, and copying them meant stopping Prometheus every night.
    no_backup: "Prometheus TSDB and generated scrape targets; regenerable, configuration is in the repository"
    app: prometheus
  # Alertmanager's silences and notification log. It was bind-mounted by its
  # compose file and declared nowhere, so docker created it on the container
  # rootfs — unbacked-up and lost on any rebuild. Found live 2026-08-30 while
  # renaming the path above; the directory was still empty, so nothing was
  # lost, which is luck rather than design.
  - host_path: /appdata/metrics/alertmanager-config
    mount_point: /appdata/metrics/alertmanager-config
    host_owner_uid: 165534
    app: alertmanager
# alertmanager was deployed by hand on 2026-08-30 and was missing here, so a
# deploy of this stack would not have started it.
apps: [prometheus, alertmanager, pve-exporter]
latch_secrets: [pve-exporter]

# Pushes traefik-routes.yml to the gateway's watched routes directory.
gateway_route:
  filename: 113-app-metrics.yml
  gateway_vmid: 104

# fix-89: this container's Proxmox firewall (fix-88), declared but NOT in force:
# Kenny's rollout goes one stack at a time, by setting `enabled: true` here and
# deploying. Every rule comes from a flow measured on 2026-09-27; the test
# core/tests/firewall_declarations_tests.rs holds the rules against that list.
# The management network stays closed except DNS to 10.10.5.1 (the guard the
# renderer appends) and what an ACCEPT below names.
firewall:
  enabled: false
  comment: |-
    CT 113 (metrics), metrics: Prometheus, Alertmanager, pve-exporter.
    Declared from the flows measured 2026-09-27 (fix-89): tcpdump on pve's veths,
    conntrack and ss in the container, the Prometheus targets, the Uptime Kuma
    monitors, the Traefik routes and the stacks' own configuration.
  rules:
    - comment: "pve's rescue address: never from a container"
      dir: out
      action: DROP
      dest: 10.10.10.250
    - comment: "the neighbours it uses"
      dir: out
      action: ACCEPT
      dest: 10.10.10.4
      proto: tcp
      dport: "3100"
      note: Loki push (Alloy)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.17
      proto: tcp
      dport: "5000:5003"
      note: registry cache (docker pulls; the deploy probes all four)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.0/24
      proto: tcp
      dport: "8081,9100"
      note: scrapes of cadvisor and node exporter on every container (file_sd)
    - dir: out
      action: ACCEPT
      dest: 10.10.10.4
      proto: tcp
      dport: "8082"
      note: scrape of traefik metrics
    - dir: out
      action: ACCEPT
      dest: 10.10.10.9
      proto: tcp
      dport: "8080"
      note: scrape kyu, and Alertmanager's webhook to kyu
    - dir: out
      action: ACCEPT
      dest: 10.10.10.12
      proto: tcp
      dport: "8080"
      note: scrape almanac
    - dir: out
      action: ACCEPT
      dest: 10.10.5.250
      proto: tcp
      dport: "8006,9100"
      note: pve-exporter to pve's API, and pve's node exporter
    - comment: "every other neighbour in VLAN 10 stays out of reach"
      dir: out
      action: DROP
      dest: 10.10.10.0/24
    - comment: "who may reach the container"
      dir: in
      action: ACCEPT
      source: 10.10.10.4
      proto: tcp
      dport: "9090,9093"
      note: Traefik routes prom and alerts, Grafana's datasource
    - dir: in
      action: ACCEPT
      source: 10.10.10.250
      proto: tcp
      dport: "9090"
      note: the homelab daemon's queries from pve
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: icmp
      note: Uptime Kuma ping
    - dir: in
      action: ACCEPT
      source: 10.10.10.7
      proto: tcp
      dport: "9090,9093"
      note: Uptime Kuma HTTP monitors
    - dir: in
      action: ACCEPT
      source: 10.10.10.10
      proto: tcp
      dport: "22,9090,9093"
      note: Kenny's desktop (ssh and the web ports the homepage tiles link to)
